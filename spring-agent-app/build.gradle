plugins {
  alias(libs.plugins.spring.boot)
  alias(libs.plugins.spring.dependency.management)
  id 'springagent.java-common-conventions'
  id 'springagent.docker'
  id 'application'
}

def patchJvmArgs = [
  "--add-opens=java.base/java.io=ALL-UNNAMED",
  "--add-opens=java.base/java.lang=ALL-UNNAMED",
  "--add-opens=java.base/java.time=ALL-UNNAMED",
  "--add-opens=java.base/java.util=ALL-UNNAMED",
  "--add-opens=java.base/sun.nio.ch=ALL-UNNAMED"
]

dependencies {
  implementation project(':spring-agent-core')
  implementation project(':spring-agent-integration-feishu')

  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
  implementation 'io.micrometer:micrometer-registry-prometheus'

  implementation platform(libs.spring.ai.bom)

  // Internals of the library modules; the assembly test mocks these beans.
  testImplementation platform(libs.fabric8.kubernetes.client.bom)
  testImplementation libs.larksuite.oapi
  testImplementation libs.fabric8.kubernetes.client

  // Internals of the core module; the chat memory tests assert which backend got wired.
  testImplementation 'org.springframework.ai:spring-ai-model-chat-memory-repository-mongodb'
  // The HikariCP exclusion mirrors spring-agent-core/build.gradle: a connection pool on the
  // classpath switches DataSourceAutoConfiguration on, which breaks the MongoDB-backed context.
  testImplementation('org.springframework.ai:spring-ai-model-chat-memory-repository-jdbc') {
    exclude group: 'com.zaxxer', module: 'HikariCP'
  }
  // Likewise for the vector store tests, which assert which store got wired.
  testImplementation 'org.springframework.ai:spring-ai-vector-store'
  testImplementation 'org.springframework.ai:spring-ai-milvus-store'

  testImplementation libs.testcontainers.core
  testImplementation libs.testcontainers.mongodb
  testImplementation libs.testcontainers.milvus
  testImplementation libs.testcontainers.junit.jupiter

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.boot:spring-boot-testcontainers'
  testImplementation 'org.springframework.ai:spring-ai-spring-boot-testcontainers'
}

application { applicationDefaultJvmArgs += patchJvmArgs }

bootJar {
  from('Aptfile')
}
