plugins {
  alias(libs.plugins.spring.boot)
  alias(libs.plugins.spring.dependency.management)
  id 'springagent.java-common-conventions'
  id 'springagent.docker'
  id 'springagent.native'
  id 'application'
  // Applied below instead of here, see the conditional. Note `apply false` still makes the plugin
  // resolvable by id, which is what pluginManager.apply needs.
  alias(libs.plugins.graalvm) apply false
}

// Gated rather than applied unconditionally: Spring Boot's NativeImagePluginAction stamps
// `Spring-Boot-Native-Processed: true` into the bootJar manifest as soon as the GraalVM plugin is
// applied, and the Paketo spring-boot buildpack switches to a native build on that attribute. There
// is only one bootJar, so this cannot be scoped per task — applying it unconditionally would turn a
// plain `./gradlew bootBuildImage` native as a side effect. The cost of the gate is that native
// tasks are invisible to `./gradlew tasks` and to the IDE unless -Pnative is passed.
if (providers.gradleProperty('native').present) {
  pluginManager.apply('org.graalvm.buildtools.native')
}

def patchJvmArgs = [
  // The Feishu SDK's shaded protobuf reads arrays through sun.misc.Unsafe, which every JDK 24 or
  // later warns about on startup. Nothing here can fix the call itself:
  // larksuite-oapi-shaded-protobuf 2.4.6 is the newest published version, so even upgrading
  // oapi-sdk keeps it, and the method is slated for removal — the SDK needs an upstream fix
  // eventually, this only quiets the warning until then.
  //
  // Requires JDK 24+: on an older JVM it is a fatal "Unrecognized option". That is why the container
  // pins BP_JVM_VERSION 25 rather than following the buildpack's inference.
  "--sun-misc-unsafe-memory-access=allow",
  // sqlite-jdbc loads its bundled native library through System::load.
  "--enable-native-access=ALL-UNNAMED",
  "--add-opens=java.base/java.io=ALL-UNNAMED",
  "--add-opens=java.base/java.lang=ALL-UNNAMED",
  "--add-opens=java.base/java.time=ALL-UNNAMED",
  "--add-opens=java.base/java.util=ALL-UNNAMED",
  "--add-opens=java.base/sun.nio.ch=ALL-UNNAMED"
]

dependencies {
  implementation project(':spring-agent-core')
  // Both, deliberately. An SDK consumer picks one and configures nothing; this application is the
  // runtime-switchable case app.persistence.type exists for, and PersistenceJdbcTest and
  // PersistenceMongoTest assert each backend from a single JVM classpath.
  implementation project(':spring-agent-persistence-jdbc')
  implementation project(':spring-agent-persistence-mongodb')
  // Optional for an SDK consumer. Depending on it decides nothing: app.ai.tools.shell.type does,
  // and it defaults to none.
  implementation project(':spring-agent-tools-shell-kubernetes')
  implementation project(':spring-agent-integration-feishu')

  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
  implementation 'io.micrometer:micrometer-registry-prometheus'

  implementation platform(libs.spring.ai.bom)

  // Moved down from spring-agent-core, which used to carry it for every consumer: this starter
  // brings milvus-sdk-java, grpc, protobuf, okhttp and kotlin-stdlib. Spring AI's own
  // auto-configuration backs off unless spring.ai.vectorstore.type is milvus, so having it here
  // costs a deployment that runs the simple store nothing but disk.
  implementation 'org.springframework.ai:spring-ai-starter-vector-store-milvus'

  // Internals of the library modules; the assembly test mocks these beans.
  testImplementation platform(libs.fabric8.kubernetes.client.bom)
  testImplementation libs.larksuite.oapi
  testImplementation libs.fabric8.kubernetes.client

  // The chat memory tests assert which backend got wired; they reach both repository types through
  // the two spring-agent-persistence-* modules, which expose them as api. These used to be
  // re-declared here because spring-agent-core hid them behind implementation.
  testImplementation libs.testcontainers.core
  testImplementation libs.testcontainers.mongodb
  testImplementation libs.testcontainers.milvus
  testImplementation libs.testcontainers.junit.jupiter

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.boot:spring-boot-testcontainers'
  testImplementation 'org.springframework.ai:spring-ai-spring-boot-testcontainers'
}

application { applicationDefaultJvmArgs += patchJvmArgs }

bootJar {
  from('Aptfile')
}
