plugins {
  alias(libs.plugins.spring.boot)
  alias(libs.plugins.spring.dependency.management)
  id 'springagent.java-common-conventions'
  // Before springagent.native, whose bootBuildImage block overrides parts of this one.
  id 'springagent.docker'
  id 'springagent.native'
  id 'application'
  // Applied below instead of here, see the conditional. Note `apply false` still makes the plugin
  // resolvable by id, which is what pluginManager.apply needs.
  alias(libs.plugins.graalvm) apply false
}

// Gated rather than applied unconditionally: Spring Boot's NativeImagePluginAction stamps
// `Spring-Boot-Native-Processed: true` into the bootJar manifest as soon as the GraalVM plugin is
// applied, and the Paketo spring-boot buildpack switches to a native build on that attribute. There
// is only one bootJar, so this cannot be scoped per task — applying it unconditionally would turn a
// plain `./gradlew bootBuildImage` native as a side effect. The cost of the gate is that native
// tasks are invisible to `./gradlew tasks` and to the IDE unless -Pnative is passed.
if (providers.gradleProperty('native').present) {
  pluginManager.apply('org.graalvm.buildtools.native')
}

def patchJvmArgs = [
  // The Feishu SDK's shaded protobuf reads arrays through sun.misc.Unsafe, which JDK 25 warns about
  // on every startup. Nothing here can fix it: larksuite-oapi-shaded-protobuf 2.4.6 is the newest
  // published version, so even upgrading oapi-sdk keeps the same call. This silences the warning
  // without changing behaviour — but the method is slated for removal, so the SDK will eventually
  // need an upstream fix rather than this flag.
  "--sun-misc-unsafe-memory-access=allow",
  // sqlite-jdbc loads its bundled native library through System::load.
  "--enable-native-access=ALL-UNNAMED",
  "--add-opens=java.base/java.io=ALL-UNNAMED",
  "--add-opens=java.base/java.lang=ALL-UNNAMED",
  "--add-opens=java.base/java.time=ALL-UNNAMED",
  "--add-opens=java.base/java.util=ALL-UNNAMED",
  "--add-opens=java.base/sun.nio.ch=ALL-UNNAMED"
]

dependencies {
  implementation project(':spring-agent-core')
  implementation project(':spring-agent-integration-feishu')

  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
  implementation 'io.micrometer:micrometer-registry-prometheus'

  implementation platform(libs.spring.ai.bom)

  // Internals of the library modules; the assembly test mocks these beans.
  testImplementation platform(libs.fabric8.kubernetes.client.bom)
  testImplementation libs.larksuite.oapi
  testImplementation libs.fabric8.kubernetes.client

  // Internals of the core module; the chat memory tests assert which backend got wired.
  testImplementation 'org.springframework.ai:spring-ai-model-chat-memory-repository-mongodb'
  // The HikariCP exclusion mirrors spring-agent-core/build.gradle: a connection pool on the
  // classpath switches DataSourceAutoConfiguration on, which breaks the MongoDB-backed context.
  testImplementation('org.springframework.ai:spring-ai-model-chat-memory-repository-jdbc') {
    exclude group: 'com.zaxxer', module: 'HikariCP'
  }
  // Likewise for the vector store tests, which assert which store got wired.
  testImplementation 'org.springframework.ai:spring-ai-vector-store'
  testImplementation 'org.springframework.ai:spring-ai-milvus-store'

  testImplementation libs.testcontainers.core
  testImplementation libs.testcontainers.mongodb
  testImplementation libs.testcontainers.milvus
  testImplementation libs.testcontainers.junit.jupiter

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.boot:spring-boot-testcontainers'
  testImplementation 'org.springframework.ai:spring-ai-spring-boot-testcontainers'
}

application { applicationDefaultJvmArgs += patchJvmArgs }

bootJar {
  from('Aptfile')
}
