plugins {
  id "java"
  id "com.diffplug.spotless"
  id "org.gradle.test-retry"
}

group = 'me.kezhenxu94'

boolean isCiServer = System.getenv().containsKey("CI")
java {
  test {
    useJUnitPlatform()
    filter {
      failOnNoMatchingTests = false
    }
    if (isCiServer) {
      retry {
        maxRetries = 2
      }
      maxHeapSize = '1200m'
    }
    maxParallelForks = Math.min(Runtime.runtime.availableProcessors(), 8)
  }
}

// `options.release` rather than source/targetCompatibility: those two only set -source/-target,
// which pins the bytecode level but still compiles against the build JDK's API surface. The build
// JDK is a GraalVM 25 (native-image requires it), so without --release a call to an
// API added after 21 would compile here and fail with a NoSuchMethodError on a 21 runtime.
// Applied to every JavaCompile so compileTestJava and Spring Boot's generated compileAotJava are
// covered too, not just compileJava.
tasks.withType(JavaCompile).configureEach {
  options.release = 21
  options.compilerArgs << '-parameters'
  options.encoding = 'UTF-8'
}

// Here rather than in springagent.publish so spring-agent-app's javadoc is configured too.
tasks.withType(Javadoc).configureEach {
  options.encoding = 'UTF-8'
  // Every doclint check but missing comments: javadoc runs over delombok'd sources (see
  // springagent.publish), where most missing comments are on members Lombok generated.
  options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

configurations {
  compileOnly {
    extendsFrom annotationProcessor
  }
}

dependencies {
  compileOnly 'org.projectlombok:lombok'
  testCompileOnly 'org.projectlombok:lombok'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  annotationProcessor 'org.projectlombok:lombok'
  testAnnotationProcessor 'org.projectlombok:lombok'
}

spotless {
  java {
    googleJavaFormat('1.35.0').reflowLongStrings()
  }
}
tasks.withType(Test).configureEach {
  useJUnitPlatform()
}
