// GitHub Packages serves Maven from maven.pkg.github.com; ghcr.io is the container registry only.

plugins {
  id 'maven-publish'
}

java {
  withSourcesJar()
  withJavadocJar()
}

publishing {
  publications {
    maven(MavenPublication) {
      from components.java

      pom {
        name = project.name
        url = 'https://github.com/kezhenxu94/spring-agent'
        scm {
          url = 'https://github.com/kezhenxu94/spring-agent'
          connection = 'scm:git:https://github.com/kezhenxu94/spring-agent.git'
        }
      }
    }
  }

  repositories {
    maven {
      name = 'GitHubPackages'
      url = 'https://maven.pkg.github.com/kezhenxu94/spring-agent'
      // From the environment, matching springagent.docker.gradle: a token passed as -P shows up in
      // the process arguments of every build.
      credentials {
        username = providers.environmentVariable('GITHUB_ACTOR').orNull
        password = providers.environmentVariable('GITHUB_TOKEN').orNull
      }
    }
  }
}

// Javadoc reads source and has no `-proc` option on any current JDK, so Lombok never runs for it
// and every generated type — `TemplateContent.TemplateContentBuilder` and friends — is a hard
// error. Delombok expands the annotations into real source first.
//
// A task rather than the io.freefair.lombok plugin, which would also take over the BOM-managed
// lombok version and generate its own lombok.config over this repository's.
def delombok = tasks.register('delombok', JavaExec) {
  description = 'Expands Lombok annotations into plain source for javadoc.'
  def outputDir = layout.buildDirectory.dir('delombok')
  def mainSources = sourceSets.main.java
  def compileClasspath = sourceSets.main.compileClasspath

  inputs.files(mainSources).withPathSensitivity(PathSensitivity.RELATIVE)
  outputs.dir(outputDir)

  // annotationProcessor already carries lombok, at the BOM-managed version.
  classpath = configurations.annotationProcessor
  mainClass = 'lombok.launch.Main'
  // lombok.permit.Permit opens the compiler's internals through sun.misc.Unsafe, which every JDK 24
  // or later warns about. Only Lombok can fix the call; this quiets it meanwhile.
  jvmArgs '--sun-misc-unsafe-memory-access=allow'
  argumentProviders.add({
    ['delombok', '--encoding', 'UTF-8', '--classpath', compileClasspath.asPath,
     '-d', outputDir.get().asFile.absolutePath] + mainSources.srcDirs*.absolutePath
  } as CommandLineArgumentProvider)
}

javadoc {
  source = delombok.map { it.outputs.files.asFileTree.matching { include '**/*.java' } }
}
