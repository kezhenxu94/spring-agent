// Two destinations, deliberately different mechanisms. GitHub Packages is an ordinary Maven
// repository, so `maven-publish` uploads to it directly (it serves Maven from
// maven.pkg.github.com; ghcr.io is the container registry only). Maven Central is not: the Central
// Portal takes a single signed zip of the whole multi-module deployment over its own API, which is
// what `com.gradleup.nmcp` builds here and the root project uploads.

plugins {
  id 'maven-publish'
  id 'signing'
  // Exposes this project's publications as an outgoing variant that the root project's
  // com.gradleup.nmcp.aggregation collects. Applying it does not by itself publish anything.
  id 'com.gradleup.nmcp'
}

java {
  withSourcesJar()
  withJavadocJar()
}

publishing {
  publications {
    maven(MavenPublication) {
      from components.java

      pom {
        name = project.name
        // Maven Central rejects a deployment whose POM has no description, so every module
        // applying this convention must set one in its own build.gradle. A provider because the
        // module's `description = ...` is assigned after this convention plugin is applied.
        description = project.provider { project.description }
        url = 'https://github.com/kezhenxu94/spring-agent'
        licenses {
          license {
            name = 'The Apache License, Version 2.0'
            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
          }
        }
        developers {
          developer {
            id = 'kezhenxu94'
            name = 'kezhenxu94'
            url = 'https://github.com/kezhenxu94'
          }
        }
        scm {
          url = 'https://github.com/kezhenxu94/spring-agent'
          connection = 'scm:git:https://github.com/kezhenxu94/spring-agent.git'
        }
      }
    }
  }

  repositories {
    maven {
      name = 'GitHubPackages'
      url = 'https://maven.pkg.github.com/kezhenxu94/spring-agent'
      // From the environment, matching springagent.docker.gradle: a token passed as -P shows up in
      // the process arguments of every build.
      credentials {
        username = providers.environmentVariable('GITHUB_ACTOR').orNull
        password = providers.environmentVariable('GITHUB_TOKEN').orNull
      }
    }
  }
}

// Maven Central requires a detached PGP signature next to every artifact; GitHub Packages does not
// care. `required` is therefore conditional on the key being present, so a local build and the
// GitHub Packages job — neither of which has the key — do not have to carry one.
def signingKey = providers.environmentVariable('SIGNING_KEY')
def signingPassword = providers.environmentVariable('SIGNING_PASSWORD')
signing {
  required { signingKey.present }
  // The armoured key itself rather than a keyring file or the gpg agent: a CI runner has neither,
  // and a secret is the only thing GitHub Actions can hand a build.
  useInMemoryPgpKeys(signingKey.orNull, signingPassword.orNull)
  sign publishing.publications.maven
}

// Javadoc reads source and has no `-proc` option on any current JDK, so Lombok never runs for it
// and every generated type — `TemplateContent.TemplateContentBuilder` and friends — is a hard
// error. Delombok expands the annotations into real source first.
//
// A task rather than the io.freefair.lombok plugin, which would also take over the BOM-managed
// lombok version and generate its own lombok.config over this repository's.
def delombok = tasks.register('delombok', JavaExec) {
  description = 'Expands Lombok annotations into plain source for javadoc.'
  def outputDir = layout.buildDirectory.dir('delombok')
  def mainSources = sourceSets.main.java
  def compileClasspath = sourceSets.main.compileClasspath

  inputs.files(mainSources).withPathSensitivity(PathSensitivity.RELATIVE)
  outputs.dir(outputDir)

  // annotationProcessor already carries lombok, at the BOM-managed version.
  classpath = configurations.annotationProcessor
  mainClass = 'lombok.launch.Main'
  // lombok.permit.Permit opens the compiler's internals through sun.misc.Unsafe, which every JDK 24
  // or later warns about. Only Lombok can fix the call; this quiets it meanwhile.
  jvmArgs '--sun-misc-unsafe-memory-access=allow'
  argumentProviders.add({
    ['delombok', '--encoding', 'UTF-8', '--classpath', compileClasspath.asPath,
     '-d', outputDir.get().asFile.absolutePath] + mainSources.srcDirs*.absolutePath
  } as CommandLineArgumentProvider)
}

javadoc {
  source = delombok.map { it.outputs.files.asFileTree.matching { include '**/*.java' } }
}
