pluginManagement {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    maven { url = 'https://repo.spring.io/release' }
    maven { url = 'https://repo.spring.io/milestone' }
    maven { url = 'https://repo.spring.io/snapshot' }
  }
}

dependencyResolutionManagement {
  repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://repo.spring.io/release' }
    maven { url = 'https://repo.spring.io/milestone' }
    maven { url = 'https://repo.spring.io/snapshot' }
  }
}

rootProject.name = 'spring-agent'

include 'spring-agent-core'
include 'spring-agent-persistence-jdbc'
include 'spring-agent-persistence-mongodb'
include 'spring-agent-tools-shell-kubernetes'
include 'spring-agent-integration-feishu'
include 'spring-agent-app'
