plugins {
  id 'springagent.java-library-conventions'
  id 'springagent.classpath-isolation'
}

description = 'Redis persistence backend for spring-agent-core.'

// The third of the backends a consumer of spring-agent-core picks between. Unlike the other two it
// stores the agent's records in a server that can be configured to throw them away: see the javadoc
// on RedisPersistenceAutoConfiguration for what a deployment owes this module in return.
dependencies {
  // api: the repository interfaces here implement spring-agent-core's neutral contracts, and the
  // domain models appear in their signatures.
  api project(':spring-agent-core')
  // The starter, like the MongoDB module and unlike the JPA one: Spring AI's own auto-configuration
  // is the wiring we want, and PersistenceAutoConfigurationFilter is what keeps it out of an
  // application that carries several backend modules and selected another. It also brings
  // spring-boot-starter-data-redis, which is where the repository support below comes from.
  //
  // api: ChatMemoryRedisTest asserts `instanceof RedisChatMemoryRepository`, and a consumer may
  // reasonably want to as well.
  //
  // The Lettuce exclusion is what makes Jedis the single driver for this module. Spring AI's chat
  // memory is built on Jedis and constructs its own client; leaving Boot's default in place would
  // mean two client libraries and two connection configurations pointed at one server, with only
  // documentation to keep them in step. Boot's JedisConnectionConfiguration takes over on
  // spring.data.redis.client-type=jedis, which spring-agent-app sets.
  api('org.springframework.ai:spring-ai-starter-model-chat-memory-repository-redis') {
    exclude group: 'io.lettuce', module: 'lettuce-core'
  }

  // Not used by anything here, and deliberately compileOnly so it stays off the runtime classpath.
  // It is here to keep javac quiet, for the same reason spring-agent-persistence-mongodb carries
  // it: reading spring-agent-core's multiply-mapped models turns every @Enumerated(EnumType.STRING)
  // and @ElementCollection(fetch = FetchType.EAGER) into an "unknown enum constant" warning when
  // the JPA API is absent. The warning is harmless — an annotation whose type cannot be resolved is
  // discarded, which is exactly what this module wants to happen — but twenty of them on every
  // build is how real warnings get ignored.
  compileOnly 'jakarta.persistence:jakarta.persistence-api'
}

forbidOnRuntimeClasspath(
    groups: ['org.hibernate.orm', 'jakarta.persistence', 'com.zaxxer', 'org.xerial', 'org.mongodb', 'io.lettuce'],
    modules: [
      'spring-jdbc',
      'spring-orm',
      'spring-boot-jdbc',
      'spring-boot-jpa',
      'spring-boot-hibernate',
      'spring-data-jpa',
      'spring-data-mongodb',
      'spring-boot-data-jpa',
      'spring-boot-mongodb',
      'spring-boot-data-mongodb',
      'spring-boot-starter-data-jpa',
      'spring-boot-starter-data-mongodb',
      'spring-boot-starter-jdbc',
      'spring-ai-model-chat-memory-repository-jdbc',
      'spring-ai-model-chat-memory-repository-mongodb',
    ])
