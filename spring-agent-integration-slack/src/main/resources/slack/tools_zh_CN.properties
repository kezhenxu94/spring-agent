SlackSendMessage.target=要发送到的频道 ID（C…/G…）或用户 ID（U…）
SlackSendMessage.text=消息内容，使用 Slack mrkdwn 格式书写
SlackSendMessage.threadTs=要回复到的话题串时间戳
SlackReadMessageHistory.channelId=要读取的频道 ID
SlackReadMessageHistory.threadTs=改为读取某个话题串的时间戳
SlackReadMessageHistory.limit=最多读取多少条，上限 100
SlackListChannels.limit=最多列出多少个频道，上限 200
SlackListChannelMembers.channelId=频道 ID
SlackSendFile.channelId=要上传到的频道 ID
SlackSendFile.path=本地文件的绝对路径
SlackSendFile.comment=随文件一起发送的一行说明
SlackSendFile.threadTs=要上传到的话题串时间戳
