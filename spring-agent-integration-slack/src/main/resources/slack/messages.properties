# Everything the agent writes into Slack itself, as opposed to what the model produced. Block Kit
# renders these as mrkdwn, so a literal asterisk or underscore here becomes emphasis — see
# SlackReplyFormat for the full set and how to escape one.

message-stop=Stop
message-conversation-hint=Replying in this thread continues the conversation.
message-error=:warning: The run failed: {0}
message-unknown-error=no reason was reported
# Shown while a tool call is out, on a subagent's panel, where there is no pane of its own to put
# it in. The run's own message keeps its calls in a collapsed section instead.
message-calling-tool=Working: {0}
# The section holding every tool call the turn made. Named by the tool rather than by what the
# model said the call was for, so the trail reads as a list of what was used.
message-tool-calls=*Tools* {0}
message-tool-calls-done=*Tools* ({0})
# What stands in for the calls too old to be worth a line each.
message-tool-calls-earlier=... and {0} earlier on the message above
message-image-unavailable=(an image that could not be uploaded)
# Slack allows a message 50 blocks, and a long turn outgrows that. When it does the agent finishes
# the message and posts another into the same thread, and this is the line that says so.
message-continued=Continued below.
message-todo=*Tasks* {0}
message-reasoning=*Thinking*
message-stop-not-yours=Only the person this run is answering can stop it.
# Said on the message, one quoted line each, when the user replies to a run that is still going.
message-queued=Seen: {0}
message-read=Read: {0}
# Where the message is not something a line can show - an image, a file. What it carries reaches
# the model when the message is read; this only says one arrived.
message-unshown=(a message that cannot be shown here)

question-select-hint=Choose one
question-other-hint=Or type an answer
question-submit=Submit
question-submitted=Thanks - picking that up now.
question-already-answered=That question has already been answered.
question-superseded=A later message overtook that question.
question-expired=That question is too old to answer now.
question-not-yours=That question was asked of somebody else.
question-nothing-chosen=Nothing was chosen, so nothing was sent.
question-answer-heading=You asked, and the answer is:
question-answer-heading-by-admin=You asked, and an administrator answered on their behalf:

background-run-failed=A run that nobody was watching failed: {0}

# A subagent's panel on the message. Deliberately not the word "background": a background run is a
# different thing here - one nothing is posted for at all - and a subagent is neither hidden nor
# unattended, it is work this turn is waiting on.
message-subagent-started=*{0}* working
message-subagent-completed=*{0}* done
message-subagent-cancelled=*{0}* stopped
message-subagent-failed=*{0}* failed
message-subagent-unnamed=Subagent

# Which documents the run was given before it answered. Read by a person, not the model, and it
# sits in the footer beside the spend - so it has to stay short.
message-references=*Sources* {0}
reference-scope-own=yours
reference-scope-group=the channel's
reference-scope-tenant=the workspace's

# How a channel message reads once it has been observed: the name the situation is given, and the
# line of evidence a triage run is shown. The agent's own framing, so it is translated - what was
# actually said is an argument and goes in untouched, in whatever language it was said in.
# Keep MessageFormat happy: no apostrophes, no stray braces.
chat-observation-title=Conversation in channel {0}
chat-observation-said={0} said: {1}

# The caption over the tappable suggestions on the welcome message.
welcome-suggest-hint=Tap one to ask it:
update-title={0,choice,1#What changed since you were last here|1<What changed since you were last here ({0} notes)}
update-version=v{0}
welcome-suggestion-taken=Asking that now...
