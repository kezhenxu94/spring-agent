plugins {
  id 'springagent.java-library-conventions'
}

description = 'Feishu/Lark integration for spring-agent-core: chats and cards as an agent surface.'

dependencies {
  // The i18n checks every module makes of its own tools and messages. Fixtures rather than a copy
  // per module: they are two hundred lines of reflection over @Tool methods and properties files,
  // and the first two modules to want them ended up with the same code twice.
  testImplementation testFixtures(project(':spring-agent-core'))

  // The real per-user model resolver, because FeishuCardUpdaterReasoningTest asserts that a user's
  // own reasoning effort beats the deployment's — which is a claim about that resolver's behaviour,
  // not about the card. Test-only: this module's own code compiles against core's UserChatClients
  // interface and never against an implementation of it.
  testImplementation project(':spring-agent-provider-openai')

  implementation project(':spring-agent-core')
  implementation libs.larksuite.oapi

  // Core's domain models carry `@Enumerated(EnumType.STRING)`, and core declares the JPA API
  // compileOnly so no backend leaks to consumers. javac resolves an annotation's enum arguments
  // when it reads those classes, so without the API here every module that touches a model
  // compiles with `unknown enum constant EnumType.STRING`. compileOnly, not implementation: this
  // is only to let javac read the annotation, nothing runs against it.
  compileOnly 'jakarta.persistence:jakarta.persistence-api'

  implementation 'org.springframework.boot:spring-boot-starter'
  implementation 'org.springframework.boot:spring-boot-starter-webmvc'
  implementation 'org.springframework.boot:spring-boot-starter-restclient'
  implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
  implementation 'org.springframework.ai:spring-ai-starter-model-openai'
  implementation libs.spring.ai.agent.utils
  implementation libs.guava

  // The update notes are markdown files with a YAML frontmatter block, and this is what reads that
  // block. Boot pulls it in anyway for application.yaml, but a module that parses YAML of its own
  // should say so rather than compile against somebody else's transitive.
  implementation 'org.yaml:snakeyaml'
}
