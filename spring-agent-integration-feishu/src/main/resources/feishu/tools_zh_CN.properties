# 各飞书工具参数的中文说明，键为 <ToolName>.<parameterName>。约定见 core/tools.properties。
#
# 这些文字是模型读的：它要照着这里说的去填参数，所以译文要把“填什么、什么格式、不填会怎样”都说
# 清楚，宁可比英文啰嗦，也不要含糊。参数名和取值里的字面量（open_id、docx、ByCreateTimeAsc 等）
# 都不译，它们是协议里的标识符。

# ── 消息与云盘（FeishuTools）
FeishuSendFile.filePath=要发送的本地文件的绝对路径
FeishuSendFile.receiveId=发给谁：open_id、user_id、union_id、邮箱或 chat_id，具体是哪种由 receiveIdType 决定。不填则发到当前会话的 chatId
FeishuSendFile.receiveIdType=receiveId 是哪种 id：open_id、user_id、union_id、email 或 chat_id。receiveId 不填时本参数无效
FeishuSendMessage.receiveId=发给谁：open_id、user_id、union_id、邮箱或 chat_id，具体是哪种由 receiveIdType 决定
FeishuSendMessage.receiveIdType=receiveId 是哪种 id：open_id、user_id、union_id、email 或 chat_id
FeishuSendMessage.content=消息正文，markdown 格式，会被填入消息模板
FeishuDownloadFile.messageId=含有该文件的飞书消息的 id
FeishuDownloadFile.fileKey=要下载的飞书文件的 key
FeishuDownloadFile.fileName=保存时使用的文件名
FeishuReadMessageHistory.containerIdType="chat"（单聊或群聊）或 "thread"（话题）
FeishuReadMessageHistory.containerId=containerIdType 为 chat 时填 chat_id，为 thread 时填 thread_id
FeishuReadMessageHistory.pageSize=返回多少条；默认 20，最多 50
FeishuReadMessage.messageId=要读取的飞书消息 id，形如 om_xxx
FeishuListDriveFolder.folderURL=飞书文件夹的链接
FeishuDownloadDriveFile.fileToken=该文件在飞书云盘中的 token
FeishuDownloadDriveFile.fileName=保存时使用的文件名
FeishuUploadDriveFile.filePath=要上传的本地文件的绝对路径
FeishuUploadDriveFile.folderToken=上传到哪个云盘文件夹，即 FeishuListDriveFolder 链接里的那个 token；不填则上传到属于当前用户的那个文件夹
FeishuUploadDriveFile.fileName=保存到云盘时使用的文件名；不填则沿用本地文件名

# ── 会话（FeishuChatTools）
FeishuListChats.pageSize=返回多少个；默认 20，也最多 20
FeishuListChats.pageToken=上一次调用返回的 nextPageToken，用于读取它之后的一页
FeishuListChats.sortType="ByCreateTimeAsc"（默认）或 "ByActiveTimeDesc"。注意 ByActiveTimeDesc 会随着群被使用而重新排序，因此翻页时可能漏掉某个群
FeishuGetChat.chatId=群的 chat_id，形如 oc_xxx
FeishuListChatMembers.chatId=群的 chat_id，形如 oc_xxx
FeishuListChatMembers.pageSize=返回多少个；默认 20，最多 100
FeishuListChatMembers.pageToken=上一次调用返回的 nextPageToken，用于读取它之后的一页
FeishuIsInChat.chatId=群的 chat_id，形如 oc_xxx
FeishuIsInChat.userId=要查询的那个人的 open_id。不填则查询机器人自己
FeishuRecallMessage.messageId=要撤回的消息 id，形如 om_xxx

# ── 机器人（FeishuBotTools）
FeishuSearchBots.query=搜索用的关键词，最多 50 个字符
FeishuSearchBots.chatIds=只在这些群里找机器人，填群的 chat_id，形如 oc_xxx
FeishuSearchBots.hasChatter=填 true 则只返回本工作区已经聊过天的机器人
FeishuSearchBots.pageSize=返回多少个；默认 20
FeishuSearchBots.pageToken=上一次调用返回的 nextPageToken，用于读取它之后的一页

# ── 知识库 wiki（FeishuWikiTools）
FeishuGetWikiNodeInfo.urlOrToken=一个 wiki 节点链接、文档链接，或者裸的节点 token 或文档 token
FeishuGetWikiNodeInfo.objType=文档类型；当 urlOrToken 是文档 token 而不是 wiki 节点 token 时必填，取 doc、docx、sheet、mindnote、bitable、file、slides、wiki 之一。传链接或 wiki 节点 token 时不要填，它们能自行识别，识别不出时按 wiki 处理
FeishuListWikiNodes.spaceId=wiki 空间 id，取 FeishuGetWikiNodeInfo 报告的 spaceId。填 my_library 表示当前用户自己的文档库
FeishuListWikiNodes.parentNodeToken=要列出哪个节点的子节点；不填则列出该空间的顶层
FeishuListWikiNodes.pageToken=上一页结果里的 page_token，用于读取下一页
FeishuListWikiNodes.pageSize=每页多少个节点，最多 50；默认 50，以免一次遍历过长
FeishuListWikiNodes.maxDepth=向下遍历多少层，默认 1，即只取直接子节点。填负数则遍历整棵子树，上限由节点数限制约束

# ── 电子表格（FeishuSheetTools）
FeishuCreateSpreadsheet.title=新建表格的标题
FeishuCreateSpreadsheet.folderToken=在哪个文件夹里创建的 token；不填则放进属于当前用户的那个文件夹
FeishuListSheets.spreadsheetToken=表格 token
FeishuAddSheet.spreadsheetToken=表格 token
FeishuAddSheet.title=新建工作表的标题
FeishuAddSheet.index=放在第几个位置；不填则插入到位置 0
FeishuCopySheet.spreadsheetToken=表格 token
FeishuCopySheet.sourceSheetId=要复制的工作表 id，由 FeishuListSheets 给出
FeishuCopySheet.newTitle=副本的标题。不填则由飞书按原名加上它自己的后缀来命名
FeishuDeleteSheet.spreadsheetToken=表格 token
FeishuDeleteSheet.sheetId=要删除的工作表 id，由 FeishuListSheets 给出
FeishuSheetReadRange.spreadsheetToken=表格 token
FeishuSheetReadRange.range=A1 记法表示的区域，形如 "<sheetId>!A1:G5"
FeishuSheetBatchReadRanges.spreadsheetToken=表格 token
FeishuSheetBatchReadRanges.ranges=要读取的多个区域，每个都用 A1 记法，形如 "<sheetId>!A1:G5"
FeishuSheetUpdateRange.spreadsheetToken=表格 token
FeishuSheetUpdateRange.range=A1 记法表示的区域，形如 "<sheetId>!A1:G5"
FeishuSheetUpdateRange.values=要写入的各行；每个单元格是一个裸的字符串或数字，或者是 FeishuSheetDataFormats 所描述的那几种形状之一的 JSON 对象
FeishuSheetBatchUpdateRanges.spreadsheetToken=表格 token
FeishuSheetBatchUpdateRanges.ranges=要写入的多个区域，以及每个区域对应的各行
FeishuSheetSetRangeStyle.spreadsheetToken=表格 token
FeishuSheetSetRangeStyle.range=A1 记法表示的区域，形如 "<sheetId>!A1:G5"
FeishuSheetSetRangeStyle.bold=加粗
FeishuSheetSetRangeStyle.italic=斜体
FeishuSheetSetRangeStyle.fontSize=字号或行高："10pt" 表示字号，取 9 到 36pt 之间；"1.5" 表示行高，固定为 1.5px
FeishuSheetSetRangeStyle.textDecoration=文字装饰：0 无，1 下划线，2 删除线，3 下划线加删除线
FeishuSheetSetRangeStyle.formatter=数字或日期格式，例如日期用 "yyyy/MM/dd"，百分比用 "0.00%"。日期必须先在这里设好格式，然后才能写入
FeishuSheetSetRangeStyle.hAlign=水平对齐：0 左对齐，1 居中，2 右对齐
FeishuSheetSetRangeStyle.vAlign=垂直对齐：0 顶端，1 居中，2 底端
FeishuSheetSetRangeStyle.foreColor=字体颜色，十六进制色值，形如 "#000000"
FeishuSheetSetRangeStyle.backColor=背景颜色，十六进制色值，形如 "#21D11F"
FeishuSheetSetRangeStyle.borderType=边框类型：FULL_BORDER、OUTER_BORDER、INNER_BORDER、NO_BORDER、LEFT_BORDER、RIGHT_BORDER、TOP_BORDER 或 BOTTOM_BORDER
FeishuSheetSetRangeStyle.borderColor=边框颜色，十六进制色值，形如 "#FF0000"
FeishuSheetSetRangeStyle.clean=清除该区域上已有的全部样式；默认 false
FeishuLockSheet.spreadsheetToken=表格 token
FeishuLockSheet.sheetId=要加锁的工作表 id
FeishuLockSheet.lockInfo=关于这把锁的说明，例如为什么要加锁
FeishuUnlockSheet.spreadsheetToken=表格 token
FeishuUnlockSheet.sheetId=要解锁的工作表 id
FeishuGetProtectedRanges.spreadsheetToken=表格 token
FeishuGetProtectedRanges.protectIds=要查询的 protectId，最多五个
FeishuGetProtectedRanges.memberType=返回哪种用户 id：userId（默认）、openId 或 unionId。推荐用 openId

# ── 云文档（FeishuDocTools）
FeishuCreateDocument.title=文档标题
FeishuCreateDocument.folderToken=在哪个文件夹里创建的 token；不填则放进属于当前用户的那个文件夹
FeishuGetDocumentInfo.documentId=标识这篇飞书文档的 document_id
FeishuGetDocumentRawContent.documentId=标识这篇飞书文档的 document_id
FeishuListDocBlocks.documentId=标识这篇飞书文档的 document_id
FeishuListDocBlocks.documentRevisionId=文档版本；默认 -1，表示最新版本
FeishuListDocBlocks.pageToken=分页标记：上一次调用返回的 pageToken
FeishuListDocBlocks.pageSize=每页多少个；默认 500，也最多 500
FeishuGetDocBlockChildren.documentId=标识这篇飞书文档的 document_id
FeishuGetDocBlockChildren.blockId=父块的 block_id；填 documentId 本身表示根块
FeishuGetDocBlockChildren.withDescendants=返回全部后代，即整棵子树；默认 false，只返回直接子块
FeishuGetDocBlockChildren.documentRevisionId=文档版本；默认 -1，表示最新版本
FeishuGetDocBlockChildren.pageToken=分页标记：上一次调用返回的 pageToken
FeishuGetDocBlockChildren.pageSize=每页多少个；默认 500，也最多 500
FeishuGetDocBlock.documentId=标识这篇飞书文档的 document_id
FeishuGetDocBlock.blockId=块的 block_id
FeishuGetDocBlock.documentRevisionId=文档版本；默认 -1，表示最新版本
FeishuCreateDocBlockChildren.documentId=标识这篇飞书文档的 document_id
FeishuCreateDocBlockChildren.blockId=父块的 block_id；填 documentId 本身表示插入到文档的根块之下
FeishuCreateDocBlockChildren.childrenJson=要创建的块的 JSON 数组，每一项都是 FeishuDocBlockContentReference 所描述形状的块对象。它接受文件引用：用 @file:<路径> 指向某次已保存的工具结果，或用 @file:<路径>#/json/pointer 只取其中一部分
FeishuCreateDocBlockChildren.index=插入到什么位置；默认 -1 表示追加到末尾，0 表示放到最前面
FeishuCreateDocBlockChildren.documentRevisionId=文档版本；默认 -1，表示最新版本
FeishuCreateDocBlockChildren.clientToken=幂等键：传一个 UUID，这样重试不会创建两次
FeishuWriteDocumentBody.documentId=标识这篇飞书文档的 document_id
FeishuWriteDocumentBody.contentType=markdown 或 html
FeishuWriteDocumentBody.content=要写入的 Markdown 或 HTML
FeishuWriteDocumentBody.blockId=写到哪个块之下；默认就是文档本身，也就是它的根块
FeishuWriteDocumentBody.index=插入到什么位置；默认 -1 表示追加到末尾，0 表示放到最前面
FeishuWriteDocumentBody.documentRevisionId=文档版本；默认 -1，表示最新版本
FeishuWriteDocumentBody.clientToken=幂等键：传一个 UUID，这样重试不会写入两次
FeishuCreateDocBlockDescendant.documentId=标识这篇飞书文档的 document_id
FeishuCreateDocBlockDescendant.blockId=父块的 block_id；填 documentId 本身表示插入到文档的根块之下
FeishuCreateDocBlockDescendant.childrenId=作为父块直接子块的那些临时 block_id，通常就是转换结果里的 firstLevelBlockIds
FeishuCreateDocBlockDescendant.descendantsJson=嵌套块树的 JSON 数组，通常就是转换结果里的 blocks。它接受文件引用：如果那次转换的结果太大、没有直接给你看而是存成了文件，就填 @file:<路径>#/blocks，不要把整棵树抄一遍
FeishuCreateDocBlockDescendant.index=插入到什么位置；默认 -1 表示追加到末尾，0 表示放到最前面
FeishuCreateDocBlockDescendant.documentRevisionId=文档版本；默认 -1，表示最新版本
FeishuCreateDocBlockDescendant.clientToken=幂等键：传一个 UUID，这样重试不会创建两次
FeishuUpdateDocBlock.documentId=标识这篇飞书文档的 document_id
FeishuUpdateDocBlock.blockId=要更新的那个块的 block_id
FeishuUpdateDocBlock.updateOperationJson=以 JSON 表示的更新内容，其中有且只有一个操作字段
FeishuUpdateDocBlock.documentRevisionId=文档版本；默认 -1，表示最新版本
FeishuUpdateDocBlock.clientToken=幂等键：传一个 UUID，这样重试不会更新两次
FeishuBatchUpdateDocBlocks.documentId=标识这篇飞书文档的 document_id
FeishuBatchUpdateDocBlocks.requestsJson=更新内容的 JSON 数组，每一项含一个 blockId 和一个操作字段。它接受文件引用：用 @file:<路径> 指向某次已保存的工具结果，或用 @file:<路径>#/json/pointer 只取其中一部分
FeishuBatchUpdateDocBlocks.documentRevisionId=文档版本；默认 -1，表示最新版本
FeishuBatchUpdateDocBlocks.clientToken=幂等键：传一个 UUID，这样重试不会更新两次
FeishuDeleteDocBlockChildren.documentId=标识这篇飞书文档的 document_id
FeishuDeleteDocBlockChildren.blockId=父块的 block_id
FeishuDeleteDocBlockChildren.startIndex=从第几个开始删，从 0 数起
FeishuDeleteDocBlockChildren.endIndex=删到第几个之前为止（不含该位置）
FeishuDeleteDocBlockChildren.documentRevisionId=文档版本；默认 -1，表示最新版本
FeishuDeleteDocBlockChildren.clientToken=幂等键：传一个 UUID，这样重试不会删除两次
FeishuConvertMarkdownOrHtmlToBlocks.contentType=markdown 或 html
FeishuConvertMarkdownOrHtmlToBlocks.content=要转换的 Markdown 或 HTML 内容
FeishuUploadDocBlockMedia.documentId=该块所在文档的 document_id
FeishuUploadDocBlockMedia.blockId=目标 Image 或 File 块的真实 block_id，它会作为本次上传的 parent_node
FeishuUploadDocBlockMedia.filePath=本地文件的绝对路径
FeishuUploadDocBlockMedia.fileName=展示用的文件名
FeishuUploadDocBlockMedia.parentType=图片填 docx_image，文件或附件填 docx_file

# ── 多维表格（FeishuBitableTools）
FeishuCreateBitable.title=新建多维表格的标题
FeishuCreateBitable.folderToken=在哪个文件夹里创建的 token；不填则放进属于当前用户的那个文件夹
FeishuCreateBitable.timeZone=这个多维表格按哪个 IANA 时区解读日期，例如 Asia/Shanghai；不填则用租户的默认时区
FeishuGetBitableMeta.appToken=标识这个多维表格的 app_token
FeishuUpdateBitableMeta.appToken=标识这个多维表格的 app_token
FeishuUpdateBitableMeta.name=新的名称；不填则保持不变
FeishuUpdateBitableMeta.isAdvanced=是否开启高级权限；不填则保持不变
FeishuListBitableTables.appToken=标识这个多维表格的 app_token
FeishuListBitableTables.pageToken=上一页结果里的 page_token，用于读取下一页
FeishuListBitableTables.pageSize=每页多少张数据表，默认 20，最多 100
FeishuCreateBitableTable.appToken=标识这个多维表格的 app_token
FeishuCreateBitableTable.name=新建数据表的名称
FeishuCreateBitableTable.defaultViewName=它初始的那个视图的名称；如果给了 fieldsJson，本参数必填
FeishuCreateBitableTable.fieldsJson=要创建的字段的 JSON 数组，形状见 FeishuBitableFieldReference；如果给了 defaultViewName，本参数必填
FeishuBatchCreateBitableTables.appToken=标识这个多维表格的 app_token
FeishuBatchCreateBitableTables.names=要创建的各数据表的名称
FeishuRenameBitableTable.appToken=标识这个多维表格的 app_token
FeishuRenameBitableTable.tableId=要重命名的数据表的 table_id
FeishuRenameBitableTable.name=新的名称
FeishuDeleteBitableTables.appToken=标识这个多维表格的 app_token
FeishuDeleteBitableTables.tableIds=要删除的各数据表的 table_id
FeishuListBitableFields.appToken=标识这个多维表格的 app_token
FeishuListBitableFields.tableId=数据表的 table_id
FeishuListBitableFields.viewId=只列出在这个视图里可见的字段，并按该视图的顺序排列
FeishuListBitableFields.pageToken=上一页结果里的 page_token，用于读取下一页
FeishuListBitableFields.pageSize=每页多少个字段，默认 20，最多 100
FeishuListBitableViews.appToken=标识这个多维表格的 app_token
FeishuListBitableViews.tableId=数据表的 table_id
FeishuListBitableViews.pageToken=上一页结果里的 page_token，用于读取下一页
FeishuListBitableViews.pageSize=每页多少个视图，默认 20，最多 100
FeishuGetBitableView.appToken=标识这个多维表格的 app_token
FeishuGetBitableView.tableId=数据表的 table_id
FeishuGetBitableView.viewId=视图的 view_id
FeishuCreateBitableView.appToken=标识这个多维表格的 app_token
FeishuCreateBitableView.tableId=数据表的 table_id
FeishuCreateBitableView.viewName=新建视图的名称，最多 100 个字符，且不能含 [ 或 ]
FeishuCreateBitableView.viewType=grid（默认）、kanban、gallery、gantt 或 form
FeishuDeleteBitableView.appToken=标识这个多维表格的 app_token
FeishuDeleteBitableView.tableId=数据表的 table_id
FeishuDeleteBitableView.viewId=要删除的视图的 view_id
FeishuSearchBitableRecords.appToken=标识这个多维表格的 app_token
FeishuSearchBitableRecords.tableId=数据表的 table_id
FeishuSearchBitableRecords.viewId=只在这个视图的行和列范围内检索
FeishuSearchBitableRecords.fieldNames=要返回的字段名；不填则返回全部字段
FeishuSearchBitableRecords.filterJson=以 JSON 表示的过滤条件，形状见 FeishuBitableFilterGuide；不填则不过滤
FeishuSearchBitableRecords.sortJson=形如 [{"field_name": ..., "desc": true|false}] 的 JSON 数组；不填则用数据表自身的顺序
FeishuSearchBitableRecords.automaticFields=同时返回 created_time、last_modified_time、created_by 和 last_modified_by
FeishuSearchBitableRecords.pageToken=上一页结果里的 page_token，用于读取下一页
FeishuSearchBitableRecords.pageSize=每页多少行，默认 20，最多 500
FeishuBatchGetBitableRecords.appToken=标识这个多维表格的 app_token
FeishuBatchGetBitableRecords.tableId=数据表的 table_id
FeishuBatchGetBitableRecords.recordIds=要获取的 record_id，最多 100 个
FeishuBatchGetBitableRecords.withSharedUrl=同时返回每条记录的可分享链接
FeishuBatchGetBitableRecords.automaticFields=同时返回 created_time、last_modified_time、created_by 和 last_modified_by
FeishuCreateBitableRecord.appToken=标识这个多维表格的 app_token
FeishuCreateBitableRecord.tableId=数据表的 table_id
FeishuCreateBitableRecord.fieldsJson=这条记录的各字段，一个以字段名为键的 JSON 对象
FeishuCreateBitableRecord.clientToken=幂等键：传一个 UUID，这样重试不会创建两次
FeishuCreateBitableRecord.ignoreConsistencyCheck=即使表格在读取之后被改动过也照样写入，而不是让这次调用失败
FeishuBatchCreateBitableRecords.appToken=标识这个多维表格的 app_token
FeishuBatchCreateBitableRecords.tableId=数据表的 table_id
FeishuBatchCreateBitableRecords.recordsJson=由 {"fields": {...}} 对象组成的 JSON 数组，最多 1000 条
FeishuBatchCreateBitableRecords.clientToken=幂等键：传一个 UUID，这样重试不会创建两次
FeishuBatchCreateBitableRecords.ignoreConsistencyCheck=即使表格在读取之后被改动过也照样写入，而不是让这次调用失败
FeishuUpdateBitableRecord.appToken=标识这个多维表格的 app_token
FeishuUpdateBitableRecord.tableId=数据表的 table_id
FeishuUpdateBitableRecord.recordId=要更新的那条记录的 record_id
FeishuUpdateBitableRecord.fieldsJson=要覆写的各字段，一个以字段名为键的 JSON 对象
FeishuUpdateBitableRecord.ignoreConsistencyCheck=即使表格在读取之后被改动过也照样写入，而不是让这次调用失败
FeishuBatchUpdateBitableRecords.appToken=标识这个多维表格的 app_token
FeishuBatchUpdateBitableRecords.tableId=数据表的 table_id
FeishuBatchUpdateBitableRecords.recordsJson=由 {"record_id": ..., "fields": {...}} 对象组成的 JSON 数组，最多 1000 条
FeishuBatchUpdateBitableRecords.ignoreConsistencyCheck=即使表格在读取之后被改动过也照样写入，而不是让这次调用失败
FeishuDeleteBitableRecords.appToken=标识这个多维表格的 app_token
FeishuDeleteBitableRecords.tableId=数据表的 table_id
FeishuDeleteBitableRecords.recordIds=要删除的 record_id，最多 500 个
FeishuUploadBitableAttachment.appToken=附件要放进哪个多维表格的 app_token；上传得到的 token 与它绑定
FeishuUploadBitableAttachment.filePath=本地文件的绝对路径
FeishuUploadBitableAttachment.fileName=在单元格里展示的文件名
FeishuUploadBitableAttachment.parentType=图片填 bitable_image，其他一律填 bitable_file；不填则按 bitable_file 处理
FeishuCreateBitableField.appToken=标识这个多维表格的 app_token
FeishuCreateBitableField.tableId=数据表的 table_id
FeishuCreateBitableField.fieldName=新建字段的名称，在该数据表内必须唯一
FeishuCreateBitableField.type=字段类型的数字编号；取值见 FeishuBitableFieldReference
FeishuCreateBitableField.uiType=它以什么形态展示，例如 type 为 2 时可用 Progress 或 Rating；不填则用该类型的默认形态
FeishuCreateBitableField.propertyJson=以 JSON 表示的字段配置——单选选项、关联字段的目标数据表、日期格式等——形状见 FeishuBitableFieldReference
FeishuCreateBitableField.description=展示在该字段上的说明
FeishuCreateBitableField.disableDescriptionSync=是否不要把这段说明同步到基于该数据表建立的表单的对应问题上；不填则为 true
FeishuCreateBitableField.clientToken=幂等键：传一个 UUID，这样重试不会创建两次
FeishuUpdateBitableField.appToken=标识这个多维表格的 app_token
FeishuUpdateBitableField.tableId=数据表的 table_id
FeishuUpdateBitableField.fieldId=该字段的 field_id，从 FeishuListBitableFields 获取
FeishuUpdateBitableField.fieldName=修改之后该字段应有的名称
FeishuUpdateBitableField.type=修改之后该字段应有的类型数字编号
FeishuUpdateBitableField.uiType=它以什么形态展示；不填则用该类型的默认形态
FeishuUpdateBitableField.propertyJson=以 JSON 表示的完整字段配置——没有写进来的项会被清空，而不是保留
FeishuUpdateBitableField.description=展示在该字段上的说明；不填则清空
FeishuUpdateBitableField.disableDescriptionSync=是否不要把这段说明同步到基于该数据表建立的表单的对应问题上；不填则为 true

FeishuImportFile.filePath=要导入的本地文件的绝对路径
FeishuImportFile.type=它应该变成什么：docx 是文档，sheet 是电子表格，bitable 是多维表格
FeishuImportFile.fileName=新建云文档的名称；不填则沿用本地文件名
FeishuImportFile.folderToken=放到哪个云盘文件夹，即 FeishuListDriveFolder 链接里的那个 token；不填则放进属于当前用户的那个文件夹
FeishuExportDocument.token=要导出的云文档的 token
FeishuExportDocument.type=它是什么：docx 或 doc 是文档，sheet 是电子表格，bitable 是多维表格
FeishuExportDocument.fileExtension=要产出的本地文件类型：文档导出为 docx 或 pdf，电子表格和多维表格导出为 xlsx 或 csv
FeishuExportDocument.subId=csv 装的是哪张工作表（sheetId）或哪张数据表（tableId）；导出 csv 时必填，其余情况无意义
FeishuExportDocument.fileName=保存时使用的文件名；不填则沿用文档自己的名称
