question-nothing-chosen=Choose an option or type an answer first
question-answer-heading=Here are my answers to the questions you asked:
question-answer-heading-by-admin=An administrator ({0}) answered the questions you asked, on behalf of the person you are helping. Take these as the answers, tell that person an administrator answered for them, and go on addressing them rather than the administrator:

background-run-failed=A scheduled task running in the background has failed:\n{0}
# A subagent's panel on the card. Deliberately not the word "background": a background run is a
# different thing here — one nothing is posted for at all — and a subagent is neither hidden nor
# unattended, it is work this turn is waiting on.
card-subagent-started=**Subagent running** {0} ...
card-subagent-completed=**Subagent finished** {0}
card-subagent-cancelled=**Subagent stopped** {0}
card-subagent-failed=**Subagent failed** {0}
# When whoever started it said nothing about what it is for, which no tool here does.
card-subagent-unnamed=an unnamed task

# The knowledge-sources panel's title: which documents the run was given before it answered. Read
# by a person, not the model, and it is a closed grey line in the footer beside the spend — so it
# has to stay short. card- prefixed like the other labels the card template fills in.
card-references=**Knowledge Sources**
reference-scope-own=yours
reference-scope-group=this group
reference-scope-tenant=company-wide

# How a group chat message reads once it has been observed: the name the situation is given, and the
# line of evidence a triage run is shown. The agent's own framing, so it is translated — what was
# actually said is an argument and goes in untouched, in whatever language it was said in.
# Keep MessageFormat happy: no apostrophes, no stray braces.
chat-observation-title=Feishu group chat {0}
chat-observation-said={0} said: {1}

# The welcome and update cards, which a person meets before they have said anything. What each card
# is *about* — the greeting itself and the notes saying what changed — is prose in welcome.md and
# updates/N.md rather than here: those are content a deployment rewrites, these are the few labels
# the card frame puts around them.
# The caption over the tappable suggestions. Says what pressing one does, since a bordered row on
# this card is the only thing on it that can be pressed.
welcome-suggest-hint=Or tap one of these to get started
# The update card's own title, which is the one place the version this feature tracks becomes
# visible to the person it is tracked for. A choice format rather than two keys: the count is the
# whole of the sentence, and a language that does not inflect for it simply ignores the branch.
update-title={0,choice,1#1 update|1<{0} updates} since you were last here
# The marker down the left of each note, naming which one it is. Short by design — it is a gutter,
# not a column of text.
update-version=v{0}
# The toast a tapped suggestion answers with, while the run it started is still creating its card.
welcome-suggestion-taken=On it

