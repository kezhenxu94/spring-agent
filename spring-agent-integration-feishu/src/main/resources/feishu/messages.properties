# What a Feishu tool answers when the person this run belongs to may not touch what the model
# named. Written for the model rather than for a log: the run carries on, so this is the sentence
# it has to explain the refusal from — hence "say so rather than trying another way", which is
# there to stop it working around the check by reaching for a second tool.
access-denied-doc=Refused: you do not have access to {0} {1}, and this only answers for what you have access to. Ask whoever owns it to share it with you, or with this chat. Say so rather than trying another way.
access-unknown-doc=Refused: whether you may use {0} {1} could not be established, and this only answers for what you have access to. Say so rather than trying another way.
access-denied-wiki-space=Refused: you are not a member of wiki space {0}, and this only answers for spaces you are in. Say so rather than trying another way.
access-unknown-wiki-space=Refused: whether you are in wiki space {0} could not be established, and this only answers for spaces you are in. Say so rather than trying another way.
# A tool nobody has written an access rule for. Says it is the agent that is incomplete, so that
# the model does not report it to the person as something they lack permission for.
access-no-rule=Refused: {0} has no access rule and cannot be used. This is a gap in the agent, not something you did - say so rather than trying another way.
access-missing-argument=Refused: {0} needs {1} and none was given.
access-missing-type=Refused: {0} needs {1} to say what {2} is.
