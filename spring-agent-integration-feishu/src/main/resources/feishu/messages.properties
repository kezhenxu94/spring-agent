card-stop=Stop
card-conversation-hint=Reply to this message to carry on the conversation — while it is still running too, to add to it or put it right; send a new message to start a fresh one
card-error=Something went wrong: {0}
card-unknown-error=Unknown error
card-calling-tool=Calling {0} ...
# Every panel title on the card reads the same way: the bold name of the section, then what tells
# this one apart — a count in brackets when the thing is over and countable, or what it is doing
# now. Nothing separates the two but a space; a dash between them made a title of two halves where
# the card wants a name and a detail.
# The pane holding every tool call the turn made, and every call inside it, are named by their tool
# rather than by what the model said the call was for: the trail then reads as a list of what was
# used, and the descriptions are still there among each call's fields. Only the line a subagent
# shows inline, card-calling-tool above, is written the other way round.
card-tool-calls=**Tool calls** {0} ...
# And what it is named once every call is back: no call is the one the run is on any more, and the
# last of them moves down among the others so that what it returned is on the card too.
card-tool-calls-done=**Tool calls**({0})
# What stands in for the calls too old to be worth a pane each.
card-tool-calls-earlier=… and {0} earlier calls
card-image-unavailable=(image unavailable)
card-continued=*… continued from the card above*\n\n
# The task list panel's title. The number of tasks is appended to it by FeishuCardElements, in
# brackets and inside whatever this line wrapped the label in, the same as the knowledge sources.
card-todo=**To do**
# The panel holding what the model thought its way through, before it answered.
card-reasoning=**Thinking**
card-stop-not-yours=Only the person who started this run can stop it
# Said on the card, one quoted line each, when the user replies to a run that is still going: what
# they said and whether the run has taken it in yet.
card-message-queued=Queued: {0}
card-message-read=Picked up: {0}
# Where the message is not something a line can show — an image, a file, a sticker. What it carries
# reaches the model when the message is read; the card only says one arrived.
card-message-unshown=a message you sent

