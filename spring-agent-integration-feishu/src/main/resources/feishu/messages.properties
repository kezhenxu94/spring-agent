config-active-hint=Pick a model
config-add-hint=**Add a model** — fill in all four to use your own endpoint, or just Model to use one of the built-in models by name. Leave them empty to only change the selection above. How hard it should think applies to the model you end up on, built-in models included.
config-name-label=Name
config-name-placeholder=A short name, e.g. kimi
config-baseurl-label=Base URL
