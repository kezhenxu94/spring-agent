# What each parameter of each Feishu tool tells the model it is for, keyed <ToolName>.<parameterName>.
# The convention, and why these are overrides rather than a bundle, is in core/tools.properties.
#
# Its own file rather than more keys in core's because the tools are declared here: the bitable,
