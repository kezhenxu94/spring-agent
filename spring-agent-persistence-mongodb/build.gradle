plugins {
  id 'springagent.java-library-conventions'
  id 'springagent.classpath-isolation'
}

// The MongoDB half of the pair; see spring-agent-persistence-jdbc for the shape. Thinner than its
// counterpart because Spring AI's MongoDB chat memory ships an auto-configuration that does the
// right thing, whereas the JDBC one has to be assembled by hand.
dependencies {
  api project(':spring-agent-core')
  // api: MongoMcpServerConfigRepo and friends extend MongoRepository, part of their public type.
  api 'org.springframework.boot:spring-boot-starter-data-mongodb'
  // The starter, unlike the JDBC side: here Spring AI's own auto-configuration is the wiring we
  // want. It guards its bean with @ConditionalOnMissingBean on the concrete repository type, so it
  // would not back off in front of the JDBC one — PersistenceAutoConfigurationFilter is what keeps
  // it out of an application that carries both modules and selected JDBC.
  api 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-mongodb'

  // Not used by anything here, and deliberately compileOnly so it stays off the runtime classpath.
  // It is here to keep javac quiet: reading spring-agent-core's dual-mapped models turns every
  // @Enumerated(EnumType.STRING) and @ElementCollection(fetch = FetchType.EAGER) into an "unknown
  // enum constant" warning when the JPA API is absent. The warning is harmless — an annotation whose
  // type cannot be resolved is discarded, which is exactly what this module wants to happen — but
  // twenty of them on every build is how real warnings get ignored.
  compileOnly 'jakarta.persistence:jakarta.persistence-api'
}

forbidOnRuntimeClasspath(
    groups: ['org.hibernate.orm', 'jakarta.persistence', 'com.zaxxer', 'org.xerial'],
    modules: [
      'spring-jdbc',
      'spring-orm',
      'spring-boot-jdbc',
      'spring-boot-jpa',
      'spring-boot-hibernate',
      'spring-data-jpa',
      'spring-boot-data-jpa',
      'spring-boot-starter-data-jpa',
      'spring-boot-starter-jdbc',
      'spring-ai-model-chat-memory-repository-jdbc',
    ])
