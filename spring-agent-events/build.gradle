plugins {
  id 'springagent.java-library-conventions'
}

description = 'Event intelligence for spring-agent-core: correlates what other systems do into situations, and wakes the agent for the ones worth an opinion. The systems themselves arrive as spring-agent-integration-* modules.'

dependencies {
  implementation project(':spring-agent-core')

  // Core's domain models carry `@Enumerated(EnumType.STRING)`, and core declares the JPA API
  // compileOnly so no backend leaks to consumers. javac resolves an annotation's enum arguments
  // when it reads those classes, so without the API here every module that touches a model
  // compiles with `unknown enum constant EnumType.STRING`. compileOnly, not implementation: this
  // is only to let javac read the annotation, nothing runs against it.
  compileOnly 'jakarta.persistence:jakarta.persistence-api'
  // And on the test classpath, for the same reason: the tests here build core's models directly, so
  // javac reads those annotations again and warns fifteen times over without this.
  testCompileOnly 'jakarta.persistence:jakarta.persistence-api'

  implementation 'org.springframework.boot:spring-boot-starter'
  // For the webhook receiver. The whole HTTP surface of this module is one controller, so the
  // dependency is on webmvc rather than on a starter that brings a client stack too: nothing here
  // calls out, sources push to us.
  implementation 'org.springframework.boot:spring-boot-starter-webmvc'
  implementation 'org.springframework.ai:spring-ai-starter-model-openai'
  implementation libs.spring.ai.agent.utils
  implementation libs.guava

  testImplementation 'org.springframework.boot:spring-boot-starter-webmvc'
}
