# 各「情况」工具参数的中文说明，键为 <ToolName>.<parameterName>。约定见 core/tools.properties。
#
# 这些文字是模型读的：它要照着这里说的去填参数，所以译文要把「填什么、什么格式、不填会怎样」说清
# 楚。取值里的字面量（NO_ACTION、ACTED、ESCALATED）不译，它们是协议里的标识符。

GetSituationEvents.situationId=要读取的情况；省略则读你当前正在看的这一个
GetSituationEvents.limit=返回最近多少条观察记录，最多 50 条

RecordSituationAssessment.decision=NO_ACTION、ACTED 或 ESCALATED 三者之一
RecordSituationAssessment.summary=你的判断，以及你为此做了什么
RecordSituationAssessment.severity=严重程度，用你自己的话描述；不适用就不填
RecordSituationAssessment.confidence=你有多大把握，0 到 1 之间

ResolveSituation.reason=关闭它的原因

WritePlaybook.source=事件源，用 ListPlaybooks 列出的那个名字
WritePlaybook.docId=该源的过滤条件接受的文档 id
WritePlaybook.title=给这份 playbook 起的简短标题
WritePlaybook.text=playbook 本身，写成给 agent 的指令
