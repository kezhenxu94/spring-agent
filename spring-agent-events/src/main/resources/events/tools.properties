# What each parameter of each situation tool tells the model it is for, keyed
# <ToolName>.<parameterName>. The convention, and why these are overrides rather than a bundle, is in
# core/tools.properties.
#
# Empty of keys on purpose: the English text of every parameter here is the @ToolParam annotation's
# own, which is where it is written and reviewed. A key belongs in this file only to correct one
# without editing the annotation — which is what it is for when the annotation lives in a jar.
