name: Docker
on:
  push:
    branches:
      - main
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*
permissions:
  contents: read
  packages: write
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build ${{ matrix.project }} ${{ matrix.arch }} image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # One image per surface. The Feishu server keeps the repository's own name, which is what it
        # has always published under and what existing deployments pull; a second application
        # applying springagent.docker has to name its own, so the Slack one is suffixed.
        project:
          - spring-agent-app-feishu
          - spring-agent-app-slack
        # Both axes are declared as matrix keys, not left to `include`. An `include` entry cannot
        # multiply combinations - it only adds keys to the ones already there, and a later entry
        # overwrites what an earlier one added - so two arches listed only under `include` collapse
        # to whichever comes last, and the manifest job below then has no second image to point at.
        # The `include` entries exist purely to derive a value from a key declared here.
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
          - project: spring-agent-app-feishu
            image-suffix: ''
          - project: spring-agent-app-slack
            image-suffix: '-slack'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and publish
        env:
          DOCKER_USERNAME: ${{ github.actor }}
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :${{ matrix.project }}:bootBuildImage --publishImage \
            -PimageRefs=ghcr.io/${{ github.repository }}${{ matrix.image-suffix }}:${{ github.sha }}-${{ matrix.arch }}
  manifest:
    name: Publish ${{ matrix.project }} multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: spring-agent-app-feishu
            image-suffix: ''
          - project: spring-agent-app-slack
            image-suffix: '-slack'
    steps:
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.image-suffix }}
          sep-tags: ','
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=,format=long
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest list
        run: |
          image=ghcr.io/${{ github.repository }}${{ matrix.image-suffix }}
          args=()
          IFS=',' read -ra tags <<< '${{ steps.meta.outputs.tags }}'
          for tag in "${tags[@]}"; do
            args+=(--tag "$tag")
          done
          docker buildx imagetools create "${args[@]}" \
            "$image:${{ github.sha }}-amd64" \
            "$image:${{ github.sha }}-arm64"
