# What each parameter of this backend's shell tools tells the model it is for, keyed
# <ToolName>.<parameterName>. The convention, and why these are overrides, is in core/tools.properties.
#
# Its own bundle rather than core's because this backend and the others declare tools of the same
# names — Bash, BashOutput, KillShell — with genuinely different text, and only one backend is ever
# active. Putting them in core would serve one backend's wording to whichever one is running.
