spring:
  messages:
    # This application's own words to the user. core/messages — what the agent writes into a
    # conversation itself — is appended to whatever is named here by MessagesDefaults, so it is
    # deliberately not repeated. `messages` is also Boot's default, stated because leaving it out
    # would read as this application having no bundle rather than as it taking the default.
    basename: messages
    # The operating system's language when the user's locale has no bundle of its own, rather than
    # English: the desktop this runs on belongs to the user being spoken to, so its language is a
    # better guess at theirs. Boot's own default, stated because spring-agent-app states the
    # opposite and the difference between the two is deliberate.
    fallback-to-system-locale: true
  main:
    banner-mode: off
    # Belt and braces with SpringAgentCliApplication's builder: the property also covers a context
    # started by a test, which does not go through main().
    web-application-type: none
  shell:
    config:
      # Where the history file lands. Spring Shell otherwise writes it into the working directory,
      # which for a binary on the PATH means one history per project, each remembering a fraction.
      location: ${user.home}/.spring-agent
    history:
      name: history
    interactive:
      # Spring Shell's own runners are replaced by CliShellRunner — see its javadoc for why a
      # command shell cannot host free-typed prompts. This stays true so the command
      # infrastructure (registry, parser, completion, theming) is still configured.
      enabled: true
    command:
      # The built-ins this module replaces or has no use for. Left on, two commands answer to the
      # same name and which one the registry returns is luck.
      #
      # `quit` is the exception: it is not a bean and has no property, so CliShellRunner
      # unregisters it by hand.
      help:
        enabled: false
      clear:
        # Ours forgets the conversation, which is what /clear means to anyone arriving from a
        # coding agent. The built-in clears the screen, and taking away the scrollback of an
        # answer just read is not what they would be asking for.
        enabled: false
      history:
        # It lists the commands run, which here is only the slash commands — the prompts, which
        # are the interesting half, never reach the registry. Arrow-up still walks all of it.
        enabled: false
      script:
        enabled: false
      version:
        enabled: false
  ai:
    chat:
      memory:
        repository:
          jdbc:
            # `always`, not the default: Spring AI gates the schema initializer on Boot's
            # embedded-database check, and SQLite does not count as embedded, so the
            # SPRING_AI_CHAT_MEMORY tables would never be created.
            initialize-schema: always
      client:
        # Only `toolSearchTool` and whatever a search has already named reach the model on any one
        # iteration, so the suffix appended to the system prompt is what teaches it the protocol.
        # `system-message-suffix` is not set here on purpose: core defaults it (see
        # ToolSearchAdvisorDefaults) to its own prompt in the app.locale language, since upstream's
        # is a single English sentence. Set it here to say something else.
        tool-search-advisor:
          enabled: true
          tool-index-type: vector
          max-results: 5
    # MCP servers this command line always has, as opposed to the ones registered at runtime and
    # stored per user: connected at startup and offered to every run. AgentToolsProvider appends the
    # callbacks of every ToolCallbackProvider bean, which is what Spring AI's client
    # auto-configuration publishes these as, to the tools it composes itself.
    #
    # None ship configured. Only streamable HTTP is worth using — stdio would launch a subprocess
    # beside this process, and SSE is deprecated upstream.
    #
    # `headers` is ours, not Spring AI's. Upstream binds only `url` and `endpoint` per connection
    # and leaves authentication to a McpSyncHttpClientRequestCustomizer bean, which is code nobody
    # should have to write to send a token. The map below is bound by
    # McpStreamableHttpHeadersProperties, which reads this same block, and applied to every outbound
    # request of that one connection by McpClientHeadersConfiguration. Spring AI ignores the key it
    # does not know, so the two bindings coexist. Read the values from the environment: this file is
    # on the classpath, and a token pasted here ends up in the binary.
    #
    # mcp:
    #   client:
    #     streamable-http:
    #       connections:
    #         github:
    #           url: https://api.githubcopilot.com/mcp/
    #           headers:
    #             Authorization: Bearer ${GITHUB_MCP_TOKEN}
    # Which provider serves each kind of model. Spring AI's own switch, not one of this project's.
    #
    # Stated rather than left to a default, and that is not a style choice. Every model
    # auto-configuration Spring AI ships is `matchIfMissing`, so "unset means openai" holds only
    # while one provider is on the classpath. This application carries two —
    # spring-agent-provider-openai and spring-agent-provider-google-genai — so a kind that names
    # nothing would get *both*, and the application would fail to start with two ChatModel beans.
    #
    # Note that embeddings take two keys with the same value. `embedding` is what Spring AI's OpenAI
    # auto-configuration reads and `embedding.text` is what its Google GenAI one reads, so naming
    # only one of them silences one provider and leaves the other matching by default. Setting both
    # is correct in either direction and does not depend on remembering which is which.
    # GoogleGenAiProviderCoexistenceTest covers all of this by name.
    #
    # `openai` throughout is the laptop default: OPENAI_BASE_URL points at whatever gateway is in
    # use, DashScope's and Gemini's compatible-mode endpoints included. Set all four to
    # `google-genai` and name GEMINI_API_KEY to talk to Gemini natively instead — which is what
    # gets thinking levels and reference-image editing.
    #
    # Image generation is `openai` rather than the servers' `none`, which is the one place this file
    # deliberately differs from theirs: a command line generating an image is not a deployment
    # quietly spending somebody's budget, and whether OPENAI_BASE_URL actually serves
    # /v1/images/generations is the gateway's business. A native binary bakes this decision at build
    # time — see nativeDefaultBackends in build.gradle.
    model:
      chat: ${CHAT_MODEL_PROVIDER:openai}
      embedding: ${EMBEDDING_MODEL_PROVIDER:openai}
      embedding.text: ${EMBEDDING_MODEL_PROVIDER:openai}
      image: ${IMAGE_MODEL_PROVIDER:openai}
      # Not a choice — Spring AI ships no Google GenAI TranscriptionModel — but a way to turn the
      # TranscribeAudio tool off. Left at `openai` the tool is registered against whatever
      # OPENAI_BASE_URL names, which a gateway serving no transcription answers with a 404 every
      # time; set it to `none` there, and on any google-genai-only setup.
      audio:
        transcription: ${TRANSCRIPTION_MODEL_PROVIDER:openai}
    # Google Gemini's own API: Spring AI's spring-ai-google-genai over Google's official
    # com.google.genai SDK, which calls {model}:generateContent on generativelanguage.googleapis.com
    # rather than /chat/completions. Gemini's OpenAI-compatible endpoint is a different thing and
    # works through spring.ai.openai above; this is what has thinking levels and reference-image
    # editing.
    #
    # Read by spring-agent-provider-google-genai, which contributes nothing at all until api-key
    # names a key — two of Spring AI's Google GenAI auto-configurations are ungated and would
    # otherwise fail startup here, so the module filters every one of them out while this is blank.
    # See GoogleGenAiAutoConfigurationFilter.
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          # No default: Gemini has no default chat model and refuses an empty name with a message
          # that reads like a broken endpoint. GoogleGenAiConnectionCheck says so at startup
          # instead, and only when a switch above actually names google-genai.
          model: ${GEMINI_CHAT_MODEL:}
        embedding:
          text:
            model: ${GEMINI_EMBEDDING_MODEL:}
            # 1024 to agree with every other provider's default here. gemini-embedding-001 emits
            # 3072 and is Matryoshka-trained, so 768, 1536 and 3072 are the sizes Google recommends
            # truncating to; any value from 1 to 3072 is accepted. Nothing here has a fixed width —
            # this application's vector store is the in-heap one — so changing it costs only a
            # re-index, unlike on the servers, where Milvus refuses an insert that disagrees.
            dimensions: ${GEMINI_EMBEDDING_DIMENSIONS:1024}
        image:
          # gemini-2.5-flash-image is Spring AI's default and is the model that edits from reference
          # images; gemini-3-pro-image is the slower, better one.
          model: ${GEMINI_IMAGE_MODEL:gemini-2.5-flash-image}
    # Anthropic's Claude models. Read by spring-agent-provider-anthropic, over Spring AI's
    # spring-ai-anthropic and the official com.anthropic SDK, which calls /v1/messages — not
    # /chat/completions, so nothing under spring.ai.openai below applies to it.
    #
    # Chat only. Anthropic serves no embeddings, no image generation and no transcription, so a
    # deployment on Claude always names another provider for those kinds. That is supported rather
    # than a workaround — spring.ai.model.* is per kind — but it does mean "run it on Claude" is
    # never one variable: spring.ai.model.embedding and .embedding.text still have to name somebody
    # who serves embeddings, or there is no knowledge base and no tool-search index.
    # AnthropicProviderCoexistenceTest is what pins that.
    #
    # Nothing below does anything until spring.ai.model.chat above names `anthropic`.
    anthropic:
      # Which host the Claude protocol is spoken to: `anthropic` for Anthropic's own API with an
      # API key, or `vertex` for a Google Cloud project with an OAuth token — which is how an
      # organisation that buys Claude through GCP reaches it.
      #
      # This one *is* a switch of this project's, unlike spring.ai.model.* above, and the difference
      # is worth keeping straight: that switch chooses which provider serves a kind of model, this
      # one chooses which host the same provider's protocol goes to. The request body, the options,
      # the streaming and the tool protocol are identical either way, which is why this is one
      # module with a backend rather than two modules. Spring AI has no property for it — its own
      # auto-configuration hard-wires Anthropic's backend — so on `vertex` the module publishes the
      # chat model itself and Spring AI's backs off. See AnthropicVertexAutoConfiguration.
      backend: ${ANTHROPIC_BACKEND:anthropic}
      # Only read on the `anthropic` backend; `vertex` authenticates with Google credentials and
      # needs no key at all.
      #
      # Leaving this blank while spring.ai.model.chat names `anthropic` is refused at startup rather
      # than allowed, and that is a guard rather than pedantry: with no key configured the SDK falls
      # back to ANTHROPIC_API_KEY and ANTHROPIC_AUTH_TOKEN in the *process* environment, so a
      # deployment that forgot this would not fail on a machine that exports one — it would work,
      # and bill whoever owns that key. See AnthropicConnectionCheck.
      api-key: ${ANTHROPIC_API_KEY:}
      # Blank means api.anthropic.com. A value here is for a gateway re-serving the protocol, and is
      # ignored on the `vertex` backend, whose host is derived from the location below.
      base-url: ${ANTHROPIC_BASE_URL:}
      # 30 minutes, matching spring.ai.openai.chat.timeout below and for the same reason. The SDK's
      # own default is 60 seconds, which is routinely less than a run takes once it streams a long
      # answer and calls tools in between; the symptom of that default is a run dying partway
      # through with a read timeout and no explanation from the endpoint.
      timeout: ${ANTHROPIC_TIMEOUT:30m}
      chat:
        # No default, even though AnthropicChatOptions has one. An unset model there is not an
        # error: Spring AI substitutes a Claude model silently, so the deployment runs on one nobody
        # chose. On the `vertex` backend that is wrong twice over, because Vertex spells model ids
        # its own way — older ones carry an `@` date (claude-sonnet-4-5@20250929, not
        # claude-sonnet-4-5-20250929) while newer ones are undated (claude-opus-5, claude-sonnet-5)
        # — so the substituted name is one the project refuses with a 404 that reads like a broken
        # project. AnthropicConnectionCheck fails startup instead, and only when spring.ai.model.chat
        # actually names anthropic. Take the id from the Model Garden card rather than from
        # Anthropic's own docs.
        model: ${ANTHROPIC_CHAT_MODEL:}
        # Anthropic requires max_tokens on every request, and the SDK defaults it to 4096 — low for
        # a run that calls tools and then writes a long answer. Going over it is not an error
        # either: the turn simply stops, with stop_reason=max_tokens and nothing in the log. Named
        # here so the default is this project's rather than the SDK's.
        max-tokens: ${ANTHROPIC_MAX_TOKENS:8192}
      # Only read when backend is `vertex`.
      vertex:
        project-id: ${ANTHROPIC_VERTEX_PROJECT:}
        # A Vertex region, or `global`. It decides the hostname as well as the placement —
        # <location>-aiplatform.googleapis.com, with `global`, `us` and `eu` having hosts of their
        # own — so a location that does not serve the model answers 404 rather than falling back.
        #
        # `global` is what Google recommends and is the cheapest: it routes dynamically for
        # availability, while a named region or the `us`/`eu` multi-regions carry a 10% premium and
        # exist for data residency or provisioned throughput. It also decides which models are
        # reachable — the newest Claude models are served only from `global` and the multi-regions,
        # so pinning a single region limits what this deployment can ask for.
        location: ${ANTHROPIC_VERTEX_LOCATION:}
        # Blank means Application Default Credentials, which is the normal case and covers all three
        # usual ways a deployment proves itself: `gcloud auth application-default login` on a
        # laptop, GOOGLE_APPLICATION_CREDENTIALS pointing at a file, and workload identity on GKE or
        # Cloud Run. A path or classpath: URL here names a service-account JSON instead, for a
        # deployment running outside Google Cloud with a mounted secret.
        credentials-location: ${ANTHROPIC_VERTEX_CREDENTIALS:}
    openai:
      # Empty defaults rather than required values, and that changed when this application gained a
      # second provider. A required placeholder is resolved whenever anything binds the block —
      # which the transcription auto-configuration does even when chat and embeddings have gone to
      # Gemini — so a google-genai-only laptop would fail to start on a variable it has no reason
      # to set. Leaving a needed one blank is still caught, and caught better: OpenAiConnectionCheck
      # names the missing variable at startup, where an unresolved placeholder names a property.
      base-url: ${OPENAI_BASE_URL:}
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: ${OPENAI_MODEL:}
        temperature: 0
        # How much the model thinks before it answers, and as much as there is: the ladder the SDK
        # knows is minimal, medium, high, xhigh, none. `xhigh` because this agent's turns are tool
        # calling ones — which tool to reach for, and whether the result answers the question — and
        # that is the part a model gets wrong when it is hurried, not the prose. It is also the
        # expensive end: thinking tokens are billed at the thinking rate (app.ai.model-pricing) and
        # the reasoning a surface shows gets correspondingly longer.
        #
        # Only meaningful on a reasoning model, and only on an endpoint that reads the field: an
        # OpenAI-compatible gateway in front of a non-reasoning model ignores it, and a few reject
        # an unknown field outright rather than dropping it, which fails every request. The value
        # is passed through as written — ReasoningEffort.of() builds an open enum, so a word that
        # is not on the ladder above is sent as-is and refused by the endpoint rather than here.
        # Set OPENAI_REASONING_EFFORT to step down it, or to an empty value to stop sending the
        # field at all.
        reasoning-effort: ${OPENAI_REASONING_EFFORT:xhigh}
        # OkHttp's callTimeout, not a read timeout — it bounds the entire streaming call, so it has
        # to outlast the longest single model turn. See the app's application.yaml for why the two
        # cannot be told apart here.
        timeout: 30m
        # `stream-options` is deliberately unset: Spring AI asks for streaming usage on its own,
        # and naming the options here adds `include_obfuscation` to the request, which endpoints
        # other than OpenAI's reject. See the app's application.yaml.
      embedding:
        base-url: ${EMBEDDING_BASE_URL:}
        api-key: ${EMBEDDING_API_KEY:}
        model: ${EMBEDDING_MODEL:}
        dimensions: 1024
    vectorstore:
      # `simple` and nothing else here: it keeps the tool-search index in the heap and mirrors it to
      # a JSON file, so a laptop needs no server. Milvus is a deployment concern and its starter is
      # not on this module's classpath.
      type: simple
  datasource:
    # Under the user's home rather than ./data, unlike spring-agent-app: a per-directory database
    # would silently give them a different agent in each directory they ran from.
    #
    # WAL and a busy timeout because a run writes while the next question is being typed, and SQLite
    # serialises writers: without them a second writer fails immediately with SQLITE_BUSY.
    url: ${DATASOURCE_URL:jdbc:sqlite:${user.home}/.spring-agent/spring-agent-cli.db?journal_mode=WAL&busy_timeout=5000}
    username: ${DATASOURCE_USERNAME:}
    password: ${DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      # The schema is owned by the application: these are the agent's own tables and there is no
      # migration tool in the picture. `update` adds tables and columns as the models gain them and
      # never drops anything.
      ddl-auto: ${JPA_DDL_AUTO:update}
    # SQLite lives in hibernate-community-dialects rather than core, so Hibernate cannot infer it
    # from the JDBC metadata the way it does for the databases it ships.
    database-platform: ${JPA_DIALECT:org.hibernate.community.dialect.SQLiteDialect}
    open-in-view: false
logging:
  # Which run a log line belongs to, in front of every console and file line. Boot leaves this slot
  # (${LOG_CORRELATION_PATTERN}, which both of its patterns already carry) empty unless something
  # fills it; what puts a value behind it is me.kezhenxu94.springagent.core.logging.RunMdc, which is
  # also where the reasoning lives for how one run's identity follows it across the threads it is
  # assembled, streamed, tool-called and finished on.
  #
  # The request id alone, although the MDC also holds the conversation and the user: this is the
  # line a person reads, the request id is what everything else correlates by, and the other two
  # would double its width for something nobody greps a terminal for. They are not lost — with
  # LOG_APPENDER=STDOUT_JSON, JsonLogLayout writes the whole MDC as fields of its own, which is the
  # appender a deployment shipping its logs anywhere runs.
  #
  # Empty on any line no run is behind: startup, the sweepers, an HTTP request that starts nothing.
  pattern:
    correlation: "%X{requestId:-} "
  level:
    # Spring AI logs every document it embeds at INFO while the tool index is built, which on a
    # cold start is one line per tool. Harmless in a server log, but this is the file a user opens
    # when something went wrong, and it buries everything else.
    org.springframework.ai.vectorstore.SimpleVectorStore: WARN
app:
  # Whether a run's MDC follows it across the threads it crosses, so that the log lines Spring AI,
  # the OpenAI client and the tool-calling loop write from inside a run's reactive chain carry the
  # run's id like the lines this codebase writes itself. On, and worth knowing what it costs: it is
  # reactor.core.publisher.Hooks#enableAutomaticContextPropagation, which is global to the JVM
  # rather than to this runtime's own streams, so every Reactor chain in the process pays for a
  # capture and a restore around each signal. Turning it off leaves the explicit scopes in
  # me.kezhenxu94.springagent.core.logging.RunMdc, which still name every line this runtime logs.
  logging:
    run-context-propagation: true

  # Which language the agent's own text speaks — what it writes into a conversation itself, as
  # opposed to what the model wrote or what a surface says directly. The note recording that the
  # user has already been asked something is the one so far. Defaults to the host's language; en
  # and zh_CN ship with it, and any other is a core/messages_xx.properties on the classpath away.
  locale: ${SPRING_AGENT_LOCALE:}
  #
  # This also chooses the language the tools describe themselves to the model in. What @Tool and
  # @ToolParam say is English, an annotation value being a compile-time constant, so a translation is
  # an override applied on the way to the model: core/prompts/tools/<ToolName>_<locale>.md for a
  # tool's own description, and a <ToolName>.<parameterName> key in core/tools_<locale>.properties for
  # each of its parameters. A module with tools of its own ships the same pair — see feishu/tools.
  # Anything untranslated keeps the English it declares, so this can be filled in a tool at a time,
  # and the tools whose names nothing here can know, every MCP server's, are left alone.
  #
  # It reaches the system prompt, the tool descriptions and parameter descriptions, what a tool
  # answers with, and the reference pages a tool returns whole. Which is most of the prompt, and is
  # why leaving this unset is the first thing to check when the model reasons in English in a
  # conversation held in another language: unset means the host's locale, and a container without
  # LANG set speaks English. Each module logs at startup which locale it resolved and how many
  # translations it found — search the log for "Tool translations for" — and setting
  # logging.level.me.kezhenxu94.springagent.core.tools.i18n=TRACE prints the definitions actually
  # offered, which is the last word on what the model read.
  #
  # What it cannot reach, and what therefore still pulls a turn towards English:
  #   - an MCP server's tools. Their descriptions come from the server and nothing here rewrites
  #     them, so a workspace with many English MCP tools is reading English on every iteration.
  #   - a tool name. Those are identifiers the model has to type back, and are English on purpose.
  #   - what the conversation already holds. Chat memory replays earlier turns, so a thread that
  #     started in English carries on in English whatever this says.
  #   - the user's own content: memories, skills, knowledge-base documents and the payloads of
  #     observed events are quoted as they were written.
  #   - the model itself. Some reasoning models emit their chain of thought in English however they
  #     are prompted; the system prompt asks for the workspace language in the reasoning as well as
  #     in the answer, which is as far as a prompt can go.
  storage:
    location: ${user.home}/.spring-agent/
    # Validated as non-blank though nothing here reads them: they are for a deployment serving files
    # over HTTP. Pointed at the directory the files are actually in, so any that gets printed leads
    # somewhere the user can look.
    base-url: file://${user.home}/.spring-agent/%s
    cdn-url: file://${user.home}/.spring-agent/%s
  cli:
    # Who the agent thinks it is talking to. Scopes the workspace, the memories and the stored
    # credentials, so changing it is equivalent to starting again as somebody else.
    user-id: ${SPRING_AGENT_USER:${user.name}}
    # Colour and the marker glyphs. Turned off automatically when the terminal is dumb or output is
    # piped, so this is only for forcing plain text on a terminal that claims to support more.
    color: ${SPRING_AGENT_COLOR:true}
    # Which language the command line speaks. Defaults to the operating system's; en and zh_CN ship
    # with it, and any other is a messages_xx.properties on the classpath away.
    locale: ${SPRING_AGENT_LOCALE:}
  persistence:
    # The only backend this module depends on. Left explicit rather than inferred so the value is
    # visible next to the datasource it uses.
    type: jpa
  scheduling:
    # The timer behind scheduled tasks. Nothing here is a model setting, which is why it sits beside
    # app.ai rather than inside it. Two differences from the server files this is derived from: no
    # situation triage, since this module does not carry spring-agent-events, and nothing about
    # replicas — a command line is one process on one machine.

    # How often to look for scheduled tasks that have come due, and so the worst case by which a
    # task fires late.
    #
    # The tightest schedule anybody can create is five minutes, because ScheduledTaskTool raises
    # anything shorter, so thirty seconds is at worst a tenth of the shortest cadence in play and
    # the tasks people actually write are hourly and daily. Firing was never to the second in any
    # case — a run is handed to a Reactor scheduler and its first token is seconds away. Against
    # that, a sweep reads the whole active set.
    #
    # Lower this only alongside that five-minute floor in ScheduledTaskTool#enforceMinimumInterval;
    # the two are what make each other reasonable.
    #
    # Two consequences of the schedule living in the database rather than in a timer, and they
    # matter more here than on a server: a laptop is closed far more often than a deployment is
    # restarted. A task whose moment passed while the process was not running is not skipped, as it
    # used to be — it fires the next time the command line is started. And however many occurrences
    # were missed, it fires *once*: a periodic task is a standing instruction, not a debt, and
    # replaying a weekend of a five-minutely task would be hundreds of model calls the moment you
    # sat down. See ScheduledTaskService#nextFireAtFor.
    sweep-interval: ${SCHEDULING_SWEEP_INTERVAL:PT30S}

    # How many threads the shared scheduler has: the scheduled-task sweeper and every @Scheduled
    # method. The sweep does not hold its thread for the length of an agent run — firing a run
    # returns immediately — so four is ample.
    #
    # Note that spring.task.scheduling.pool.size does *not* reach this. The bean is built by hand in
    # SpringAgentCoreAutoConfiguration and named taskScheduler, which displaces Boot's own, so
    # Boot's settings for it are read by nothing. This is the property that works.
    pool-size: ${SCHEDULING_POOL_SIZE:4}
  ai:
    # Not set, which takes core/prompts/system-prompt.md in the app.locale language, supplied by
    # PromptDefaults. Stating it blank here would be worse than saying nothing: blank is config data
    # and so beats that default, and core then falls back to DEFAULT_SYSTEM_PROMPT — English, whatever
    # the workspace speaks. Set this to a prompt of your own to give the agent a persona, house rules
    # or domain knowledge; what you write wins in every locale.
    vectorstore:
      simple:
        # Written on a graceful shutdown and reloaded on startup; if it is missing or unreadable the
        # index is rebuilt, at the cost of re-embedding the tool descriptions on the next start.
        file: ${VECTORSTORE_FILE:${user.home}/.spring-agent/vectorstore.json}
    tools:
      # Only what the command line differs from core's own defaults on, which ToolDefaults supplies
      # — the subagent settings among them, so they are the same here as on the server.
      ask-user-question:
        # Whether the agent may stop and ask a multiple-choice question rather than guessing. The
        # questions are drawn in the terminal and the run waits for the answer, so unlike the chat
        # integrations there is no expiry to configure — CliQuestionHandler explains why.
        enabled: ${ASK_USER_QUESTION_ENABLED:true}
      publish-file:
        # Where PublishFile says it put a file. No server to serve it, so the honest answer is the
        # path on this machine.
        base-url: file://${user.home}/.spring-agent/
      shell:
        # `local`: Spring AI's own ShellTools, in this process as this user, with their filesystem,
        # secrets and network. That is what makes the tool useful on a laptop and it is also the
        # whole of the risk — there is no sandbox, and a command the agent runs is a command the
        # user ran. Set TOOLS_SHELL_TYPE=none to take the Bash tool away entirely.
        #
        # `kubernetes` and `docker` are not options here: selecting them needs their modules, and
        # this one depends on neither.
        type: ${TOOLS_SHELL_TYPE:local}
      mcp:
        trusted-hosts: []
