plugins {
  alias(libs.plugins.spring.boot)
  alias(libs.plugins.spring.dependency.management)
  id 'springagent.java-common-conventions'
  id 'springagent.native'
  id 'application'
  // Applied below instead of here, see the conditional in spring-agent-app/build.gradle for why the
  // gate exists. `apply false` still makes the plugin resolvable by id, which is what
  // pluginManager.apply needs.
  alias(libs.plugins.graalvm) apply false
}

// Read by springagent.native.gradle, so they have to be set before it configures anything.
//
// Deliberately not the module's name: the binary, the SQLite database under ~/.spring-agent and the
// log file beside it are what a user already has on disk, and renaming them would leave every
// existing conversation behind a name nothing looks for any more. The module is named for the
// family it belongs to; the artefact is named for the command people type.
ext.nativeImageName = 'spring-agent-cli'
// A native image bakes the @Conditional decisions, so the binary's shell backend is chosen here
// rather than by TOOLS_SHELL_TYPE at runtime. `local` matches application.yaml's default and is
// what makes the binary useful with nothing installed; -PnativeBackends overrides it.
ext.nativeDefaultBackends = 'shell-local'

if (providers.gradleProperty('native').present) {
  pluginManager.apply('org.graalvm.buildtools.native')
}

dependencies {
  implementation project(':spring-agent-core')
  // Only this one, unlike spring-agent-app which carries all three: a command line run from a
  // laptop should need no server, and SQLite under the user's home is the whole of its storage.
  // Selecting a different backend means adding its module here, not flipping a property.
  implementation project(':spring-agent-persistence-jpa')

  implementation libs.spring.shell.starter
  implementation 'org.springframework.ai:spring-ai-starter-model-openai'
  implementation libs.spring.ai.agent.utils
  implementation libs.guava

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

def patchJvmArgs = [
  // sqlite-jdbc loads its bundled native library through System::load.
  "--enable-native-access=ALL-UNNAMED",
  "--add-opens=java.base/java.io=ALL-UNNAMED",
  "--add-opens=java.base/java.lang=ALL-UNNAMED",
  "--add-opens=java.base/java.time=ALL-UNNAMED",
  "--add-opens=java.base/java.util=ALL-UNNAMED",
  "--add-opens=java.base/sun.nio.ch=ALL-UNNAMED"
]

application {
  mainClass = 'me.kezhenxu94.springagent.appcli.SpringAgentCliApplication'
  applicationDefaultJvmArgs += patchJvmArgs
}

// The command line is the user interface, so Gradle must not sit between it and the terminal:
// without these the process gets a pipe, JLine sees no tty and falls back to a dumb terminal where
// nothing is editable and the question views cannot draw.
bootRun {
  standardInput = System.in
  jvmArgs += patchJvmArgs
}
