# 各工具参数的中文说明，键为 <ToolName>.<parameterName>。约定见 core/tools.properties。
#
# 这些文字是模型读的，不是人读的：它要照着这里说的去填参数，所以译文要把“填什么、什么格式、
# 不填会怎样”都说清楚，宁可比英文啰嗦，也不要含糊。参数名本身不译，它是协议里的标识符。

# 知识库
ListKnowledgeBase.offset=跳过多少个文档；取第一页时填 0
ListKnowledgeBase.limit=返回多少个文档；默认 20
IndexKnowledge.title=给这份文档起一个简短、能在列表里认出来的标题
IndexKnowledge.docId=这份文档"是什么"的标识：飞书文档的 token、一个网址、一个绝对文件路径、用户告诉你这件事的那条消息的 id，或者正在被修订的那份文档的 id。用同一个 id 再存一次是替换它
IndexKnowledge.scope=own、group 或 tenant；默认 own
IndexKnowledge.text=内容本身；如果要从文件读取，就不要填这个参数。它接受文件引用：用 @file:<路径> 把某次已保存的工具结果原样归档，或者用 @file:<路径>#/json/pointer 只归档其中一部分
IndexKnowledge.source=它出自哪里：要读取的文件的绝对路径，或者它被抓取自的那个网址。只要你有来源，就一定要填
SearchKnowledge.query=要检索什么，用自然语言描述
SearchKnowledge.topK=返回多少段内容；默认 4
UpdateKnowledgeScope.docId=文档 id，由 ListKnowledgeBase 给出
UpdateKnowledgeScope.scope=移到哪个知识库：own、group 或 tenant
DeleteKnowledge.docId=文档 id，由 ListKnowledgeBase 给出

# 图像与语音
GenerateImage.prompt=描述要生成的图像的提示词
GenerateImage.size=图像尺寸，取 '2K'、'4K'、'1:1'、'16:9'、'9:16' 之一
GenerateImage.thinkingMode=生成前是否先思考；默认 false
RecognizeImage.images=要识别的图像：本地绝对路径，或公网可访问的 URL
RecognizeImage.prompt=想就这些图像问什么；不填就只让模型描述图像内容
TranscribeAudio.filePath=要转写的本地音频文件的绝对路径

# 文件发布
PublishFile.path=要发布的本地文件或目录的绝对路径
PublishFile.visibilityParam=internal 或 public
PublishFile.ttl=链接存活多久，写成 30s、10m、2h 或 1d 这样的时长。对 public 是可选的（默认 1d，最长 30d），对 internal 也是可选的（不填则永不过期）
UpdatePublishedFile.token=发布时返回的那个 token：链接里 visibility 和用户 id 之后的那一段
UpdatePublishedFile.path=新的本地文件或目录的绝对路径
UpdatePublishedFile.mode=update（叠加，默认）或 replace（整体替换）
UnpublishFile.token=发布时返回的那个 token：链接里 visibility 和用户 id 之后的那一段
RenewPublishedFile.token=发布时返回的那个 token：链接里 visibility 和用户 id 之后的那一段
RenewPublishedFile.ttl=新的有效期，从现在起算，写成 30s、10m、2h 或 1d 这样的时长。对 public 是可选的（默认 1d，最长 30d），对 internal 也是可选的（不填则永不过期）

# 定时任务
CreateScheduledTask.taskText=任务触发时发给智能体的提示词
CreateScheduledTask.cronExpression=六段式 Spring cron 表达式，用于周期任务；一次性任务填 null
CreateScheduledTask.scheduledAt=一次性任务的触发时刻，带时区偏移的 ISO-8601；周期任务填 null
CreateScheduledTask.expiresAt=任务何时停止触发，带时区偏移的 ISO-8601（例如 "2025-12-31T23:59:59+08:00"）。传 "never" 表示永不失效；不填则 7 天后失效。
UpdateScheduledTask.taskId=要修改的任务 id，由 ListScheduledTasks 给出
UpdateScheduledTask.taskText=任务触发时改发的新提示词；填 null 表示不改
UpdateScheduledTask.cronExpression=新的六段式 Spring cron 表达式，会把这个任务变成周期任务；填 null 表示保持现有的触发时机不变
UpdateScheduledTask.scheduledAt=一次性触发的新时刻，带时区偏移的 ISO-8601（例如 "2025-01-15T10:00:00+08:00"）；填 null 表示保持现有的触发时机不变
CancelScheduledTask.taskId=要取消的任务 id

# 技能
WriteSkillFile.filePath=技能目录内某个文件的绝对路径
WriteSkillFile.content=要写入的内容
DeleteSkill.skillFolderPath=要删除的技能目录的绝对路径
DeleteSkillFile.filePath=技能目录内要删除的文件的绝对路径

# 子智能体
StartSubagent.description=用主动语态写一句话，说明这个子智能体是做什么的，它工作期间会展示给用户，例如“正在梳理故障时间线”
StartSubagent.prompt=交给子智能体的完整任务说明：任务本身、它需要的全部事实、以及要回报什么。它看不到当前对话的任何内容。
WaitForSubagent.subagentId=StartSubagent 返回的 id
CancelSubagent.subagentId=StartSubagent 返回的 id

# 凭据
SetCredential.name=凭据名称（可用作环境变量名的标识符）
SetCredential.value=凭据的值
DeleteCredential.name=要删除的凭据名称

# MCP 服务器
AddMcpServer.name=这台 MCP 服务器的唯一名称，之后引用或移除它时用它指代
AddMcpServer.url=MCP 服务器的接入地址
AddMcpServer.title=可选，报给服务器的显示名；默认与 name 相同
AddMcpServer.version=可选，报给服务器的客户端版本；默认 1.0.0
AddMcpServer.description=可选，给人看的说明
AddMcpServer.websiteUrl=可选，这个集成的网站地址
ShareMcpServer.name=要共享的 MCP 服务器名称
ShareMcpServer.targetId=共享给谁：飞书的 open_id（用户）或 chat_id（群）
UnshareMcpServer.name=MCP 服务器名称
UnshareMcpServer.targetId=要收回权限的飞书 open_id 或 chat_id
RemoveMcpServer.name=要移除的 MCP 服务器名称

# 工具搜索（上游 spring-ai 的工具，但它是每一轮都挂在模型身上的那一个）
toolSearchTool.query=用自然语言描述你需要的工具能力。要具体，并带上相关的关键词
toolSearchTool.maxResults=最多返回多少个工具名称（1 到 10）。默认 5
toolSearchTool.categoryFilter=可选，把搜索限定在某个工具类别之内

# 前一批漏掉的参数（用抓包得到的真实工具定义核对出来的，不是靠扫源码）
GenerateImage.referenceImages=用作参考的图像。每一个都必须是公网可访问的 URL；本地文件请先用 PublishFile 发布（visibility=public，ttl=30m），再用它返回的链接
UpdatePublishedFile.ttl=新的有效期，从现在起算，写成 30s、10m、2h 或 1d 这样的时长；不填则保持原有的到期时间
CreateScheduledTask.background=让每次触发都在后台运行、不露面：不会为它发任何消息，你写的内容也不会送到任何地方，用户只能通过任务自己发出的消息知道这件事。只有触发失败才会被报告。当任务自己判断有没有值得说的事情时（“查一下 X，只有当 Y 成立才把摘要发给 Z”），或者它本来就会自己发消息时（“每天早上把数字发给我”），就设置它——否则用户会既收到那条消息，又额外收到一份运行报告。要在 taskText 里说明发给谁。如果这个任务的答复本身就是目的，就不要设置它：那样每次触发都会像一次正常的运行那样，在它被创建的那个会话里回复。
AddMcpServer.headers=可选，用于鉴权的 HTTP 头，例如 {"Authorization": "Bearer <token>"}

# ── 来自 spring-ai-agent-utils 的工具。它们的注解在别人的 jar 里，改不了，所以译文只能落在这里；
# 这也正是把翻译做在工具定义上、而不是做在工具类里的原因。
Read.filePath=要读取的文件的绝对路径
Read.offset=从第几行开始读。只有当文件太大、无法一次读完时才传
Read.limit=读多少行。只有当文件太大、无法一次读完时才传
Write.filePath=要写入的文件的绝对路径（必须是绝对路径，不能是相对路径）
Write.content=要写入的内容
Edit.filePath=要修改的文件的绝对路径
Edit.old_string=要被替换掉的文字
Edit.new_string=用来替换它的文字（必须与 old_string 不同）
Edit.replace_all=是否替换 old_string 的全部出现处（默认 false）
AskUserQuestionTool.questions=要问用户的问题（1 到 4 个）
AskUserQuestionTool.answers=由权限组件收集到的用户答复
MemoryView.path=要查看的文件或目录的路径，相对于记忆库根目录。传空字符串或 '/' 表示根目录。传 'MEMORY.md' 可读取索引
MemoryView.viewRange=可选，查看文件时的行区间，写成 'start,end'（例如 '1,50'）。查看目录时本参数无效
MemoryCreate.path=新文件的路径，相对于记忆库根目录（例如 'feedback_testing.md'）。名字要能说明它讲的是什么
MemoryCreate.fileText=完整的文件内容，包含 YAML frontmatter 块，其后是记忆正文
MemoryStrReplace.path=要编辑的文件路径，相对于记忆库根目录。传 'MEMORY.md' 表示更新索引
MemoryStrReplace.oldStr=要查找并替换掉的确切文字。它在文件中必须只出现一次
MemoryStrReplace.newStr=用来替换的文字。传空字符串表示删掉匹配到的文字
MemoryInsert.path=要修改的文件路径，相对于记忆库根目录。传 'MEMORY.md' 表示往索引里追加一条
MemoryInsert.insertLine=在第几行之后插入。传 0 表示插到第一行之前；传文件总行数表示追加到末尾
MemoryInsert.insertText=要插入的文字。往 MEMORY.md 加条目时用：'- [标题](文件名.md) —— 一句话钩子'
MemoryDelete.path=要删除的文件或目录的路径，相对于记忆库根目录。别忘了之后还要去掉它在 MEMORY.md 里的条目
MemoryRename.oldPath=该文件或目录当前的路径，相对于记忆库根目录
MemoryRename.newPath=该文件或目录的新路径，相对于记忆库根目录。别忘了之后更新 MEMORY.md 里的链接

# Skill 的描述不在这里，也不在 core/prompts/tools/ 下：它是由库把已安装技能的列表拼进模板得到的，
# 覆盖整段描述会把那份列表弄丢。它的译文是 core/prompts/skill-tool_zh_CN.md 这个模板。参数可以照常覆盖。
Skill.command=技能名，不带参数。例如 "pdf" 或 "xlsx"
