question-asked=已完成。你的问题现在已经摆在用户面前了。不要再问一次，也不要臆测答案：就在此停下并结束本轮。如果用户作答，你会被重新唤起并收到他们的回答。
question-already-asked=已经提问且仍未得到回答。你已经把问题交给用户，他们还没有回复。再问一次没有任何作用。就在此停下并结束本轮，不要再调用任何工具；如果用户作答，你会被重新唤起并收到他们的回答。
question-cannot-ask=无法提问。这些问题无法在任何渠道展示给用户，因此不会有回答。请根据你已知的信息继续，并说明你所做的假设。

run-shutting-down=智能体正在关闭，暂时无法接受新的工作。

subagent-started=已启动子智能体 {0}（{1}），它正在工作。在结束本轮之前，请用 WaitForSubagent({0}) 取回它的结果；如果不再需要，请用 CancelSubagent({0}) 停掉它。
subagent-could-not-start=子智能体启动失败：{0}。没有任何东西在运行，也没有可等待的编号。请改为在这里自己完成这项工作，或者继续往下并说明这一部分缺失。
subagent-too-many=已经有 {0} 个子智能体在运行，这是同时允许的上限。请先对其中一个调用 WaitForSubagent 并使用它的结果，或者取消一个，然后再启动新的。
subagent-shutting-down=无法启动。智能体正在关闭，不会再接受新的子智能体。请用现有的信息继续，并说明哪一部分你没能查下去。
subagent-unknown=本轮没有编号为 {0} 的子智能体。只有本轮中 StartSubagent 返回给你的编号才能等待或取消。请核对编号，或者重新启动这项工作。
subagent-answer=子智能体 {0}（{1}）已完成，以下是它汇报的内容。这就是它能给你的全部，你无法再向它追问。
subagent-no-answer=子智能体 {0} 结束了，但什么也没有汇报，没有可用的结果。请要么在这里自己完成这项工作，要么重新启动它，并在指令中明确说明要汇报什么。
subagent-failed=子智能体 {0} 失败了：{1}。没有可用的结果。请判断是在这里自己完成、重新启动，还是继续往下并说明这一部分缺失。
subagent-cancelled=子智能体 {0} 在完成之前被停止了，因此没有结果可读。如果不是你停的，说明整轮正在被取消：就在此停下。
subagent-interrupted=对子智能体 {0} 的等待被打断了，拿不到它的结果。请就此停下，不要臆测它会说什么。
subagent-still-running=子智能体 {0}（{1}）已经工作了 {2}，仍在继续，目前还没有任何结果返回。请再次调用 WaitForSubagent({0}) 继续等它；如果你已经不需要它在查的内容，就用 CancelSubagent({0}) 停掉它。它还在运行时，不要结束本轮。
subagent-wait-timed-out=子智能体 {0} 运行超过 {1} 仍未结束，已被停止，因此没有结果可读。这远超一个子智能体应有的耗时，请把这项工作当作没有完成：要么在这里自己做，要么继续往下并明确说明这一部分缺失。
subagent-cancel-requested=子智能体 {0} 正在被停止。不要再等它，它不会给出结果。
subagent-already-finished=子智能体 {0} 早已结束（{1}），没有什么可以停止。如果你仍然需要它的结果，请用 WaitForSubagent({0}) 读取。

queued-message=以下是我在你工作期间发来的消息，晚于你正在回答的那条：\n{0}\n从现在起请把它考虑进来：如果它纠正或改变了你正在做的事，就放弃原来的方向、按它来做，并简短说明你已经改了。已经做完且依然成立的部分不要重做。
queued-message-from-another=管理员（{0}）在你工作期间向这个会话发来了以下消息。它不是你正在帮助的那个人发的，而对方也能看到：\n{1}\n请把它当作优先于你原有方向的指示：如果它纠正或改变了你正在做的事，就按它来做，并简短说明是管理员要求的改动。继续回答这个会话本来的那个人，已经做完且依然成立的部分不要重做。

home-dir=- {0} —— {1}。其下可以有 memories/、skills/、workspace/ 和 artifacts/ 四个目录。
home-dir-own=只属于你，别人看不到
home-dir-group=与本群聊中的所有人共享
home-dir-tenant=与全公司共享

# 知识库工具的返回结果。读者是模型而不是人，所以每一条都要说清楚发生了什么、接下来该怎么做。
knowledge-scope-own=你自己的
knowledge-scope-group=与本群共享的
knowledge-scope-tenant=全公司共享的
knowledge-chunks={0} 个片段
knowledge-empty=知识库是空的。可以用 IndexKnowledge 往里面存东西。
knowledge-page-empty=偏移量 {0} 处没有文档，列表在这一页之前就结束了。
knowledge-listed=共 {0} 个文档：\n\n{1}
knowledge-listed-more=共 {0} 个文档：\n\n{1}\n还有更多。用 offset={2} 再次调用 ListKnowledgeBase 查看余下的。
knowledge-list-failed=无法列出知识库：{0}
knowledge-indexed=已把 {0} 以 id {2} 存入{1}知识库，该 id 下原有的内容已被替换。
knowledge-index-failed=无法存入该文档：{0}
knowledge-title-required=需要一个标题。给这份文档起一个在列表里一眼能认出来的短名字。
knowledge-source-missing=没有可存的内容。请传入 text，或者传入可读取的 source。
knowledge-no-group=这里没有群，也就没有群知识库可写。当前是单聊，请改用 own。
knowledge-no-tenant=本部署没有全公司知识库。请用 own；如果在群聊里，也可以用 group。
knowledge-path-invalid=这不是一个可用的路径：{0}
knowledge-path-denied=拒绝访问。该路径不在你能访问的工作区内。可以改用 text 直接存内容，或先把文件复制到你的工作区。
knowledge-query-required=需要一个查询。用自然语言说明要搜什么。
knowledge-search-empty=知识库里没有与之匹配的内容：{0}。换个说法再试，或者接受这件事本来就没有被记录下来。
knowledge-search-found=共 {0} 段：\n\n{1}
knowledge-search-failed=无法搜索知识库：{0}
knowledge-doc-id-required=需要文档 id，可以从 ListKnowledgeBase 获取。
knowledge-doc-id-missing=需要 docId：正是它让同一份内容再存一次时更新原有文档，而不是留下两份。请用能标识这份内容的东西：飞书文档链接里的 token（/docx/、/wiki/、/sheets/ 或 /base/ 之后的那一段）、网页的 URL、文件的绝对路径、用户是在哪条消息里告诉你的那条消息 id，或者你要更新的那份文档的 id。如果这份内容本身没有任何可以标识它的东西，就问用户该归到哪个 id 下，不要自己编一个。
knowledge-deleted=已从{1}知识库删除文档 {0} 及其全部片段。
knowledge-delete-failed=无法删除该文档：{0}
knowledge-scope-unknown=没有这个知识库：{0}。请用 "own"、"group" 或 "tenant"。
knowledge-current-scope-unknown=请说明这个文档在哪个知识库里："own"、"group" 或 "tenant"。每个文档在哪个知识库里，可以用 ListKnowledgeBase 查看。文档 id 只在一个知识库内唯一，跨知识库并不唯一，不指明就可能动到另一份：{0}
knowledge-moved=已把 {0} 移入{1}知识库，它的 id、标题、来源和内容都没有变。
knowledge-move-not-found={1}知识库里没有 id 为 {0} 的文档。用 ListKnowledgeBase 核对 id 以及它在哪个知识库里。
knowledge-move-failed=无法移动该文档：{0}
knowledge-owner-required=需要一个用户 id。每个事件源的知识库属于谁，可以用 ListPlaybooks 查看。
knowledge-owner-empty={0} 自己的知识库是空的，这个身份下从来没有存过东西。
knowledge-owner-listed=在 {1} 自己的知识库里共 {0} 个文档：\n\n{2}
knowledge-owner-listed-more=在 {1} 自己的知识库里共 {0} 个文档：\n\n{2}\n还有更多。用 offset={3} 再次调用 ListOwnerKnowledgeBase 查看余下的。
knowledge-owner-search-empty=在 {1} 自己的知识库里没有与之匹配的内容：{0}。如果这就是某个事件源的 playbook 查询，那么它的自动巡检什么都读不到。
knowledge-owner-search-found=在 {1} 自己的知识库里共 {0} 段：\n\n{2}

# 当某个工具返回的内容多到没法直接给模型看时，告诉模型的话。读者是模型，所以既要说清文件里有什么，
# 也要说清怎么取用，而不只是说发生了什么。注意 MessageFormat：不要用单引号，不要有多余的花括号。
tool-result-spilled={0} 的返回内容太大（{1} 个字符），没法直接放在这里，已保存到：{2}\n里面是：{3}\n不要整个读一遍——你刚刚省下的正是这笔开销。请只探查你需要的那一部分：用 Grep 在 {2} 里搜索模式，用 Read 加 offset 和 limit 读取片段（文件是缩进过的，片段可以读通），如果有 shell 工具，就用 jq、yq、head、wc 处理 {2}，只取出或统计你要的那一个字段。\n要把它传给别的工具而不必自己抄一遍：如果某个工具参数说明它接受文件引用，就把该参数填成 @file:{2}；只想传其中一部分时填 @file:{2}#/指向/json/的/路径。

# 当 @file: 参数引用无法解析时的说明。每一条都要说清哪里出了问题、改成怎么做，
# 因为模型收到的是这条消息，而不是它本来想发起的那次调用。
tool-input-ref-not-accepted={1} 的 {0} 参数不接受文件引用，@file: 差点被当成普通文本写进去。这个工具中接受文件引用的参数有：{2}。请直接传内容本身；如果你确实就是要写这段文本，请用 {3}。
tool-input-ref-not-found=没有这个工具结果文件：{0}。它可能是另一台机器上的运行写下的，也可能已经被清理了。请重新调用产生它的那个工具。
tool-input-ref-outside=文件引用不能指向这个路径：{0}。只能引用本次会话中某次工具调用保存下来的文件，而且必须用那次调用给出的完整路径。
tool-input-ref-no-context=这次调用没有可用于解析文件引用的身份信息，无法解析引用。请直接传内容本身。
tool-input-ref-too-large={0} 有 {1} 个字符，超过了引用可携带的上限 {2}。请用 #/json/pointer 缩小范围，或者分批处理。
tool-input-ref-not-text={0} 不是文本，没有可以放进工具参数的内容。只能引用保存下来的文本或 JSON 结果。
tool-input-ref-unreadable=无法读取 {0}：{1}
tool-input-ref-not-json={0} 不是 JSON，指针 {1} 在其中选不到任何东西。请去掉指针，引用整个文件。
tool-input-ref-bad-pointer=这不是合法的 JSON Pointer：{0}。它必须以斜杠开头，例如 /data/items/0。
tool-input-ref-pointer-missing=指针 {0} 在 {1} 中选不到任何东西。它的顶层键有：{2}。

# 定时任务触发后对自身的操作（FiringScheduledTaskTool）返回给模型的话。
firing-task-none=这一次运行不是定时任务的触发，因此这里没有可操作的任务。请改用 CreateScheduledTask、UpdateScheduledTask 或 CancelScheduledTask。
firing-task-stopped=已停止这个定时任务（{0}）：{1}。它不会再触发了。
firing-task-repeats=这个任务已经按 {0} 周期重复，本来就有下一次触发。请改用 StopThisScheduledTask 结束它。
firing-task-bad-next-run=nextRunAt 必须是带时区偏移的 ISO-8601，例如 2025-01-15T10:00:00+08:00。
firing-task-next-run-past=nextRunAt 必须是将来的时间。
firing-task-after-expiry=这个任务在 {0} 失效，因此不能改到 {1}。
firing-task-rearmed=这个任务（{0}）将在 {1} 再次触发，届时会说：{2}。它仍然是同一个任务，不是新增的第二个。

user-model-default-name=默认模型
user-model-add-incomplete=需要同时提供名称、基础 URL、模型名称和 API 令牌。
user-model-too-many=你的模型数量已达上限（{0}）。请先删除一个再添加。
user-model-unreachable=无法连接 {0}，未保存任何内容。端点返回：{1}
user-model-probe-timeout=端点在 {0} 秒内没有响应
user-model-added=已保存 {0}，它使用 {1}。你当前仍在使用原来的模型。告诉我即可切换，或发送 /config 打开模型设置。如果某个模型无法使用，发送 /config 也能在不经过我的情况下切回内置模型。
user-model-list-empty=你还没有自己的模型，对话使用内置模型。
user-model-line=- {0}：{1}，位于 {2}{3}
user-model-line-active=- {0}：{1}，位于 {2}{3}（使用中）
# 开头的空格做了转义，properties 加载器才会保留它：这段文字直接接在列表行末尾，只有该模型自己
# 设置了思考强度时才会出现。
user-model-line-effort=\ （思考强度 {0}）
user-model-list=你的模型：\n{0}
user-model-list-on-default=你的对话使用内置模型。你的模型：\n{0}
user-model-unknown=你没有名为 {0} 的模型。现有：{1}。未做任何更改。
user-model-switched=从下一条消息开始，你的对话将使用 {0}。如果它无法使用，发送 /config 即可在不经过我的情况下切回内置模型。
user-model-now=已切换到 {0}。
user-model-now-default=已切换到内置模型。
user-model-status-none=正在使用 {0}。你还没有自己的模型。
user-model-status=正在使用 {0}。可切换到：{1}。要调整自己某个模型的思考强度，发送 /config <名称> <强度>，强度取以下之一：{2}
user-model-deleted=已删除 {0}。
user-model-deleted-active=已删除 {0}，它正在使用中，因此你的对话将改用内置模型。
user-model-bad-effort=无法设置这样的思考强度：{0}。必须是以下之一：{1}。未做任何更改。
user-model-effort-set=已把 {0} 的思考强度设为 {1}，从你的下一条消息开始生效。
user-model-bad-name=不是可用的名称：{0}。请使用字母、数字、点、冒号、下划线或连字符，最多 40 个字符。

# 告诉模型：每个工具都会多出来的这个展示用参数是干什么的。读者是模型，它必须明白两件事：这句话是给人看的，
# 以及工具根本收不到它——否则它会照着工具的口径来写，或者干脆当噪声省掉。
tool-display-description=必填。用主动语态写一句话，说明这一次调用具体做了什么、为什么要做，写给正在旁观 agent 工作的人看。这个参数不会传给工具，也不会影响调用的行为。
