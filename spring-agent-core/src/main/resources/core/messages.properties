# What the agent writes into a conversation itself, as opposed to what the model writes. Read back
# by the model on a later run, so a translation carries the instruction, not only the wording.
questions-asked-heading=I have already put these questions to the user, and they have been presented:
questions-asked-item=- {0}: {1}
questions-asked-footer=Do not ask them again, do not guess an answer, and do not act as if one was given. Stop here and end your turn; you will be started again with their answer if it comes.
# Answers handed back to the model in place of a real one, when core rather than a channel decides
# what became of the ask. Instructions, so a translation has to carry the instruction.
question-already-asked=ALREADY ASKED AND STILL UNANSWERED. You have put this to the user and they have not replied yet. Asking again does nothing. Stop here and end your turn without calling any further tools; you will be started again with their answer if it comes.
question-cannot-ask=COULD NOT ASK. The question could not be shown to the user on any channel, so no answer is coming. Carry on with what you know, and say which assumption you made.
