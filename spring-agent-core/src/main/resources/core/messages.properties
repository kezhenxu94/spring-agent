# Answers handed back to the model in place of a real one, when core rather than a channel decides
# what became of the ask. Instructions, so a translation has to carry the instruction.
question-asked=DONE. Your questions are now in front of the user. Do not ask again and do not guess an answer: stop here and end your turn. You will be started again with their answer if it comes.
question-already-asked=ALREADY ASKED AND STILL UNANSWERED. You have put this to the user and they have not replied yet. Asking again does nothing. Stop here and end your turn without calling any further tools; you will be started again with their answer if it comes.
question-cannot-ask=COULD NOT ASK. The question could not be shown to the user on any channel, so no answer is coming. Carry on with what you know, and say which assumption you made.

# Reported to whoever waits for a run that was dropped rather than started. Read by a person, in the
# terminal or on a card, since no model is running to be told.
run-shutting-down=The agent is shutting down and cannot take new work right now.

# What the subagent tools hand back to the model. Instructions and results, so a translation has to
# carry the instruction. Keep MessageFormat happy: no apostrophes, no stray braces.
subagent-started=Started subagent {0} ({1}). It is working now. Collect its answer with WaitForSubagent({0}) before you finish your turn, or stop it with CancelSubagent({0}) if you no longer need it.
subagent-could-not-start=COULD NOT START the subagent: {0}. Nothing is running and there is no id to wait for. Do the work here instead, or carry on and say that this part is missing.
subagent-too-many={0} subagents are already running, which is as many as you may have at once. Call WaitForSubagent on one of them and use its answer, or cancel one, before starting another.
subagent-shutting-down=COULD NOT START. The agent is shutting down and will not take new subagents. Carry on with what you have and say what you could not look into.
subagent-unknown=No subagent {0} belongs to this turn. Only an id StartSubagent returned to you in this turn can be waited for or cancelled. Check the id, or start the work again.
subagent-answer=Subagent {0} ({1}) finished. What it reported follows; it is all you get from it, and it cannot be asked anything more.
subagent-no-answer=Subagent {0} finished without reporting anything. Nothing came back to use. Either do the work here or start it again with a brief saying plainly what to report.
subagent-failed=Subagent {0} failed: {1}. Nothing came back to use. Decide whether to do the work here, start it again, or carry on and say that this part is missing.
subagent-cancelled=Subagent {0} was stopped before it finished, so there is no answer to read. If it was not you who stopped it, the whole turn is being cancelled: stop here.
subagent-interrupted=The wait for subagent {0} was interrupted, so its answer is not available. Stop here rather than guessing what it would have said.
subagent-still-running=Subagent {0} ({1}) is still working after {2}. Nothing has come back yet. Call WaitForSubagent({0}) again to keep waiting for it, or CancelSubagent({0}) if you have decided you no longer need what it was looking into. Do not finish your turn while it is still running.
subagent-wait-timed-out=Subagent {0} was still running after {1} and has been stopped, so there is no answer to read. That is long past what one is meant to take, so treat the work as not done: either do it here, or carry on and say plainly that this part is missing.
subagent-cancel-requested=Subagent {0} is being stopped. Do not wait for it; it has no answer to give.
subagent-already-finished=Subagent {0} had already finished ({1}), so there was nothing to stop. Read its answer with WaitForSubagent({0}) if you still want it.

# What the model reads when the user says something while it is working: added to the turn as a user
# message of its own, once every tool call of the iteration has been answered, which is where one
# fits into a turn already under way. An instruction, so a translation has to carry the instruction.
# Keep MessageFormat happy: no apostrophes, no stray braces.
queued-message=I sent this while you were working, after the message you are answering:\n{0}\nTake it into account from here on: where it corrects or redirects what you were doing, drop the old course and follow this one, and say briefly that you have. Do not start over on what is already done and still holds.
queued-message-from-another=An administrator ({0}) sent this into your conversation while you were working. It is not from the person you are helping, and they can see it too:\n{1}\nTreat it as an instruction that outranks the course you were on: where it corrects or redirects what you were doing, follow it, and say briefly that an administrator asked for the change. Keep answering the person whose conversation this is, and do not start over on what is already done and still holds.

# The {homeDirs} block of the system prompt: which homes a run reaches and who else can see each.
# Read by the model as part of a prompt an application may have written in another language, hence
# the bundle. Keep MessageFormat happy: no apostrophes, no stray braces.
home-dir=- {0} — {1}. Holds memories/, skills/, workspace/ and artifacts/.
home-dir-own=yours alone, nobody else sees
home-dir-group=shared with everyone in this group chat
home-dir-tenant=shared across the whole company

# The knowledge base tools' results. Read by the model, not by a person, so each one has to say
# what happened AND what to do about it — a bare failure leaves the model to guess, and it guesses
# by retrying the identical call. Keep MessageFormat happy: no apostrophes, no stray braces.
knowledge-scope-own=your own
knowledge-scope-group=shared with this group
knowledge-scope-tenant=shared company-wide
knowledge-chunks={0} chunks
knowledge-empty=The knowledge base is empty. Add something to it with IndexKnowledge.
knowledge-page-empty=No documents at offset {0}. The listing ended before this page.
knowledge-listed=Found {0} document(s):\n\n{1}
knowledge-listed-more=Found {0} document(s):\n\n{1}\nMore remain. Call ListKnowledgeBase again with offset={2} to see them.
knowledge-list-failed=Could not list the knowledge base: {0}
knowledge-indexed=Stored {0} in the {1} knowledge base under id {2}, replacing whatever was stored under that id before.
knowledge-index-failed=Could not store the document: {0}
knowledge-title-required=A title is required. Give the document a short name you would recognise in a listing.
knowledge-source-missing=Nothing to store. Pass the content as text, or a source to read it from.
knowledge-no-group=There is no group here, so there is no group knowledge base to write to. This is a one-to-one chat; use scope own instead.
knowledge-no-tenant=This deployment has no company-wide knowledge base. Use scope own, or group if you are in a group chat.
knowledge-path-invalid=Not a usable path: {0}
knowledge-path-denied=Access denied. The path is outside the workspaces you can reach. Store the content with text instead, or copy the file into your workspace first.
knowledge-query-required=A query is required. Say what to search for in natural language.
knowledge-search-empty=Nothing in the knowledge base matches: {0}. Try different wording, or accept that this is not written down anywhere.
knowledge-search-found=Found {0} passage(s):\n\n{1}
knowledge-search-failed=Could not search the knowledge base: {0}
knowledge-doc-id-required=A document id is required. Get one from ListKnowledgeBase.
knowledge-doc-id-missing=A docId is required, and it is what makes storing the same thing twice update one document instead of leaving two. Use what identifies the content: the token from a Feishu document link (the part after /docx/, /wiki/, /sheets/ or /base/), the URL of a page, the absolute path of a file, the id of the message the user told you this in, or the id of the document you are updating. If nothing about the content identifies it, ask the user what to file it under rather than inventing an id.
knowledge-deleted=Deleted document {0} and all of its chunks from the {1} knowledge base.
knowledge-delete-failed=Could not delete the document: {0}
knowledge-scope-unknown=Not a knowledge base: {0}. Use "own", "group" or "tenant".
knowledge-current-scope-unknown=Say which knowledge base the document is in: "own", "group" or "tenant". ListKnowledgeBase says which one each document is in. A document id is unique inside one knowledge base and not across them, so without it the wrong copy could be acted on: {0}
knowledge-moved=Moved {0} into the {1} knowledge base. Its id, title, origin and content are unchanged.
knowledge-move-not-found=No document with id {0} in the {1} knowledge base. Check the id and which knowledge base it is in with ListKnowledgeBase.
knowledge-move-failed=Could not move the document: {0}
knowledge-owner-required=A user id is required. ListPlaybooks names the owner whose knowledge base each event source is read from.
knowledge-owner-empty=The knowledge base of {0} is empty. Nothing has ever been stored under that identity.
knowledge-owner-listed=Found {0} document(s) in the knowledge base of {1}:\n\n{2}
knowledge-owner-listed-more=Found {0} document(s) in the knowledge base of {1}:\n\n{2}\nMore remain. Call ListOwnerKnowledgeBase again with offset={3} to see them.
knowledge-owner-search-empty=Nothing in the knowledge base of {1} matches: {0}. If this was the playbook query of an event source, its triage runs are being shown nothing.
knowledge-owner-search-found=Found {0} passage(s) in the knowledge base of {1}:\n\n{2}

# What the model is told when a tool returned more than it can be shown. The reader is the model,
# so it has to say what is in the file and how to get at it, not merely that something happened.
# Keep MessageFormat happy: no apostrophes, no stray braces.
tool-result-spilled=The result of {0} was too large ({1} chars) to put in front of you. It has been saved to: {2}\nWhat is in it: {3}\nDo not read it whole — that is the cost you just avoided. Probe it for the part you need: Grep {2} for a pattern, Read {2} with offset and limit for a slice (it is indented, so a slice is readable), and if you have a shell tool, jq or yq or head or wc on {2} to pull out or count exactly one field.\nTo pass it on without copying it through yourself: where a tool parameter says it takes a file reference, give that parameter @file:{2}, or @file:{2}#/pointer/into/the/json to pass only one part of it.

# When an @file: argument reference cannot be honoured. Each one has to say what went wrong and
# what to do instead, because the model gets this back in place of the call it wanted to make.
tool-input-ref-not-accepted=The {0} parameter of {1} does not take a file reference, so @file: was about to be written into it as text. Parameters of this tool that do take one: {2}. Pass the content itself here, or use {3} if you really meant that text literally.
tool-input-ref-not-found=No such file: {0}. It may have been written by a run on another machine, or cleaned up since. Call the tool that produced it again, or list the directory to see what is really there.
tool-input-ref-outside=Not a path a file reference may name: {0}. Only a file inside your home directory can be referenced — a saved tool result, something in the workspace, or anything else kept there — and only by its full path.
tool-input-ref-no-context=A file reference cannot be resolved for this call, because the call carries no identity to resolve it against. Pass the content itself.
tool-input-ref-too-large={0} holds {1} characters, over the {2} a reference may carry. Narrow it with a #/json/pointer, or work on it in pieces.
tool-input-ref-not-text={0} is not text, so there is nothing to put in a tool argument. Only a text or JSON file can be referenced.
tool-input-ref-unreadable=Could not read {0}: {1}
tool-input-ref-not-json={0} is not JSON, so the pointer {1} selects nothing in it. Reference the whole file, without the pointer.
tool-input-ref-bad-pointer=Not a JSON Pointer: {0}. It has to start with a slash, as in /data/items/0.
tool-input-ref-pointer-missing=The pointer {0} selects nothing in {1}. Its top-level keys are: {2}.

# What a firing scheduled task is told when it acts on itself, through FiringScheduledTaskTool.
# Keep MessageFormat happy: no apostrophes, no stray braces.
firing-task-none=This run is not a scheduled task firing, so there is no task to act on here. Use CreateScheduledTask, UpdateScheduledTask or CancelScheduledTask instead.
firing-task-stopped=Stopped this scheduled task ({0}): {1}. It will not fire again.
firing-task-repeats=This task already repeats on the schedule {0}, so it has a next firing already. End it with StopThisScheduledTask instead.
firing-task-bad-next-run=nextRunAt has to be ISO-8601 with an offset, for example 2025-01-15T10:00:00+08:00.
firing-task-next-run-past=nextRunAt has to be in the future.
firing-task-after-expiry=This task expires at {0}, so it cannot be moved to {1}.
firing-task-rearmed=This task ({0}) will fire again at {1}, saying: {2}. It is still the one task, not a second one.

# A user's own chat model: the tools that manage one, and the /model command that is the way back
# to the application's model when the one they chose turns out not to work.
# Keep MessageFormat happy: no apostrophes, no stray braces.
user-model-default-name=the default model
user-model-add-incomplete=A name, a base URL, a model name and an API token are all required.
user-model-too-many=You already have the most models allowed ({0}). Delete one before adding another.
user-model-unreachable=Could not reach {0}, so nothing was saved. The endpoint said: {1}
user-model-probe-timeout=the endpoint did not answer within {0} seconds
user-model-added=Saved {0}, which talks to {1}. You are still on the model you were using. Say the word to switch, or open the model settings by sending /config. If a model ever stops working, /config is also how you get back to the built-in one without my help.
user-model-list-empty=You have no models of your own, so your chats go through the built-in one.
user-model-line=- {0}: {1} at {2}{3}
user-model-line-active=- {0}: {1} at {2}{3} (in use)
# The leading space is escaped so the properties loader keeps it: this is glued onto the end of a
# listing line, and only appears where the model has an effort of its own set.
user-model-line-effort=\ (thinking {0})
user-model-list=Your models:\n{0}
user-model-list-on-default=Your chats go through the built-in model. Your models:\n{0}
user-model-unknown=No model of yours is called {0}. You have: {1}. Nothing was changed.
user-model-switched=Your chats now go through {0}, starting with your next message. If it turns out not to work, send /config to switch back to the built-in model without needing me.
user-model-now=Now using {0}.
user-model-now-default=Now using the built-in model.
user-model-status-none=Using {0}. You have no models of your own.
user-model-status=Using {0}. You can switch to: {1}. To change how hard one of your own models thinks, send /config <name> <effort>, where effort is one of: {2}
user-model-deleted=Deleted {0}.
user-model-deleted-active=Deleted {0}, which was the one in use, so your chats go through the built-in model again.
user-model-bad-effort=Not a reasoning effort I can set: {0}. It has to be one of: {1}. Nothing was changed.
user-model-effort-set=Set {0} to think at {1}, starting with your next message.
user-model-bad-name=Not a usable name: {0}. Use letters, digits, dot, colon, underscore or hyphen, up to 40 characters.

# What the model is told the display parameter every tool is offered is for. The reader is the
# model, and the two things it has to take away are that the sentence is read by a person and that
# the tool never sees it — otherwise it writes for the tool, or leaves it out as noise.
tool-display-description=Required. In active voice, one short sentence saying what this particular call does and why, for the person watching the agent work. It is not passed to the tool and does not affect what the call does.

# What the scheduled-task tools hand back to the model: refusals it has to act on, and confirmations
# it turns into the sentence the user reads. English here is an English answer to a question asked in
# another language, so a translation carries the whole of it. Keep MessageFormat happy in the ones
# taking arguments: no apostrophes, no stray braces.
scheduled-task-both-schedules=Error: give either cronExpression or scheduledAt, not both.
scheduled-task-no-schedule=Error: give cronExpression for a recurring task, or scheduledAt for a one-off.
scheduled-task-bad-expires-at=Error: expiresAt must be ISO-8601 with an offset (for example 2025-12-31T23:59:59+08:00), or "never".
scheduled-task-past-expires-at=Error: expiresAt must be in the future.
scheduled-task-bad-max-runs=Error: maxRuns must be at least 1, or null for a task nothing counts.
scheduled-task-text-too-long=Error: the text of a task is limited to {0} characters.
scheduled-task-no-title=Error: give the task a short title, which is what the user sees it listed as.
scheduled-task-title-too-long=Error: the title of a task is limited to {0} characters. Put the detail in taskText, which is what you are handed when it fires.
scheduled-task-runs-note=It fires {0} times in all.
scheduled-task-never-expires=It never expires.
scheduled-task-expires-at=It expires at {0}.
scheduled-task-background-note=It runs in the background: nothing is posted when it fires, so anything you should see it has to send itself, and only a failure is reported.
scheduled-task-error=Error: {0}
scheduled-task-interval-raised=The interval was raised to the smallest one allowed, {0}.
scheduled-task-created-recurring=Created the recurring task "{0}" ({1}), id {2}. {3} Change it later with UpdateScheduledTask and that id, or cancel it with CancelScheduledTask.
scheduled-task-bad-scheduled-at=Error: scheduledAt must be ISO-8601 with an offset (for example 2025-01-15T10:00:00+08:00).
scheduled-task-past-scheduled-at=Error: scheduledAt must be in the future.
scheduled-task-created-once=Created the one-off task "{0}", firing at {1}, id {2}. {3} Change it later with UpdateScheduledTask and that id, or cancel it with CancelScheduledTask.
scheduled-task-none=You have no active scheduled tasks.
scheduled-task-unknown=Error: no task with id {0}.
scheduled-task-not-yours-change=Error: you can only change tasks you created yourself.
scheduled-task-not-active=Error: task {0} is {1} and can no longer be changed. Create a new one instead.
scheduled-task-updated=Updated task {0}: {1}.{2}
scheduled-task-not-yours-cancel=Error: you can only cancel tasks you created yourself.
scheduled-task-already=Task {0} is already {1}.
scheduled-task-cancelled=Cancelled task {0}.

# What an edit to a scheduled task says it changed, and why it was refused. Read by the model as a
# tool result and by a person in the browser, which is why they are sentences rather than codes.
# Keep MessageFormat happy in the ones taking arguments: no apostrophes, no stray braces.
scheduled-task-edit-nothing=nothing to change. Give title, taskText, cronExpression, scheduledAt, expiresAt, background or maxRuns.
scheduled-task-edit-both-schedules=give either cronExpression or scheduledAt, not both.
scheduled-task-edit-no-title=a task needs a name.
scheduled-task-edit-title-too-long=the title of a task is limited to {0} characters. Put the detail in its prompt, which is what the agent reads.
scheduled-task-edit-no-text=a task needs something to do.
scheduled-task-edit-text-too-long=the text of a task is limited to {0} characters.
scheduled-task-edit-bad-max-runs=maxRuns must be at least 1, or {0} for a task nothing counts.
scheduled-task-edit-bad-time={0} must be ISO-8601 with an offset (for example 2025-01-15T10:00:00+08:00).
scheduled-task-edit-past-time={0} must be in the future.
scheduled-task-edit-renamed=it is now called "{0}"
scheduled-task-edit-retexted=it now says "{0}"
scheduled-task-edit-cron=it now runs on {0}
scheduled-task-edit-once=it now fires once, at {0}
scheduled-task-edit-no-expiry=it no longer expires
scheduled-task-edit-expires=it expires at {0}
scheduled-task-edit-background=it now runs in the background
scheduled-task-edit-foreground=it now replies in its thread
scheduled-task-edit-unlimited=it now fires until it expires or is cancelled
scheduled-task-edit-max-runs=it fires {0} times in all

# What the publishing tools hand back to the model. A link and its expiry are the whole of what the
# user is told, so the sentence the model writes comes from this one. Keep MessageFormat happy in the
# ones taking arguments: no apostrophes, no stray braces.
publish-error=Error: {0}
publish-bad-visibility=Error: visibility must be internal or public.
publish-failed=Error: publishing failed, try again shortly.
publish-never-expires=The link never expires.
publish-expires-at=The link expires at {0}.
publish-published=Published at {0}. {1}
publish-no-token=Error: give a token.
publish-unknown-token=Error: nothing is published under {0}.
publish-not-yours-update=Error: you can only update content you published yourself.
publish-bad-mode=Error: mode must be update or replace.
publish-kind-mismatch=Error: with mode=update the new content must be the same kind, file or directory, as what is published. Use mode=replace to change kind.
publish-update-failed=Error: the update failed, try again shortly.
publish-updated=Updated, still at {0}. {1}
publish-not-yours-unpublish=Error: you can only unpublish content you published yourself.
publish-unpublished=Unpublished {0}.
publish-not-yours-extend=Error: you can only extend content you published yourself.
publish-extended=Extended {0}. {1}
publish-no-path=Give a file or directory path.
publish-bad-path=Invalid path: {0}
publish-no-such-path=No such file or directory: {0}
publish-unresolvable-path=Could not resolve the path: {0}
publish-public-ttl-range=A public ttl must be above 0 and at most 30d.
publish-ttl-positive=ttl must be above 0.
publish-bad-ttl=Invalid ttl: use a duration such as 30s, 10m, 2h or 1d.

# What the skill tools hand back to the model. Keep MessageFormat happy in the ones taking
# arguments: no apostrophes, no stray braces.
skill-access-denied=Error: Access denied. Path is outside the allowed skill directories.
skill-no-directory=Error: failed to resolve skills directory: {0}
skill-none=No skills installed.
skill-found=Found {0} skill(s):\n\n{1}
skill-no-parent-dirs=Error: Failed to create parent directories for: {0}
skill-write-failed=Error writing file: {0}
skill-file-created=Successfully created file: {0} ({1} bytes)
skill-file-overwritten=Successfully overwrote file: {0} ({1} bytes)
skill-folder-missing=Error: Skill folder does not exist: {0}
skill-not-a-directory=Error: Path is not a directory: {0}
skill-not-a-skill=Error: Not a skill folder (no SKILL.md found): {0}
skill-delete-failed=Error deleting skill: {0}
skill-deleted=Successfully deleted skill: {0}
skill-file-missing=Error: File does not exist: {0}
skill-file-is-directory=Error: Path is a directory; use DeleteSkill instead: {0}
skill-file-delete-failed=Error: Failed to delete file: {0}
skill-file-deleted=Successfully deleted file: {0}

# What the MCP server tools hand back to the model. Keep MessageFormat happy in the ones taking
# arguments: no apostrophes, no stray braces.
mcp-no-name=Error: a non-empty server name is required.
mcp-no-url=Error: a server URL is required.
mcp-error=Error: {0}
mcp-unreachable=Error: could not connect to MCP server "{0}": {1}
mcp-save-failed=Error: failed to save MCP server "{0}": {1}
mcp-prefix-taken=Error: the tool prefix "{0}" is already taken by MCP server "{1}", which you can also reach. Pick another prefix.
mcp-registered=Successfully registered MCP server "{0}" ({1}). Available tools: {2}
mcp-no-tools=(none)
mcp-none=No MCP servers registered or shared with you.
mcp-owned-by-you=Owned by you:
mcp-shared-with-you=Shared with you:
mcp-configured-here=Configured by this application, for everyone:
mcp-shared-with=(shared with: {0})
mcp-shared-by=shared by
mcp-disabled=(disabled)
mcp-no-server-name=Error: a server name is required.
mcp-no-target=Error: a target open_id or chat_id is required.
mcp-not-yours-share=Error: no MCP server named "{0}" is registered to you. Only servers you own can be shared.
mcp-already-shared="{0}" is already shared with {1}.
mcp-share-done=Successfully shared "{0}" with {1}.
mcp-not-yours-unshare=Error: no MCP server named "{0}" is registered to you. Only servers you own can be unshared.
mcp-not-shared="{0}" was not shared with {1}.
mcp-unshare-done=Successfully revoked access to "{0}" from {1}.
mcp-unknown=Error: no MCP server named "{0}" is registered.
mcp-removed=Successfully removed MCP server "{0}".
mcp-not-yours-to-manage=Error: "{0}" is configured by this application, not registered by you. It is already available to everyone here and cannot be {1} through these tools.
mcp-verb-shared=shared
mcp-verb-unshared=unshared
mcp-verb-removed=removed

# What the credential tools hand back to the model. Keep MessageFormat happy in the ones taking
# arguments: no apostrophes, no stray braces.
credential-no-user=Error: credential store unavailable: no userId in tool context
credential-bad-name=Error: invalid credential name. Must match ^[A-Za-z_][A-Za-z0-9_]{0,63}$
credential-no-value=Error: value must not be null
credential-value-too-large=Error: value too large ({0} bytes, max {1})
credential-stored=Credential {0} stored. Run {1} to expose it as ${0}.
credential-store-failed=Error storing credential: {0}
credential-none=No credentials stored.
credential-listing=Credentials:
credential-unknown-time=unknown
credential-list-failed=Error listing credentials: {0}
credential-not-found=Credential {0} not found (nothing to delete).
credential-removed=Credential {0} removed. Run {1} to drop ${0} from the sandbox.
credential-delete-failed=Error deleting credential: {0}

# What the vision and subagent tools refuse with. Instructions as much as reports, so a translation
# has to carry the instruction.
vision-no-image=Error: give at least one image.
vision-unreadable=Error: none of the images could be read. Check the paths and URLs; a local path has to be one this run can reach.
subagent-no-prompt=Error: prompt is required, and has to say the whole task.

# What the model reads in place of a call to a tool the tool search did not offer this iteration.
# The way out is the point, not the refusal: told only that the tool is unavailable, the model
# abandons the step it was in the middle of. Keep MessageFormat happy: no apostrophes, no braces.
tool-not-offered=Tool "{0}" was not offered to this call, so it did not run. Call toolSearchTool with a query naming "{0}" to make it available again, then call "{0}" once more.

# What the model reads in place of a call whose arguments would not parse. Nearly always a call it
# did not finish writing — a provider that runs out of output tokens mid-call delivers the arguments
# it had got to — so the advice is to write the call again, and the field a length cut-off lands in
# is named: _display_description is asked for last, and it is the runtime's own. Keep MessageFormat
# happy: no apostrophes, no stray braces.
tool-arguments-malformed=The arguments of "{0}" could not be read as JSON, so the call did not run: {1}. Most often that means the call was cut off before you finished writing it. Call "{0}" again with the whole arguments object, and keep _display_description to one short sentence so there is room for the arguments that matter.

# The one-line shape of a tool result too large to hand back whole, written into the note that tells
# the model where the file is. Prose rather than a schema, so it is read in the workspace's language
# like the note around it. Keep MessageFormat happy: no apostrophes, no stray braces.
large-response-text-lines=text, {0} line(s)
large-response-items=[{0} items]
large-response-items-each=[{0} items, each {1}]
large-response-keys='{'{0} keys'}'
large-response-more-keys=, and {0} more keys
