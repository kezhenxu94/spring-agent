# Answers handed back to the model in place of a real one, when core rather than a channel decides
# what became of the ask. Instructions, so a translation has to carry the instruction.
question-asked=DONE. Your questions are now in front of the user. Do not ask again and do not guess an answer: stop here and end your turn. You will be started again with their answer if it comes.
question-already-asked=ALREADY ASKED AND STILL UNANSWERED. You have put this to the user and they have not replied yet. Asking again does nothing. Stop here and end your turn without calling any further tools; you will be started again with their answer if it comes.
question-cannot-ask=COULD NOT ASK. The question could not be shown to the user on any channel, so no answer is coming. Carry on with what you know, and say which assumption you made.

# Reported to whoever waits for a run that was dropped rather than started. Read by a person, in the
# terminal or on a card, since no model is running to be told.
run-shutting-down=The agent is shutting down and cannot take new work right now.

# What the subagent tools hand back to the model. Instructions and results, so a translation has to
# carry the instruction. Keep MessageFormat happy: no apostrophes, no stray braces.
subagent-started=Started subagent {0} ({1}). It is working now. Collect its answer with WaitForSubagent({0}) before you finish your turn, or stop it with CancelSubagent({0}) if you no longer need it.
subagent-could-not-start=COULD NOT START the subagent: {0}. Nothing is running and there is no id to wait for. Do the work here instead, or carry on and say that this part is missing.
subagent-too-many={0} subagents are already running, which is as many as you may have at once. Call WaitForSubagent on one of them and use its answer, or cancel one, before starting another.
subagent-shutting-down=COULD NOT START. The agent is shutting down and will not take new subagents. Carry on with what you have and say what you could not look into.
subagent-unknown=No subagent {0} belongs to this turn. Only an id StartSubagent returned to you in this turn can be waited for or cancelled. Check the id, or start the work again.
subagent-answer=Subagent {0} ({1}) finished. What it reported follows; it is all you get from it, and it cannot be asked anything more.
subagent-no-answer=Subagent {0} finished without reporting anything. Nothing came back to use. Either do the work here or start it again with a brief saying plainly what to report.
subagent-failed=Subagent {0} failed: {1}. Nothing came back to use. Decide whether to do the work here, start it again, or carry on and say that this part is missing.
subagent-cancelled=Subagent {0} was stopped before it finished, so there is no answer to read. If it was not you who stopped it, the whole turn is being cancelled: stop here.
subagent-interrupted=The wait for subagent {0} was interrupted, so its answer is not available. Stop here rather than guessing what it would have said.
subagent-still-running=Subagent {0} ({1}) is still working after {2}. Nothing has come back yet. Call WaitForSubagent({0}) again to keep waiting for it, or CancelSubagent({0}) if you have decided you no longer need what it was looking into. Do not finish your turn while it is still running.
subagent-wait-timed-out=Subagent {0} was still running after {1} and has been stopped, so there is no answer to read. That is long past what one is meant to take, so treat the work as not done: either do it here, or carry on and say plainly that this part is missing.
subagent-cancel-requested=Subagent {0} is being stopped. Do not wait for it; it has no answer to give.
subagent-already-finished=Subagent {0} had already finished ({1}), so there was nothing to stop. Read its answer with WaitForSubagent({0}) if you still want it.

# What the model reads when the user says something while it is working: added to the turn as a user
# message of its own, once every tool call of the iteration has been answered, which is where one
# fits into a turn already under way. An instruction, so a translation has to carry the instruction.
# Keep MessageFormat happy: no apostrophes, no stray braces.
queued-message=I sent this while you were working, after the message you are answering:\n{0}\nTake it into account from here on: where it corrects or redirects what you were doing, drop the old course and follow this one, and say briefly that you have. Do not start over on what is already done and still holds.

# The {homeDirs} block of the system prompt: which homes a run reaches and who else can see each.
# Read by the model as part of a prompt an application may have written in another language, hence
# the bundle. Keep MessageFormat happy: no apostrophes, no stray braces.
home-dir=- {0} — {1}. Holds memories/, skills/, workspace/ and artifacts/.
home-dir-own=yours alone, nobody else sees
home-dir-group=shared with everyone in this group chat
home-dir-tenant=shared across the whole company

# The knowledge base tools' results. Read by the model, not by a person, so each one has to say
# what happened AND what to do about it — a bare failure leaves the model to guess, and it guesses
# by retrying the identical call. Keep MessageFormat happy: no apostrophes, no stray braces.
knowledge-scope-own=your own
knowledge-scope-group=shared with this group
knowledge-scope-tenant=shared company-wide
knowledge-chunks={0} chunks
knowledge-empty=The knowledge base is empty. Add something to it with IndexKnowledge.
knowledge-page-empty=No documents at offset {0}. The listing ended before this page.
knowledge-listed=Found {0} document(s):\n\n{1}
knowledge-listed-more=Found {0} document(s):\n\n{1}\nMore remain. Call ListKnowledgeBase again with offset={2} to see them.
knowledge-list-failed=Could not list the knowledge base: {0}
knowledge-indexed=Stored {0} in the {1} knowledge base. Document id: {2}
knowledge-index-failed=Could not store the document: {0}
knowledge-title-required=A title is required. Give the document a short name you would recognise in a listing.
knowledge-source-missing=Nothing to store. Pass the content as text, or a source to read it from.
knowledge-no-group=There is no group here, so there is no group knowledge base to write to. This is a one-to-one chat; use scope own instead.
knowledge-no-tenant=This deployment has no company-wide knowledge base. Use scope own, or group if you are in a group chat.
knowledge-path-invalid=Not a usable path: {0}
knowledge-path-denied=Access denied. The path is outside the workspaces you can reach. Store the content with text instead, or copy the file into your workspace first.
knowledge-query-required=A query is required. Say what to search for in natural language.
knowledge-search-empty=Nothing in the knowledge base matches: {0}. Try different wording, or accept that this is not written down anywhere.
knowledge-search-found=Found {0} passage(s):\n\n{1}
knowledge-search-failed=Could not search the knowledge base: {0}
knowledge-doc-id-required=A document id is required. Get one from ListKnowledgeBase.
knowledge-deleted=Deleted document {0} and all of its chunks.
knowledge-delete-failed=Could not delete the document: {0}
knowledge-updated=Updated {0} in the {1} knowledge base, replacing its previous content. Document id: {2}
