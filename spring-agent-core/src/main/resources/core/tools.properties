# What each parameter of each tool tells the model it is for, keyed <ToolName>.<parameterName>.
#
# Overrides, not a bundle: the English is the @ToolParam annotation's own text and stays there, so a
# key absent here means "keep what the tool declares". Nothing is ever required, which is what lets a
# language be translated one tool at a time and leaves the tools this module cannot name — every tool
# of every MCP server a user has registered — exactly as they came.
#
# That is also why there is no key-parity test over these files, unlike core/messages: a partial
# translation is a supported state, not a gap. What is tested is the other direction, that every key
# still names a tool and a parameter that exist, so a renamed tool cannot leave a translation behind
# that silently stops applying.
#
# This base file is for a correction to English text this module cannot edit — a description that
# lives in a dependency's jar — since every locale inherits what it does not override. Translations go
# in core/tools_<lang>.properties, or core/tools_<lang>_<COUNTRY>.properties for one that needs it.
#
# A tool's own description is a file rather than a key here: core/prompts/tools/<ToolName>.md, and its
# per-locale siblings. Those run to paragraphs, and a paragraph folded into a properties value is
# neither writable nor reviewable.
#
# Values are read as UTF-8, so a translation is written as itself and needs no escaping. Nothing
# formats these, so braces and apostrophes are literal.
