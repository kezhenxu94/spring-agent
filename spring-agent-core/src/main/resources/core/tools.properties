# What each parameter of each tool tells the model it is for, keyed <ToolName>.<parameterName>.
#
# Overrides, not a bundle: the English is the @ToolParam annotation's own text and stays there, so a
# key absent here means "keep what the tool declares". Nothing is ever required, which is what lets a
# language be translated one tool at a time and leaves the tools this module cannot name — every tool
# of every MCP server a user has registered — exactly as they came.
#
# That is also why there is no key-parity test over these files, unlike core/messages: a partial
# translation is a supported state, not a gap. What is tested is the other direction, that every key
# still names a tool and a parameter that exist, so a renamed tool cannot leave a translation behind
# that silently stops applying.
#
# This base file is for a correction to English text this module cannot edit — a description that
# lives in a dependency's jar — since every locale inherits what it does not override. Translations go
# in core/tools_<lang>.properties, or core/tools_<lang>_<COUNTRY>.properties for one that needs it.
#
# A tool's own description is a file rather than a key here: core/prompts/tools/<ToolName>.md, and its
# per-locale siblings. Those run to paragraphs, and a paragraph folded into a properties value is
# neither writable nor reviewable.
#
# Values are read as UTF-8, so a translation is written as itself and needs no escaping. Nothing
# formats these, so braces and apostrophes are literal.

# ── Corrections to spring-ai-agent-utils' own English, which lives in a jar and cannot be edited
# where it is written. Every locale inherits these, so a translation that says the same thing as the
# English it replaces stays true when the English below changes.
#
# Glob, Grep and ListDirectory all describe their `path` as defaulting to "the current working
# directory". Here it does not: AgentToolsProvider builds each of them with the requester's own home
# as its working directory and confines all three to the homes this run reaches, so the process's
# own directory is both the wrong answer and one the confinement check would refuse.
Glob.path=The directory to search in. Omit the field entirely to search your own home directory — do not pass "null" or "undefined" as its value, which is a directory of that name and finds nothing. Where it is given it must be a directory you can reach.
Grep.path=A file or a directory to search in. Omit it to search your own home directory. Must be a path you can reach.
ListDirectory.path=Absolute path of the directory to list. Omit it to list your own home directory.
# And Grep names its own parameters as another agent spells them — output_mode, -A/-B/-C, -n,
# head_limit — none of which is what this tool's schema calls them. A model reading that has to
# guess at the mapping, and a guess it gets wrong reads as the parameter having been ignored.
Grep.outputMode=What to return: "content" for the matching lines, "files_with_matches" for the paths alone (the default), "count" for a count per file.
Grep.contextBefore=How many lines to show before each match. Only with outputMode "content".
Grep.contextAfter=How many lines to show after each match. Only with outputMode "content".
Grep.context=How many lines to show on both sides of each match. Only with outputMode "content".
Grep.showLineNumbers=Whether to number the lines. Only with outputMode "content"; defaults to true.
Grep.headLimit=Return at most this many lines, paths or counts, whichever the output mode produces. 0, the default, is unlimited.
