Bash.command=要执行的命令
Bash.timeout=可选的超时时间，单位毫秒（最大 600000）
Bash.description=用主动语态、5 到 10 个词说清这条命令做什么。例如：\n输入：ls\n输出：列出当前目录下的文件\n\n输入：git status\n输出：查看工作区状态\n\n输入：npm install\n输出：安装依赖包\n\n输入：mkdir foo\n输出：创建 foo 目录
Bash.runInBackground=设为 true 可让这条命令在后台运行。之后用 BashOutput 读取它的输出。
BashOutput.bash_id=要取回输出的那个后台 shell 的 ID
BashOutput.filter=可选的正则表达式，用来过滤输出的行。只有匹配这个正则的行会出现在结果里，不匹配的行之后也不再能读到。
KillShell.bash_id=要终止的那个后台 shell 的 ID
