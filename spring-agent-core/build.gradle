plugins {
  id 'springagent.java-library-conventions'
  id 'springagent.classpath-isolation'
}

description = 'The backend-agnostic agent runtime: one entry point for running the agent, tool composition, system prompt rendering and the persistence contracts.'

dependencies {
  // api: types that appear in signatures integration modules compile against.
  api 'org.springframework.boot:spring-boot-starter'
  // No persistence backend is a dependency of this module. The domain models in dao/models carry
  // the mapping annotations of all of them, so all of them have to be here to *compile* — but an
  // annotation whose type is absent at runtime is discarded when the class is reflected over, which
  // is what makes one model serve every backend and what makes compileOnly correct rather than
  // merely convenient. A consumer adds one spring-agent-persistence-* module and resolves nothing
  // belonging to the others.
  //
  // This is the whole point of the split: promoting any of these back to api or implementation puts
  // Hibernate on every MongoDB deployment, or the Mongo driver on every JPA one. The
  // checkRuntimeClasspathIsolation task below is what catches that happening by accident.
  compileOnly 'jakarta.persistence:jakarta.persistence-api'
  compileOnly 'org.springframework.data:spring-data-mongodb'
  compileOnly 'org.springframework.data:spring-data-redis'
  compileOnly 'org.springframework.data:spring-data-commons'
  api 'org.springframework.ai:spring-ai-starter-model-openai'
  api libs.spring.ai.agent.utils

  implementation 'org.springframework.boot:spring-boot-starter-webmvc'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-restclient'
  // Chat memory follows app.persistence.type, so its two implementations live in the two
  // spring-agent-persistence-* modules alongside the repositories they share a database with.
  implementation 'org.springframework.ai:spring-ai-starter-mcp-client'
  implementation 'org.springframework.ai:spring-ai-starter-tool-search-advisor'
  // api: SimpleVectorStore and VectorStore appear in VectorStoreConfiguration's bean signatures,
  // and consumers inject them. Cheap to carry — its only transitive is spring-ai-model, which the
  // OpenAI starter above already brings.
  //
  // Only the simple store lives here. Milvus is not a dependency of this module: its starter drags
  // in milvus-sdk-java, grpc, protobuf, okhttp and kotlin-stdlib, which is a large price for every
  // consumer to pay for a store most of them do not run. A deployment that wants it declares
  // org.springframework.ai:spring-ai-starter-vector-store-milvus itself and sets
  // spring.ai.vectorstore.type=milvus; Spring AI's own auto-configuration takes it from there.
  api 'org.springframework.ai:spring-ai-vector-store'
  // Spring AI's modular RAG: DocumentRetriever appears in the KnowledgeBase contract that the
  // spring-agent-rag-* modules implement, and RetrievalAugmentationAdvisor is what attaches
  // retrieval to a run. api rather than implementation for the first of those reasons.
  //
  // It reaches no configuration transitively — nothing else in Spring AI depends on it — so it has
  // to be named here. Its own dependencies are spring-ai-client-chat and spring-ai-vector-store,
  // both already present, so this adds no third-party weight and nothing for the isolation check
  // below to catch. Storage stays out of core: the module holding Milvus and Tika is the one that
  // implements the contract.
  api 'org.springframework.ai:spring-ai-rag'

  implementation libs.guava
  implementation libs.jakarta.annotation.api
  implementation libs.bundles.logback.json

  // Raw coordinates rather than the sibling projects, which would be a dependency cycle. These are
  // here only so PersistenceAutoConfigurationFilterTest can assert the auto-configuration class
  // names it filters still exist. testImplementation does not reach runtimeClasspath, so the
  // isolation assertion below is unaffected.
  testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  testImplementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
  testImplementation 'org.springframework.boot:spring-boot-starter-data-redis'
  testImplementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-jdbc'
  testImplementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-mongodb'
  testImplementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-redis'

  // MockWebServer stands in for the model endpoint in OpenAiErrorBodyTest, which asserts what a
  // rejected request leaves behind. okhttp itself is already on the runtime classpath, under
  // Spring AI's OpenAI client; this adds only the test server. Test-only, so the
  // checkRuntimeClasspathIsolation assertion below is unaffected for the same reason as above.
  testImplementation libs.okhttp.mockwebserver
}

// Core is backend-agnostic and must stay that way: it is the module every consumer takes, whichever
// database, vector store and shell they run.
forbidOnRuntimeClasspath(
    groups: [
      'org.hibernate.orm',
      'org.mongodb',
      'io.milvus',
      'com.zaxxer',
      'org.xerial',
      'io.fabric8',
      'org.testcontainers',
      'redis.clients',
      'io.lettuce',
    ],
    modules: [
      'spring-data-jpa',
      'spring-data-mongodb',
      'spring-data-redis',
      'spring-jdbc',
      'spring-orm',
      'spring-boot-jdbc',
      'spring-boot-data-redis',
      'spring-boot-starter-data-jpa',
      'spring-boot-starter-data-mongodb',
      'spring-boot-starter-data-redis',
      'spring-ai-model-chat-memory-repository-jdbc',
      'spring-ai-model-chat-memory-repository-mongodb',
      'spring-ai-model-chat-memory-repository-redis',
      'spring-ai-milvus-store',
    ])
