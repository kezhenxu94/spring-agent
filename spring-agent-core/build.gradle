plugins {
  id 'springagent.java-library-conventions'
  id 'springagent.classpath-isolation'
  // The i18n checks every module has to make of its own tools live in src/testFixtures, so that a
  // module gets them by subclassing rather than by copying two hundred lines of reflection into its
  // own test source — which is how the first two modules ended up with the same inventory twice.
  id 'java-test-fixtures'
}

// The fixtures are for this repository's own modules and are not part of what is published. Left
// alone they would add -test-fixtures artifacts to the Maven publication and to the Central
// deployment, which is a second thing to version and support for no consumer that asked for it.
afterEvaluate {
  components.java.withVariantsFromConfiguration(configurations.testFixturesApiElements) { skip() }
  components.java.withVariantsFromConfiguration(configurations.testFixturesRuntimeElements) { skip() }
}

description = 'The backend-agnostic agent runtime: one entry point for running the agent, tool composition, system prompt rendering and the persistence contracts.'

dependencies {
  // The fixtures assert with JUnit and AssertJ, and reflect over a module's tool classes with
  // Spring's own metadata reader, which the starter already brings.
  testFixturesImplementation 'org.springframework.boot:spring-boot-starter-test'

  // api: types that appear in signatures integration modules compile against.
  api 'org.springframework.boot:spring-boot-starter'
  // No persistence backend is a dependency of this module. The domain models in dao/models carry
  // the mapping annotations of all of them, so all of them have to be here to *compile* — but an
  // annotation whose type is absent at runtime is discarded when the class is reflected over, which
  // is what makes one model serve every backend and what makes compileOnly correct rather than
  // merely convenient. A consumer adds one spring-agent-persistence-* module and resolves nothing
  // belonging to the others.
  //
  // This is the whole point of the split: promoting any of these back to api or implementation puts
  // Hibernate on every MongoDB deployment, or the Mongo driver on every JPA one. The
  // checkRuntimeClasspathIsolation task below is what catches that happening by accident.
  compileOnly 'jakarta.persistence:jakarta.persistence-api'
  compileOnly 'org.springframework.data:spring-data-mongodb'
  compileOnly 'org.springframework.data:spring-data-redis'
  compileOnly 'org.springframework.data:spring-data-commons'
  // The model and client APIs, and no provider. Which endpoint serves a run is a
  // spring-agent-provider-* module's business — this module names ChatClient, ChatModel,
  // EmbeddingModel, ImageModel and TranscriptionModel and nothing that implements one of them,
  // which is what lets a consumer choose. See ModelToolsConfiguration for how the tools that need
  // one of those models are registered only where a provider published it.
  //
  // Both arrive transitively under any provider's starter, and are named here anyway: this module
  // compiles against them, and a transitive that happens to be there today is not a compile
  // dependency. api rather than implementation because they appear in the bean and SPI signatures
  // every provider and integration module compiles against.
  api 'org.springframework.ai:spring-ai-client-chat'
  api 'org.springframework.ai:spring-ai-model'
  // Two of Spring AI's auto-configuration modules, named for what this module reads out of them
  // rather than for the beans they contribute. Both used to arrive under the OpenAI starter, which
  // is a provider's dependency now and may not be the provider a consumer chose.
  //
  // model-tool: ToolCallingProperties, because core replaces the ToolCallingManager and so has to
  // read the same spring.ai.tools.limits.* a deployment sets.
  //
  // model-chat-client: not referenced by name anywhere here, and still required. Spring AI's
  // ToolSearchAdvisorAutoConfiguration — which ToolSearchIndexConfiguration orders itself before —
  // declares `before = ChatClientAutoConfiguration.class` as a *class literal*, so that class has
  // to be loadable for the annotation to be read at all. Without it the tool index quietly does not
  // exist: no error, no bean, and searches that find nothing. ToolSearchIndexConfigurationTest is
  // what notices.
  implementation 'org.springframework.ai:spring-ai-autoconfigure-model-tool'
  implementation 'org.springframework.ai:spring-ai-autoconfigure-model-chat-client'
  api libs.spring.ai.agent.utils

  implementation 'org.springframework.boot:spring-boot-starter-webmvc'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-restclient'
  // Chat memory follows app.persistence.type, so its two implementations live in the two
  // spring-agent-persistence-* modules alongside the repositories they share a database with.
  implementation 'org.springframework.ai:spring-ai-starter-mcp-client'
  implementation 'org.springframework.ai:spring-ai-starter-tool-search-advisor'
  // api: SimpleVectorStore and VectorStore appear in VectorStoreConfiguration's bean signatures,
  // and consumers inject them. Cheap to carry — its only transitive is spring-ai-model, which the
  // OpenAI starter above already brings.
  //
  // Only the simple store lives here. Milvus is not a dependency of this module: its starter drags
  // in milvus-sdk-java, grpc, protobuf, okhttp and kotlin-stdlib, which is a large price for every
  // consumer to pay for a store most of them do not run. A deployment that wants it declares
  // org.springframework.ai:spring-ai-starter-vector-store-milvus itself and sets
  // spring.ai.vectorstore.type=milvus; Spring AI's own auto-configuration takes it from there.
  api 'org.springframework.ai:spring-ai-vector-store'
  // Spring AI's modular RAG: DocumentRetriever appears in the KnowledgeBase contract that the
  // spring-agent-rag-* modules implement, and RetrievalAugmentationAdvisor is what attaches
  // retrieval to a run. api rather than implementation for the first of those reasons.
  //
  // It reaches no configuration transitively — nothing else in Spring AI depends on it — so it has
  // to be named here. Its own dependencies are spring-ai-client-chat and spring-ai-vector-store,
  // both already present, so this adds no third-party weight and nothing for the isolation check
  // below to catch. Storage stays out of core: the module holding Milvus and Tika is the one that
  // implements the contract.
  api 'org.springframework.ai:spring-ai-rag'

  implementation libs.guava
  implementation libs.jakarta.annotation.api
  implementation libs.bundles.logback.json
  // What Reactor carries a run's MDC across its thread boundaries with — see
  // me.kezhenxu94.springagent.core.logging.MdcThreadLocalAccessor. Named here rather than left to
  // arrive under spring-ai-commons: this module compiles against its ThreadLocalAccessor, and a
  // transitive that happens to be there today is not a compile dependency. BOM-managed, so no
  // version. Nothing new on the runtime classpath, and nothing the isolation check cares about.
  implementation 'io.micrometer:context-propagation'

  // Raw coordinates rather than the sibling projects, which would be a dependency cycle. These are
  // here only so PersistenceAutoConfigurationFilterTest can assert the auto-configuration class
  // names it filters still exist. testImplementation does not reach runtimeClasspath, so the
  // isolation assertion below is unaffected.
  testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  testImplementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
  testImplementation 'org.springframework.boot:spring-boot-starter-data-redis'
  testImplementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-jdbc'
  testImplementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-mongodb'
  testImplementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-redis'

  // No model provider here, not even for tests, and that is worth stating: core's tests build the
  // ChatClient they need from a stub ChatModel, so nothing in this module — main or test — names an
  // endpoint's wire protocol. A provider appearing on this line is the first sign that something
  // did.
}

// SubagentSchedulerStarvationTest gets a JVM to itself, and this is the whole reason the task
// exists: it replaces Reactor's *global* scheduler factory with a one-thread boundedElastic, which
// is the only way to turn the starvation it is about from "sometimes" into "every time" (see the
// class's own javadoc for why the pool size cannot be set any other way).
//
// A global that another test class in the same JVM can be affected by, or can affect. Gradle hands
// each fork a share of the classes and a run whose stream is still alive when this class starts
// will reach for Schedulers.boundedElastic() and be handed *this* one-thread pool, pinning the
// single executor the test needs — and the run under test then waits for a thread that never comes
// free, which is exactly the deadlock the class asserts does not happen. It fails as "the subagent
// never ran".
//
// Nothing about that is deterministic: it depends on which classes share the fork, so it survived
// unnoticed until a change to the set of test classes in this module reshuffled them. Isolating the
// class is the fix rather than a retry, because a retry reuses the same fork and fails again.
tasks.register('schedulerIsolationTest', Test) {
  description = 'Runs the tests that replace a global Reactor scheduler, alone in their own JVM.'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnitPlatform()
  include '**/SubagentSchedulerStarvationTest.class'
  // One fork, and no sharing: the point of the task.
  maxParallelForks = 1
}

tasks.named('test') {
  // Excluded here rather than left to run twice: the task above is the only place it is correct.
  exclude '**/SubagentSchedulerStarvationTest.class'
}

tasks.named('check') {
  dependsOn 'schedulerIsolationTest'
}

// Core is backend-agnostic and must stay that way: it is the module every consumer takes, whichever
// database, vector store, shell and *model provider* they run.
//
// The openai entries are the least obvious of them. An `api` dependency on a provider's starter
// makes every consumer resolve that provider's SDK whether or not it is the one they chose, and
// nothing else in the build would say so — the symptom is weight, not a failure. A provider's
// classes reaching this module means a signature or an import went in that only one provider can
// satisfy; the fix is at that signature, not here.
forbidOnRuntimeClasspath(
    groups: [
      'org.hibernate.orm',
      'org.mongodb',
      'io.milvus',
      'com.zaxxer',
      'org.xerial',
      'io.fabric8',
      'org.testcontainers',
      'redis.clients',
      'io.lettuce',
      'com.openai',
    ],
    modules: [
      'spring-data-jpa',
      'spring-data-mongodb',
      'spring-data-redis',
      'spring-jdbc',
      'spring-orm',
      'spring-boot-jdbc',
      'spring-boot-data-redis',
      'spring-boot-starter-data-jpa',
      'spring-boot-starter-data-mongodb',
      'spring-boot-starter-data-redis',
      'spring-ai-model-chat-memory-repository-jdbc',
      'spring-ai-model-chat-memory-repository-mongodb',
      'spring-ai-model-chat-memory-repository-redis',
      'spring-ai-milvus-store',
      'spring-ai-openai',
      'spring-ai-autoconfigure-model-openai',
      'spring-ai-starter-model-openai',
    ])
