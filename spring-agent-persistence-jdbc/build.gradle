plugins {
  id 'springagent.java-library-conventions'
  id 'springagent.classpath-isolation'
}

// One of the two backends a consumer of spring-agent-core picks between. It owns the whole JDBC
// story: the JPA repository implementations, the chat memory repository, the SQLite driver and the
// Hibernate dialect that reads it, and the native-image hints for all of them. That set is not
// obvious — the exclusion and the plain-module choice below each exist for a specific reason — which
// is precisely why it is a module rather than a paragraph of documentation asking consumers to
// assemble it themselves.
dependencies {
  // api: the repository interfaces here implement spring-agent-core's neutral contracts, and the
  // domain models appear in their signatures.
  api project(':spring-agent-core')
  // api: JpaMcpServerConfigRepo and friends extend JpaRepository, so it is part of their public type.
  api 'org.springframework.boot:spring-boot-starter-data-jpa'
  // The starter, like the other two backend modules: Spring AI's own auto-configuration is the
  // wiring we want, and PersistenceAutoConfigurationFilter is what keeps it out of a deployment
  // that selected another backend. It brings spring-boot-starter-jdbc, which is where spring-jdbc
  // and the connection pool come from.
  //
  // Note what this settles: Spring AI builds the repository from the DataSource and JdbcTemplate
  // beans, so conversation history shares spring.datasource with the domain tables and cannot be
  // pointed at a database of its own.
  //
  // api: ChatMemoryJdbcTest asserts `instanceof JdbcChatMemoryRepository`, and a consumer may
  // reasonably want to as well.
  api 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-jdbc'

  // Hibernate keeps SQLite support out of its core artifact; without this the default backend has no
  // dialect for the database it defaults to.
  implementation 'org.hibernate.orm:hibernate-community-dialects'
  // runtimeOnly: nothing here compiles against org.sqlite. The driver is reached by name, through
  // DatabaseDriver.fromJdbcUrl, and named as a string in ChatMemoryRuntimeHints.
  runtimeOnly libs.sqlite.jdbc
}

forbidOnRuntimeClasspath(
    groups: ['org.mongodb', 'redis.clients', 'io.lettuce'],
    modules: [
      'spring-data-mongodb',
      'spring-data-redis',
      'spring-boot-mongodb',
      'spring-boot-data-mongodb',
      'spring-boot-data-redis',
      'spring-boot-starter-data-mongodb',
      'spring-boot-starter-data-redis',
      'spring-ai-model-chat-memory-repository-mongodb',
      'spring-ai-model-chat-memory-repository-redis',
    ])
