[versions]
guava = "33.6.0-jre"
jakarta-annotation = "2.1.1"
logback-json = "0.1.5"
larksuite-oapi = "2.6.1"
# Not BOM-managed: spring-boot-dependencies knows nothing about the Slack SDK. Every artifact of it
# is released off one version, so they share this one reference and must never be pinned apart.
#
# The `bolt-jakarta-*` variants, not the plain ones: the originals compile against
# `javax.websocket` and `javax.servlet`, which Spring Boot 4 does not ship and does not see. The
# plain artifact resolves and builds, and then finds no websocket provider at runtime.
slack-sdk = "1.45.3"
# The WebSocket client Socket Mode runs on. The Slack SDK declares both this and the
# jakarta.websocket API `provided`, so nothing arrives transitively and a build without this line
# compiles, starts, and then fails to open the connection at runtime. 2.2.0 is what
# slack-jakarta-socket-mode-client pins its own `provided` entry to; keep the two in step.
tyrus = "2.2.0"
spring-ai-agent-utils = "0.10.0"
# A released version, never a -SNAPSHOT: Maven Central rejects a deployment whose POM manages or
# depends on one, and this BOM is imported into the POM of every published module (see
# springagent.java-library-conventions). The whole release fails validation on that one line.
spring-ai = "2.0.1-SNAPSHOT"
# Not BOM-managed: spring-boot-dependencies does not manage Spring Shell at all. 4.x is the line
# built against Spring Boot 4, and it is where the terminal UI moved to
# org.springframework.shell.jline.tui — spring-agent-app-cli renders the agent's questions with it.
spring-shell = "4.0.3"
spring-dependency-management = "1.1.7"
fabric8 = "6.13.4"
# Deliberately not spring-boot-dependencies' native-build-tools-plugin.version (0.11.5): that
# property only manages the Maven plugin, Gradle plugin versions are never BOM-managed, and 0.11.5
# predates Gradle 9. 1.1.4+ is tested against Gradle 9.6.1, which is what the wrapper pins.
graalvm-buildtools = "1.1.8"
springboot = "4.1.1"
# Above spring-boot-dependencies' jedis.version (7.0.0), which is why it is pinned rather than left
# to the BOM. Spring AI's Redis chat memory declares 7.4.1 and its auto-configuration is
# @ConditionalOnClass(redis.clients.jedis.RedisClient), a class 7.0.0 does not have — under the BOM
# version the condition simply does not match, no error is logged, and chat memory silently falls
# back to the in-memory repository. ChatMemoryRedisTest is what would catch a regression here.
jedis = "7.4.1"
# Not BOM-managed: spring-boot-dependencies manages okhttp itself but not mockwebserver, which
# ships from the same release train and has to match it. okhttp is here transitively, under Spring
# AI's OpenAI client (SpringAiOpenAiHttpClient); check what that resolves to before bumping this,
# because MockWebServer and okhttp share internals and a mismatch fails at run time, not at compile
# time. Test-only, so it never reaches a published runtime classpath.
okhttp = "4.12.0"
sqlite-jdbc = "3.53.2.1"
testcontainers = "2.0.3"

[libraries]
guava = { module = "com.google.guava:guava", version.ref = "guava" }
jakarta-annotation-api = { module = "jakarta.annotation:jakarta.annotation-api", version.ref = "jakarta-annotation" }
logback-jackson = { module = "ch.qos.logback.contrib:logback-jackson", version.ref = "logback-json" }
logback-json-classic = { module = "ch.qos.logback.contrib:logback-json-classic", version.ref = "logback-json" }
spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "spring-ai" }
# The ffm variant, not jni/jansi/jna: they differ only in which JLine terminal provider they add,
# and jline-terminal-ffm needs no native library of its own — the others load one through JNI,
# which a native image would have to be told about. It does need a JDK where the FFM API is final,
# which this project is already past (spring-agent-app's --sun-misc-unsafe-memory-access needs 24).
#
# It is this starter rather than the plain spring-shell-starter because that one leaves
# spring-shell-jline optional, and the terminal UI the agent's questions are drawn with lives there.
spring-shell-starter = { module = "org.springframework.shell:spring-shell-starter-ffm", version.ref = "spring-shell" }
jedis = { module = "redis.clients:jedis", version.ref = "jedis" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
larksuite-oapi = { module = "com.larksuite.oapi:oapi-sdk", version.ref = "larksuite-oapi" }
slack-api-client = { module = "com.slack.api:slack-api-client", version.ref = "slack-sdk" }
slack-api-model = { module = "com.slack.api:slack-api-model", version.ref = "slack-sdk" }
slack-bolt = { module = "com.slack.api:bolt", version.ref = "slack-sdk" }
slack-bolt-socket-mode = { module = "com.slack.api:bolt-jakarta-socket-mode", version.ref = "slack-sdk" }
tyrus-standalone-client = { module = "org.glassfish.tyrus.bundles:tyrus-standalone-client", version.ref = "tyrus" }
testcontainers-core = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers-milvus = { module = "org.testcontainers:testcontainers-milvus", version.ref = "testcontainers" }
testcontainers-mongodb = { module = "org.testcontainers:testcontainers-mongodb", version.ref = "testcontainers" }
spring-ai-agent-utils-bom = { module = "org.springaicommunity:spring-ai-agent-utils-bom", version.ref = "spring-ai-agent-utils" }
spring-ai-agent-utils = { module = "org.springaicommunity:spring-ai-agent-utils", version.ref = "spring-ai-agent-utils" }
fabric8-kubernetes-client-bom = { module = "io.fabric8:kubernetes-client-bom", version.ref = "fabric8" }
fabric8-kubernetes-client = { module = "io.fabric8:kubernetes-client" }

[plugins]
# Keyed `graalvm`, not `graalvm-native`: `native` is a Java keyword, so the generated accessor
# `libs.plugins.graalvm.native` would not be referenceable.
graalvm = { id = "org.graalvm.buildtools.native", version.ref = "graalvm-buildtools" }
spring-boot = { id = "org.springframework.boot", version.ref = "springboot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }

[bundles]
logback-json = ['logback-json-classic', 'logback-jackson']
