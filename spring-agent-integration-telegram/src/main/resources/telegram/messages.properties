# Everything the agent writes into Telegram itself, as opposed to what the model produced. Sent as
# plain text with formatting applied around it, so nothing here is markup: an asterisk is an
# asterisk. Keep MessageFormat happy in the ones taking arguments: no apostrophes, no stray braces.

# Said once to somebody the bot will not answer, in a private chat. Their user id is what an
# operator has to add, and nobody can be asked to find it themselves.
access-refused=This bot only answers the people it was set up for. To be added, give whoever runs it your Telegram user id: {0}

message-stop=Stop
message-starting=Working on it…
message-error=⚠️ The run failed: {0}
message-unknown-error=no reason was reported
message-tool-calls=Tools · {0}
message-tool-calls-done=Tools ({0})
message-tool-calls-earlier=… and {0} earlier
message-todo=Tasks
message-reasoning=Thinking
message-stop-not-yours=Only the person this run is answering can stop it.
