TelegramSendMessage.chatId=聊天 ID：个人的用户 ID，或群组的（负数）聊天 ID
TelegramSendMessage.text=消息内容，用普通 Markdown 书写
TelegramSendMessage.replyToMessageId=要回复的、该聊天中某条消息的 ID
TelegramSendFile.chatId=要上传到的聊天 ID
TelegramSendFile.path=本地文件的绝对路径
TelegramSendFile.caption=随文件一起发送的一行说明
TelegramSendFile.replyToMessageId=要回复的、该聊天中某条消息的 ID
TelegramGetChat.chatId=群组的聊天 ID
