bash-exec-failed=bash_id: {0}\n\n执行命令出错：{1}
bash-timed-out=bash_id: {0}\n\n命令在 {1} 毫秒后超时
bash-invalid-id=错误：bash_id 无效
bash-no-such-shell=错误：找不到 ID 为 {0} 的后台 shell
bash-shell-id=Shell ID：{0}
bash-shell-status=状态：{0}
bash-status-unknown=未知
bash-new-output=新增输出：
bash-no-new-output=自上次查看以来没有新增输出。
bash-output-failed=获取输出出错：{0}
bash-already-terminated=Shell {0} 已经结束，已从活动 shell 列表中移除。
bash-killed=已成功终止 shell：{0}
bash-kill-failed=终止 shell 出错：{0}
bash-stderr=STDERR：
bash-exit-code=退出码：{0}
bash-background-started=bash_id: {0}\n\n后台 shell 已启动，ID 为 {0}\n用 BashOutput 工具、传入 bash_id={0} 即可取回它的输出。
bash-no-pod=当前没有正在运行的 shell pod。下一次 Bash 调用会新建一个。
bash-pod-restarted=shell pod 已重启。下一次 Bash 调用会用更新后的凭据新建一个 pod。
bash-pod-restart-failed=重启 shell pod 出错：{0}
bash-truncated=……（输出在 {0} MB 处被截断，这是本应用愿意留在内存里的上限；请把命令的输出重定向到文件，再分段读回来）
