# What the shell tools hand back to the model, in the workspace's language.
#
# A shell result is what the model reasons from and then reports, so English here pulls the whole
# turn into English however the user wrote. The identifiers stay as they are — bash_id, STDERR, the
# tool names — since those are what the model has to type back, not prose.
#
# Keep MessageFormat happy in the ones taking arguments: no apostrophes, no stray braces.
bash-exec-failed=bash_id: {0}\n\nError executing command: {1}
bash-timed-out=bash_id: {0}\n\nCommand timed out after {1}ms
bash-invalid-id=Error: invalid bash_id
bash-no-such-shell=Error: No background shell found with ID: {0}
bash-shell-id=Shell ID: {0}
bash-shell-status=Status: {0}
bash-status-unknown=Unknown
bash-new-output=New output:
bash-no-new-output=No new output since last check.
bash-output-failed=Error retrieving output: {0}
bash-already-terminated=Shell {0} was already terminated. Removed from active shells.
bash-killed=Successfully killed shell: {0}
bash-kill-failed=Error killing shell: {0}
bash-stderr=STDERR:
bash-exit-code=Exit code: {0}
bash-background-started=bash_id: {0}\n\nBackground shell started with ID: {0}\nUse the BashOutput tool with bash_id={0} to retrieve output.
bash-no-pod=No running shell pod was found. The next Bash call will create one.
bash-pod-restarted=Shell pod restarted. The next Bash call will create a fresh pod with updated credentials.
bash-pod-restart-failed=Error restarting shell pod: {0}
bash-truncated=... (output stopped at {0} MB, which is all of it this application will hold in memory; redirect the output of the command to a file and read it back in pieces)
