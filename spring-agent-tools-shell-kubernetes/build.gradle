plugins {
  id 'springagent.java-library-conventions'
}

description = 'Shell tools for spring-agent-core that run commands in a Kubernetes pod.'

dependencies {
  // The i18n checks every module makes of its own tools and messages. Fixtures rather than a copy
  // per module: they are two hundred lines of reflection over @Tool methods and properties files,
  // and the first two modules to want them ended up with the same code twice.
  testImplementation testFixtures(project(':spring-agent-core'))

  api project(':spring-agent-core')

  // The only module that may carry fabric8: spring-agent-core forbids the group on its runtime
  // classpath. The JDK HTTP client rather than the OkHttp one the client defaults to.
  api platform(libs.fabric8.kubernetes.client.bom)
  implementation 'io.fabric8:kubernetes-httpclient-jdk'
  implementation(libs.fabric8.kubernetes.client) {
    exclude group: 'io.fabric8', module: 'kubernetes-httpclient-okhttp'
  }
}
