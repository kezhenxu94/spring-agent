<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <!--
    Fixed at one scale. This page is an instrument panel with a drawer, a composer pinned to the
    bottom and a status strip in the header, and a pinch zoom takes all three off screen at once —
    including the Stop button, which is the one control a run in progress needs. Everything is laid
    out to the viewport instead and wraps rather than widening (see base.css), so there is nothing
    off to the side to zoom out to find.

    The cost is real: pinch-to-zoom is how somebody with low vision reads a small label, and this
    takes it away. What replaces it is the browser's own text size, which this page respects because
    every size here is relative to the root.
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Spring Agent</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230B0E14'/><rect x='9' y='7' width='2.5' height='18' rx='1.25' fill='%23FFB020'/><circle cx='19' cy='11' r='2.5' fill='%234FD1C5'/><circle cx='19' cy='19' r='2.5' fill='%23FFB020'/></svg>">

  <!--
    Theme before first paint. A class added afterwards is a white flash on a dark desktop, which is
    the one thing a theme switcher must not do. Auto means the operating system's setting; a stored
    choice overrides it.
  -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('spring-agent-theme') || 'auto';
        var dark = stored === 'dark' || (stored === 'auto'
          && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {
        // Private browsing refuses localStorage outright. Auto is a fine answer.
      }
    })();
  </script>

  <link rel="preload" as="font" type="font/woff2" href="/fonts/ibm-plex-sans-400-latin.woff2" crossorigin>
  <link rel="stylesheet" href="/fonts/fonts.css">

  <!--
    Tailwind's browser build compiles this block and scans the markup for utility classes.

    @theme is where the design lives. Colour here is state and nothing else, the way it is on an
    instrument panel: amber means this is running and you are attached to it, teal means it finished,
    violet means it is waiting on a person, coral means it failed. Nothing is coloured for decoration,
    so a glance at the page is a reading of what the agent is doing.

    The @custom-variant is load-bearing: v4 keys `dark:` off prefers-color-scheme by default, so
    without it the theme switcher would toggle a class nothing responds to.
  -->
  <style type="text/tailwindcss">
    @import "tailwindcss";
    @custom-variant dark (&:where(.dark, .dark *));

    @theme {
      /* Ground and structure. Cool rather than neutral grey — this is an instrument, not paper. */
      --color-ink:      #0B0E14;
      --color-panel:    #121722;
      --color-rail:     #1F2736;
      --color-edge:     #2B3549;
      --color-mist:     #8494AC;
      --color-paper:    #E6EDF7;

      /* State. Each one is a thing a run can be, and nothing else uses them. */
      --color-signal:   #FFB020;
      --color-settled:  #4FD1C5;
      --color-waiting:  #C4B5FD;
      --color-alarm:    #FF6B6B;

      --font-display: "Space Grotesk", "Helvetica Neue", sans-serif;
      --font-sans: "IBM Plex Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
    }
  </style>
  <script src="/vendor/tailwindcss.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <!-- The STOMP client a run is watched over. Vendored like the two above rather than loaded from a
       CDN: this page is served by the same process the agent runs in, often on a network that can
       reach nothing else, and a surface that goes blank because a third party is down is not one
       worth the saved bytes. -->
  <script src="/vendor/stomp.umd.min.js"></script>
</head>

<body class="h-full bg-white font-sans text-[15px] text-ink antialiased dark:bg-ink dark:text-paper">

<div id="app" class="flex h-full">

  <!-- ───────────────────────────── conversations and scheduled work ───────────────────────────── -->
  <!-- Tapping away from the drawer closes it, which is what everyone tries first. -->
  <div id="sidebar-backdrop" class="fixed inset-0 z-30 bg-black/40" hidden></div>

  <!--
    display:flex at every width, never toggled. Hiding this with `hidden` is what broke the drawer
    on a phone: below md the aside fell back to display:block, so `flex-1` on the list stopped
    growing and the footer simply followed the last conversation instead of sitting at the bottom.
    Below md it slides on a transform instead, which leaves the column layout intact.
  -->
  <aside id="sidebar"
         class="fixed inset-y-0 left-0 z-40 flex w-[270px] shrink-0 flex-col border-r border-zinc-200
                bg-zinc-50 md:static dark:border-rail dark:bg-panel">

    <div class="flex items-center gap-2.5 px-4 pt-4 pb-3">
      <svg viewBox="0 0 32 32" class="size-6 shrink-0" aria-hidden="true">
        <rect x="9" y="7" width="2.5" height="18" rx="1.25" class="fill-zinc-400 dark:fill-edge"/>
        <circle cx="19" cy="11" r="2.5" class="fill-settled"/>
        <circle cx="19" cy="19" r="2.5" class="fill-signal"/>
      </svg>
      <span class="flex-1 font-display text-[15px] font-semibold tracking-tight"
            data-i18n="app.title">Spring Agent</span>
      <!-- A way out of the drawer. The header's toggle is behind it once it is open. -->
      <button id="close-sidebar" type="button" class="tool-button drawer-only -mr-1"
              data-i18n-title="nav.close">
        <svg viewBox="0 0 16 16" fill="none" class="size-[15px]" aria-hidden="true">
          <path d="m4.5 4.5 7 7m0-7-7 7" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round"/>
        </svg>
        <span class="sr-only" data-i18n="nav.close">Close</span>
      </button>
    </div>

    <!--
      Which list the sidebar is showing. Icons rather than words, and the same segmented control the
      theme switch uses, because it is the same kind of choice — one of a small fixed set, worth
      seeing rather than finding. Each carries its name as a tooltip and again for a screen reader,
      since an icon on its own names nothing.

      Drawn only where this deployment has a knowledge base: one tab is not a choice, and a strip
      offering a section that does not exist is worse than no strip.
    -->
    <div id="sidebar-tabs" hidden role="tablist" data-i18n-label="nav.sections"
         class="mx-3 mb-3 flex items-center gap-0.5 rounded-lg border border-zinc-300 p-0.5
                dark:border-edge">
      <button id="tab-conversations-button" type="button" role="tab" aria-selected="true"
              aria-controls="tab-conversations" class="seg seg-tab seg-on flex-1"
              data-i18n-title="nav.conversations">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"
             stroke-linecap="round" stroke-linejoin="round" class="size-[15px]" aria-hidden="true">
          <path d="M2.6 4.1c0-.7.6-1.3 1.3-1.3h8.2c.7 0 1.3.6 1.3 1.3v5.4c0 .7-.6 1.3-1.3 1.3H6.4L3.4 13V10.8h-.8V4.1Z"/>
        </svg>
        <span class="sr-only" data-i18n="nav.conversations">Conversations</span>
      </button>
      <button id="tab-tasks-button" type="button" role="tab" aria-selected="false"
              aria-controls="tab-tasks" class="seg seg-tab flex-1" data-i18n-title="nav.tasks">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"
             stroke-linecap="round" stroke-linejoin="round" class="size-[15px]" aria-hidden="true">
          <circle cx="8" cy="8.4" r="5.4"/><path d="M8 5.4v3l1.9 1.2M6 1.6h4"/>
        </svg>
        <span class="sr-only" data-i18n="nav.tasks">Scheduled</span>
      </button>
      <button id="tab-knowledge-button" type="button" role="tab" aria-selected="false" hidden
              aria-controls="tab-knowledge" class="seg seg-tab flex-1" data-i18n-title="nav.knowledge">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"
             stroke-linecap="round" stroke-linejoin="round" class="size-[15px]" aria-hidden="true">
          <path d="M8 4.3c0-.9-.7-1.6-1.6-1.6H2.8v8.6h3.6c.9 0 1.6.7 1.6 1.6m0-8.6c0-.9.7-1.6 1.6-1.6h3.6v8.6H9.6c-.9 0-1.6.7-1.6 1.6m0-8.6v8.6"/>
        </svg>
        <span class="sr-only" data-i18n="nav.knowledge">Knowledge base</span>
      </button>
    </div>

    <!--
      Starting a conversation, which is the one thing worth a row of its own: it is what somebody
      came to this page to do, and it is a sentence rather than an icon because there is nothing
      beside it to be confused with.

      The other two sections make their own things in their own panels — a task by asking the agent
      for one, a document from the controls above the knowledge list — so this slot goes on those
      rather than holding a button that would have to be explained. See selectTab, and note that
      the slot sits below the tab strip for that reason: the tabs would otherwise move as you
      switched between them.
    -->
    <div id="primary-action" class="px-3 pb-3">
      <button id="new-conversation"
              class="group flex w-full items-center gap-2 rounded-lg border border-zinc-300 px-3 py-2
                     text-[13px] font-medium transition hover:border-zinc-400 hover:bg-white
                     focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-signal
                     dark:border-edge dark:hover:border-mist dark:hover:bg-rail">
        <span class="text-mist transition group-hover:text-signal">+</span>
        <span data-i18n="nav.new">New conversation</span>
      </button>
    </div>

    <nav class="flex-1 overflow-y-auto px-3 pb-2">

      <!-- No heading over any of the three: the strip above them says which one this is, and a
           label repeating it is a line of chrome that pushes the list itself further down. -->
      <div id="tab-conversations" role="tabpanel" aria-labelledby="tab-conversations-button">
        <ul id="conversation-list" class="space-y-px"></ul>
      </div>

      <!--
        What the agent has been asked to do later. Its own section rather than a coda to the
        conversations, because a task is not one: it belongs to a schedule, it fires whether or not
        anybody is here, and the row that shows it needs the room to say when.
      -->
      <div id="tab-tasks" role="tabpanel" aria-labelledby="tab-tasks-button" hidden>
        <ul id="task-list" class="space-y-1.5"></ul>
      </div>

      <!--
        The same list, for the other thing this agent keeps: one row per document, opened the way a
        conversation is opened. Search sits above it and replaces what the list shows, so there is
        one list to read rather than a second one somewhere else.

        One line of controls, then one line of state. Three things can narrow this list — a search,
        a scope, somebody else's knowledge base — and rather than a badge for each they resolve to
        one sentence in the note bar; see describe() in knowledge.js. Adding and narrowing are
        icons because the list is what this column is for, and neither of them is worth a row.
      -->
      <div id="tab-knowledge" role="tabpanel" aria-labelledby="tab-knowledge-button" hidden>
        <div class="mb-2 flex items-center gap-1">
          <input id="knowledge-search" type="search" autocomplete="off"
                 class="min-w-0 flex-1 rounded-md border border-zinc-300 bg-transparent px-2 py-1.5
                        text-[12.5px] outline-none focus:border-signal dark:border-edge"
                 data-i18n-placeholder="knowledge.search.placeholder">
          <button id="knowledge-add-button" type="button" class="tool-button shrink-0"
                  data-i18n-title="knowledge.add">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"
                 stroke-linecap="round" class="size-[15px]" aria-hidden="true">
              <path d="M8 3.5v9M3.5 8h9"/>
            </svg>
            <span class="sr-only" data-i18n="knowledge.add">Add to the knowledge base</span>
          </button>
          <!-- Hidden until initView finds something to put in it: a menu offering one row, or
               none, says the feature is broken rather than that it is not this person's to use. -->
          <button id="knowledge-view" type="button" hidden class="tool-button shrink-0"
                  aria-haspopup="menu" aria-expanded="false" data-i18n-title="knowledge.view">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"
                 stroke-linecap="round" stroke-linejoin="round" class="size-[15px]"
                 aria-hidden="true">
              <path d="M2.8 3.8h10.4L9.3 8.6v3.8L6.7 11V8.6z"/>
            </svg>
            <span class="sr-only" data-i18n="knowledge.view">What this list shows</span>
          </button>
        </div>

        <!--
          Reading somebody else's, for an admin. Revealed by the menu above rather than standing
          open: it is the rarest thing this column does, and the menu row that reveals it has
          already named it — which is why there is no caption here.
        -->
        <div id="knowledge-owner-row" hidden class="mb-2 flex items-center gap-1">
          <input id="knowledge-owner" type="text" autocomplete="off"
                 class="min-w-0 flex-1 rounded-md border border-zinc-300 bg-transparent px-2 py-1
                        font-mono text-[12px] outline-none focus:border-signal dark:border-edge"
                 data-i18n-placeholder="knowledge.owner.placeholder">
          <button id="knowledge-owner-open" type="button" class="panel-action shrink-0"
                  data-i18n="knowledge.owner.browse">Open</button>
          <button id="knowledge-owner-clear" type="button" hidden class="tool-button shrink-0"
                  data-i18n-title="knowledge.owner.mine">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"
                 stroke-linecap="round" class="size-[14px]" aria-hidden="true">
              <path d="M4.4 4.4l7.2 7.2M11.6 4.4l-7.2 7.2"/>
            </svg>
            <span class="sr-only" data-i18n="knowledge.owner.mine">Back to mine</span>
          </button>
        </div>

        <p id="knowledge-note-bar" hidden class="px-1 pb-1.5 text-[11px] leading-snug text-mist"></p>
        <ul id="knowledge-list" class="space-y-px"></ul>
        <button id="knowledge-more" type="button" hidden
                class="mt-2 w-full rounded-md px-2 py-1.5 font-mono text-[10px] uppercase
                       tracking-wider text-mist transition hover:bg-zinc-100 dark:hover:bg-rail/60"
                data-i18n="knowledge.more">Load more</button>
      </div>
    </nav>

    <!--
      Who is signed in, and the two things that belong to them rather than to the agent.

      One row, because that is all it is worth: a name, the id underneath it in the mono face so it
      reads as the machine handle it is, and two quiet controls. Preferences are behind one button
      rather than laid out here — the theme and the language are set once and then never again, and
      a settings strip standing open at the bottom of every session spends the sidebar's last inch
      on a decision nobody is making. Sign out is an icon for the opposite reason: it is one word,
      it is next to nothing it could be confused with, and its name is on its tooltip.

      Neither control uses a state colour. Amber, teal, violet and coral mean something specific
      about a run everywhere else in this page, and spending one on chrome would make a settings row
      look like something the agent is doing. Signing out is the exception the alarm colour exists
      for, and only on hover.
    -->
    <div class="group flex items-center gap-1.5 border-t border-zinc-200 p-2.5 dark:border-rail">
      <img id="me-avatar" alt=""
           class="size-7 shrink-0 rounded-full bg-zinc-200 object-cover dark:bg-rail">
      <!--
        The name and the id, stacked. The id is elided in the middle rather than at the end, by the
        page — an OAuth subject is a long constant prefix and a short distinguishing tail, so a
        truncation that keeps the head shows every user the same string. See middleTruncate in
        dom.js; the whole of it is on the title, and the button beside it puts the whole of it on
        the clipboard, which is what an id shortened for display is otherwise no longer good for.
      -->
      <span class="min-w-0 flex-1 leading-tight">
        <span id="me-name" class="block truncate text-[12.5px] font-medium"></span>
        <span class="flex items-center gap-1">
          <span id="me-id"
                class="min-w-0 truncate font-mono text-[10px] tracking-wide text-mist"></span>
          <button id="me-id-copy" type="button" class="id-copy" data-i18n-title="identity.copy">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"
                 stroke-linejoin="round" class="size-[11px]" aria-hidden="true">
              <rect x="5.6" y="5.6" width="7.4" height="7.4" rx="1.6"/>
              <path d="M10.4 3.6a1.6 1.6 0 0 0-1.6-1.6H4.6A1.6 1.6 0 0 0 3 3.6v4.2a1.6 1.6 0 0 0 1.6 1.6"/>
            </svg>
            <span class="sr-only" data-i18n="identity.copy">Copy user id</span>
          </button>
        </span>
      </span>

      <!-- The theme and the language, in one menu. Filled in by settings.js. -->
      <button id="settings-button" type="button" class="tool-button tool-button-sm shrink-0"
              aria-haspopup="menu" aria-expanded="false" data-i18n-title="settings">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"
             stroke-linecap="round" class="size-[15px]" aria-hidden="true">
          <path d="M2.4 4.6h1.6M8 4.6h5.6M2.4 11.4h6.2M12.5 11.4h1.1"/>
          <circle cx="6" cy="4.6" r="1.9"/>
          <circle cx="10.5" cy="11.4" r="1.9"/>
        </svg>
        <span class="sr-only" data-i18n="settings">Preferences</span>
      </button>

      <form method="post" action="/logout" class="shrink-0">
        <input type="hidden" id="logout-csrf" name="_csrf">
        <button type="submit" class="tool-button tool-button-sm tool-button-danger"
                data-i18n-title="nav.signout">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"
               stroke-linecap="round" stroke-linejoin="round" class="size-[15px]" aria-hidden="true">
            <path d="M6.2 2.8H3.6v10.4h2.6M9.4 5.2 12.6 8l-3.2 2.8M12.2 8H6.6"/>
          </svg>
          <span class="sr-only" data-i18n="nav.signout">Sign out</span>
        </button>
      </form>
    </div>
  </aside>

  <!-- ───────────────────────────────────── the run ───────────────────────────────────── -->
  <main class="flex min-w-0 flex-1 flex-col">

    <header class="flex h-12 shrink-0 items-center gap-3 border-b border-zinc-200 px-4 dark:border-rail">
      <button id="toggle-sidebar" class="tool-button drawer-only -ml-1"
              aria-expanded="false" aria-controls="sidebar" data-i18n-title="nav.menu">
        <svg viewBox="0 0 16 16" fill="none" class="size-[15px]" aria-hidden="true">
          <path d="M2.5 4h11M2.5 8h11M2.5 12h11" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round"/>
        </svg>
        <span class="sr-only" data-i18n="nav.menu">Menu</span>
      </button>
      <h1 id="conversation-title" class="min-w-0 flex-1 truncate text-[13px] font-medium"
          data-i18n="app.title">Spring Agent</h1>

      <!--
        The status strip. This application's whole premise is that a run is on the server and this
        page is only attached to it, so "am I attached, and is it still going" is the question the
        header exists to answer.
      -->
      <div id="status"
           class="flex shrink-0 items-center gap-1.5 rounded-full border border-zinc-200 px-2.5 py-1
                  font-mono text-[10px] uppercase tracking-[0.12em] text-mist dark:border-rail">
        <span id="status-dot" class="size-1.5 rounded-full bg-zinc-300 dark:bg-edge"></span>
        <span id="status-text" data-i18n="status.idle">Idle</span>
      </div>
    </header>

    <div id="transcript" class="flex-1 overflow-y-auto scroll-smooth px-4 py-8 sm:px-6"></div>

    <!--
      The schedule, over the run for the same reason the knowledge base is: the composer belongs to
      a conversation, and leaving it under a list of tasks was the tell that this section had been
      hung off the chat rather than built as a peer of it.
    -->
    <section id="tasks-panel" hidden
             class="detail-panel flex-1 overflow-y-auto px-4 py-6 sm:px-6">
      <div id="tasks-body" class="detail-body mx-auto max-w-[46rem] space-y-5">

        <div id="tasks-intro" class="space-y-1">
          <h2 class="font-display text-[20px] font-semibold tracking-tight"
              data-i18n="tasks.title">Scheduled</h2>
          <p class="max-w-[38rem] text-[12.5px] leading-relaxed text-mist"
             data-i18n="tasks.subtitle"></p>
        </div>

        <!-- One task: what it will do, when, and how it can be corrected. Filled in by the page,
             in the shape a document opens in — see detail.css. -->
        <article id="task-detail" hidden
                 class="detail-card space-y-3 rounded-xl border border-zinc-200 p-4
                        dark:border-rail"></article>
      </div>
    </section>

    <!--
      The knowledge base, over the run rather than beside it. The list lives in the sidebar, where
      the conversations are, so this is what the sidebar's selection opens onto: one document, or —
      with nothing selected — the two ways of adding one.

      Hidden with the `hidden` attribute rather than a class, so nothing in the utility layer can
      out-specify it, the same reason the composer toggles display explicitly.
    -->
    <section id="knowledge-panel" hidden
             class="detail-panel flex-1 overflow-y-auto px-4 py-6 sm:px-6">
      <div id="knowledge-body" class="detail-body mx-auto max-w-[46rem] space-y-5">

        <div id="knowledge-intro" class="space-y-1">
          <h2 class="font-display text-[20px] font-semibold tracking-tight"
              data-i18n="knowledge.title">Knowledge base</h2>
          <p class="max-w-[38rem] text-[12.5px] leading-relaxed text-mist"
             data-i18n="knowledge.subtitle"></p>
        </div>

        <!-- One document: what it is, where it came from, and the two things that can be done to
             it. Filled in by the page; empty and hidden until the sidebar selects one. -->
        <article id="knowledge-detail" hidden
                 class="detail-card space-y-3 rounded-xl border border-zinc-200 p-4
                        dark:border-rail"></article>

        <!-- Adding to it. Both halves write through the endpoints the chat tools write through. -->
        <div id="knowledge-add" class="space-y-2 rounded-xl border border-zinc-200 p-3 dark:border-rail">
          <div class="flex flex-wrap items-center gap-2">
            <button id="knowledge-upload" type="button" class="panel-action"
                    data-i18n="knowledge.upload">Add files</button>
            <button id="knowledge-note-open" type="button" class="panel-action"
                    data-i18n="knowledge.note">Write a note</button>
            <label class="ml-auto flex items-center gap-1.5 text-[11.5px] text-mist">
              <span data-i18n="knowledge.into">Into</span>
              <select id="knowledge-target"
                      class="rounded-md border border-zinc-300 bg-transparent px-1.5 py-1
                             text-[11.5px] outline-none dark:border-edge"></select>
            </label>
            <input id="knowledge-file-input" type="file" multiple class="hidden">
          </div>
          <p class="text-[11.5px] leading-relaxed text-mist" data-i18n="knowledge.upload.hint"></p>

          <form id="knowledge-note-form" hidden class="space-y-2 pt-1">
            <input id="knowledge-note-title" type="text" required
                   class="w-full rounded-lg border border-zinc-300 bg-transparent px-2.5 py-1.5
                          text-[13px] outline-none focus:border-signal dark:border-edge"
                   data-i18n-placeholder="knowledge.note.title">
            <textarea id="knowledge-note-text" rows="4" required
                      class="w-full resize-y rounded-lg border border-zinc-300 bg-transparent px-2.5
                             py-1.5 text-[13px] leading-relaxed outline-none focus:border-signal
                             dark:border-edge"
                      data-i18n-placeholder="knowledge.note.text"></textarea>
            <div class="flex gap-2">
              <button type="submit" class="panel-action panel-action-primary"
                      data-i18n="knowledge.note.save">Store it</button>
              <button id="knowledge-note-cancel" type="button" class="panel-action"
                      data-i18n="knowledge.cancel">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </section>

    <div id="composer-bar"
         class="relative shrink-0 border-t border-zinc-200 px-4 py-3 sm:px-6 dark:border-rail">

      <!--
        The way back to the end of a conversation somebody has scrolled up out of.

        Here rather than pinned to the transcript, because the composer bar is what the transcript
        ends at: the button sits just above the frame the answer is arriving into, which is where
        the eye already is. Positioned against the bar itself rather than against the column inside
        it — the bar has padding of its own, and measuring from the column put the button half over
        the divider, straddling the line instead of clearing it.

        It appears only while the transcript is not near its end — see AT_END in dom.js, which is
        the same number that decides whether a delta may scroll the reader, so the button cannot
        show up while the page is still following the answer.
      -->
      <button id="scroll-end" type="button" hidden class="scroll-end"
              data-i18n-title="composer.scroll.end">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"
             stroke-linecap="round" stroke-linejoin="round" class="size-[15px]" aria-hidden="true">
          <path d="M8 3.4v9.2M4.4 9l3.6 3.6L11.6 9"/>
        </svg>
        <span class="sr-only" data-i18n="composer.scroll.end">Jump to the latest</span>
      </button>

      <div class="mx-auto max-w-[46rem]">

        <!-- What has been uploaded but not yet sent. Empty and hidden until there is something. -->
        <ul id="attachments" class="mb-2 hidden flex-wrap gap-1.5"></ul>

        <!--
          A toolbar of things you can add to a message, above the box you type it in. One button so
          far; it is a strip rather than a lone button because the next one — a screenshot, a
          reference to a file the agent already has — belongs beside it and not somewhere else.
        -->
        <div class="mb-1.5 flex items-center gap-0.5" role="toolbar" data-i18n-label="composer.tools">
          <button id="attach" type="button" class="tool-button" data-i18n-title="composer.attach">
            <svg viewBox="0 0 20 20" fill="none" class="size-[17px]" aria-hidden="true">
              <path d="M13.5 6.5 8 12a2 2 0 1 0 2.8 2.8l5.7-5.7a4 4 0 1 0-5.7-5.7L5 9.3"
                    stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                    stroke-linejoin="round"/>
            </svg>
            <span class="sr-only" data-i18n="composer.attach">Attach files</span>
          </button>
          <input id="file-input" type="file" multiple class="hidden">
        </div>

        <!--
          The box owns the focus ring, through focus-within, so the textarea inside it can be
          borderless and the action can sit in the same frame as the text it acts on. The textarea's
          bottom padding is what reserves the button's corner, so a long message wraps above it
          rather than underneath it.
        -->
        <div class="composer-box">
          <textarea id="composer" rows="1"
                    class="block max-h-52 w-full resize-none border-0 bg-transparent px-3.5 pt-3
                           pb-11 text-[14px] leading-[1.5] outline-none placeholder:text-mist"
                    data-i18n-placeholder="composer.placeholder"></textarea>

          <button id="send" class="composer-action" data-i18n-title="composer.send">
            <svg viewBox="0 0 16 16" fill="none" class="size-[15px]" aria-hidden="true">
              <path d="M8 13V3.5M3.9 7.6 8 3.5l4.1 4.1" stroke="currentColor" stroke-width="1.6"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="sr-only" data-i18n="composer.send">Send</span>
          </button>

          <button id="stop" class="composer-action composer-action-stop"
                  data-i18n-title="composer.stop">
            <svg viewBox="0 0 16 16" class="size-[13px]" aria-hidden="true">
              <rect x="3" y="3" width="10" height="10" rx="2" fill="currentColor"/>
            </svg>
            <span class="sr-only" data-i18n="composer.stop">Stop run</span>
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
