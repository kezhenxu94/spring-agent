# 将回答同步到本页面之外的聊天平台：卡片开头的这一行，说明消息来自哪里。发送卡片的是机器人而不是本人，
# 因此这句话是让署名诚实的关键——群里的人需要能看出这是有人在别处输入的，而不是机器人自己说的。
# 群聊需要写出名字，单聊不需要：一个人看自己的会话，不必被告知自己是谁。
# 注意 MessageFormat：不要用英文单引号，花括号只用于占位符。
# {0} 本部署的名称，{1} 回到页面中该会话的链接
handoff-from-web=你从 [{0}]({1}) 发送了这条消息：
# {0} 发送者，{1} 本部署的名称，{2} 回到该会话的链接
handoff-from-web-group={0} 从 [{1}]({2}) 发送了这条消息：
# 未配置 app.web.base-url 时使用，此时没有链接可给。只写名称，胜过给一个打不开的链接。
handoff-from-web-plain=你从 {0} 发送了这条消息：
# {0} 发送者，{1} 本部署的名称
handoff-from-web-group-plain={0} 从 {1} 发送了这条消息：
# 技能：直接在页面上管理，而不经由对话。技能是一个装着说明的文件夹，智能体按名称加载，
# 因此这里的拒绝信息说的都是具体的文件夹和文件。
skill-scope-unknown={0} 不是存放技能的位置，请选择自己的或公司的。
skill-no-group=此处没有群组技能，请在群聊中与助手一起使用。
skill-no-tenant=你的登录信息中没有公司标识，因此没有公司技能。
skill-tenant-read-only=这里只有管理员才能修改公司技能。你仍然可以查看，也可以复制一份到自己的技能里。
skill-not-found=这里没有名为 {0} 的技能。
skill-file-not-found=该技能中没有文件 {0}。
skill-name-required=请为技能取一个名称，它就是存放文件的文件夹名。
skill-name-taken=这里已经有一个名为 {0} 的技能了。
skill-name-invalid=技能名称必须是单层文件夹名：不能包含斜杠，也不能是 . 或 ..
skill-path-denied=该路径不在此技能的文件夹内。
skill-too-many-files=该文件夹中的文件超过 {0} 个，已经不像一个技能了。
skill-write-failed=文件保存失败。
skill-file-too-large=这里显示的技能文件最大 {0}KB。更长的内容请让智能体来写。
skill-name-too-long=技能名称最长 {0} 个字符，因为它同时也是智能体调用它时用的名字。
skill-zip-no-manifest=压缩包里没有 {0}，因此它不是一个技能。请补上后重新打包。
skill-zip-escapes=压缩包中有指向技能目录之外的文件路径，因此整个压缩包都没有解压。
