# Text this application writes itself, as opposed to what the model produced. The frontend has its
# own bundle in static/i18n.js; this one is for what the server says, which is mostly the reasons a
# request was refused.
# What the agent calls itself, where app.web.title has not fixed one name for every language. The
# one key here a page renders rather than a person reads, and the one a consumer embedding this
# module is most likely to override — see app.web.messages.
app-title=Spring Agent
message-empty=A message cannot be empty.
question-empty=Choose an option or write an answer.
question-expired=These questions have expired. Send a message to carry on.
question-answered=These questions have already been answered.
question-superseded=A later message replaced these questions.
question-pending=These questions are still waiting for an answer.
upload-empty=Choose a file to upload.
upload-too-many=Up to {0} files at a time.
upload-too-large={0} is larger than {1}MB. Point the agent at it instead of uploading it.
upload-failed=The file could not be stored.
# The knowledge base, managed from the page rather than through a run. A refusal here is read by a
# person looking at a list, so each says what to do instead rather than only what went wrong.
knowledge-unavailable=This deployment has no knowledge base.
knowledge-owner-forbidden=Only an administrator can read somebody else's knowledge base.
knowledge-scope-unknown={0} is not a knowledge base. Choose your own or the company's.
knowledge-scope-required=Say which knowledge base the document is in. The same file can be in more than one.
knowledge-no-group=There is no group knowledge base here. Use a group chat with the agent for that.
knowledge-no-tenant=Your sign-in carries no company, so there is no company knowledge base.
knowledge-tenant-read-only=Only an administrator can change the company knowledge base here. You can still read and search it.
knowledge-no-query=Type something to search for.
knowledge-no-title=Give the document a title, so it can be recognised in the list.
knowledge-no-text=A note cannot be empty.
knowledge-not-found=No document {0} in your knowledge base.
knowledge-index-failed=The document could not be indexed: {0}
# Mirroring an answer onto the chat surface beside this page: the line the card opens with, above
# the answer, saying where the message came from. The bot is the author of that card and cannot post
# as the person, so this is what makes the attribution honest — a group reading it has to be able to
# tell that somebody typed this elsewhere rather than that the bot invented it.
#
# Two forms because a group needs the name and a direct message does not: the one person reading
# their own conversation is not told who they are. Keep MessageFormat happy: no apostrophes, and
# every brace a placeholder.
# {0} the name of this deployment, {1} a link back to the conversation in the page
handoff-from-web=You sent this from [{0}]({1}):
# {0} who sent it, {1} the name of this deployment, {2} a link back to the conversation
handoff-from-web-group={0} sent this from [{1}]({2}):
# The same, where app.web.base-url is unset and there is therefore no link to offer. A name on its
# own rather than a link to nowhere.
handoff-from-web-plain=You sent this from {0}:
# {0} who sent it, {1} the name of this deployment
handoff-from-web-group-plain={0} sent this from {1}:
# Skills, managed from the page rather than through a run. A skill is a folder of instructions the
# agent loads by name, so a refusal here is about a folder and a file, and says which.
skill-scope-unknown={0} is not a place skills are kept. Choose your own or the company's.
skill-no-group=There are no group skills here. Use a group chat with the agent for that.
skill-no-tenant=Your sign-in carries no company, so there are no company skills.
skill-tenant-read-only=Only an administrator can change the company's skills here. You can still read them and copy one into your own.
skill-not-found=No skill called {0} here.
skill-file-not-found=No file {0} in this skill.
skill-name-required=Give the skill a name. It is the folder the files go in.
skill-name-taken=There is already a skill called {0} here.
skill-name-invalid=A skill name is one folder name: no slashes, and not . or ..
skill-path-denied=That path is outside the skill.
skill-too-many-files=This folder holds more than {0} files, which is more than a skill should.
skill-write-failed=The file could not be saved.
skill-file-too-large=A skill file shown here can be up to {0}KB. Ask the agent to write a longer one.
skill-name-too-long=A skill name can be up to {0} characters, because it becomes the name the agent calls it by.
skill-zip-no-manifest=That archive has no {0} in it, so it is not a skill. Add one and zip it again.
skill-zip-escapes=That archive contains a file path that points outside the skill, so none of it was unpacked.

# Memories, managed from the page rather than through a run. A memory is a file the agent wrote
# about whoever it was talking to, so a refusal here is about a file and says which.
memory-scope-unknown={0} is not a place memories are kept. Choose your own or the company's.
memory-no-group=There are no group memories here. Use a group chat with the agent for that.
memory-no-tenant=Your sign-in carries no company, so there are no company memories.
memory-tenant-read-only=Only an administrator can change what the company remembers. You can still read it.
memory-not-found=No memory at {0} here.
memory-path-required=Give the memory a file name, ending in .md.
memory-path-denied=That path is outside the memories folder.
memory-too-many-files=This folder holds more than {0} files, which is more than memories should.
memory-write-failed=The memory could not be saved.
memory-too-large=A memory shown here can be up to {0}KB. Ask the agent to write a longer one.

# MCP servers, managed from the page rather than through a run. A server row holds a credential, so
# these refusals name the server and never repeat what was configured on it.
mcp-name-required=Give the server a name. It is what everything else calls it by.
mcp-url-required=Give the server's endpoint URL.
mcp-target-required=Give an open_id or a chat_id to share with.
mcp-invalid=That cannot be used: {0}
mcp-prefix-taken=The tool prefix {0} is already taken by {1}, which you can also reach. Pick another.
mcp-unreachable={0} did not answer, so nothing was saved: {1}
mcp-save-failed={0} answered, but could not be saved: {1}
mcp-unknown=You have no server called {0}.
mcp-application-configured={0} is configured by this deployment for everyone. It is already available to you and is not yours to change.
mcp-already-shared={0} is already shared with {1}.
mcp-not-shared={0} was not shared with {1}.
