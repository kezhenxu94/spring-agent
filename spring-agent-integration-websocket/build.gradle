plugins {
  id 'springagent.java-library-conventions'
}

description = 'Browser integration for spring-agent-core: a single-page UI over REST, ' +
  'with runs streamed live over STOMP/WebSocket.'

dependencies {
  implementation project(':spring-agent-core')

  // Core's domain models carry `@Enumerated(EnumType.STRING)`, and core declares the JPA API
  // compileOnly so no backend leaks to consumers. javac resolves an annotation's enum arguments
  // when it reads those classes, so without the API here every module that touches a model
  // compiles with `unknown enum constant EnumType.STRING`. compileOnly, not implementation: this
  // is only to let javac read the annotation, nothing runs against it.
  compileOnly 'jakarta.persistence:jakarta.persistence-api'

  implementation 'org.springframework.boot:spring-boot-starter'
  // Declared rather than inherited: spring-agent-core keeps it as `implementation`, so a consumer
  // that serves HTTP of its own has to ask for it. This module is nothing but HTTP.
  implementation 'org.springframework.boot:spring-boot-starter-webmvc'
  // How a run reaches the browser. A STOMP broker over WebSocket rather than the SSE endpoint this
  // module started life with: a consuming application already terminating WebSocket for its own
  // purposes has one connection protocol to secure and proxy rather than two, and SSE's one-way
  // channel meant every reconnect was a fresh HTTP request through the whole filter chain.
  implementation 'org.springframework.boot:spring-boot-starter-websocket'
  // WebUser and WebAuthoritiesMapper read an OAuth2 profile. The consuming application owns the
  // SecurityFilterChain — see WebAuthoritiesMapper — but the types it maps come from here.
  implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'

  implementation 'org.springframework.ai:spring-ai-starter-model-openai'
  implementation libs.spring.ai.agent.utils
  implementation libs.guava
}
